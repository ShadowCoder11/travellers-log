}

const fmtSize = n => n < 1e6 ? `${Math.max(1, Math.round(n / 1e3))} KB` : `${(n / 1e6).toFixed(n < 1e7 ? 1 : 0)} MB`;
async function storageUsage() {
  try { const e = await navigator.storage.estimate(); return e && e.usage != null ? `Using about ${fmtSize(e.usage)} on this device.` : ''; }
  catch (e) { return ''; }
}
const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });

// Step 1: build the file. Step 2 (saveBackup) hands it over on a fresh tap,
// because phones only open the share sheet straight after a tap.
async function makeBackup() {
  if (S.settings.busy) return;
  S.settings.busy = 'export'; S.settings.msg = ''; refreshSheet();
  try {
    const colls = { systems: mineOf('systems'), planets: mineOf('planets'), finds: mineOf('finds') };
    const ids = new Set();
    for (const c in colls) for (const x of colls[c]) for (const id of (x.photos || [])) if (validAssetId(id)) ids.add(id);
    const head = JSON.stringify(Object.assign({ app: 'travellers-log', version: 2, exportedAt: new Date().toISOString() }, colls));
    const parts = [head.slice(0, -1), ',"photos":{'];
    let n = 0;
    for (const id of ids) {
      const rec = await store.get('photos', id);
      if (!rec || !rec.blob) continue;
      parts.push(new Blob([(n ? ',' : '') + JSON.stringify(id) + ':' + JSON.stringify(await blobToDataUrl(rec.blob))]));
      n++;
    }
    parts.push('}}');
    S.settings.backup = { blob: new Blob(parts, { type: 'application/json' }), entries: colls.systems.length + colls.planets.length + colls.finds.length, photos: n, name: `travellers-log-${new Date().toISOString().slice(0, 10)}.json` };
  } catch (e) {
    toast('Couldn’t make the backup file. Try again.');
  }
  S.settings.busy = ''; refreshSheet();
}

async function saveBackup() {
  const b = S.settings.backup; if (!b) return;
  const file = new File([b.blob], b.name, { type: 'application/json' });
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      S.settings.backup = null; S.settings.msg = 'Done. Keep the backup file somewhere safe, like Files or a cloud drive.'; refreshSheet();
      return;
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(b.blob);
  const a = document.createElement('a'); a.href = url; a.download = b.name; a.hidden = true;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  S.settings.backup = null; S.settings.msg = 'Backup file saved to your downloads.'; refreshSheet();
}

async function loadRestore(file) {
  if (!file) return;
  const okId = x => x && typeof x === 'object' && !Array.isArray(x) && typeof x.id === 'string' && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(x.id) && x.id !== '.' && x.id !== '..';
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.systems) || !Array.isArray(j.planets) || !Array.isArray(j.finds)) throw new Error('shape');
    const photos = {};
    if (j.photos && typeof j.photos === 'object') {
      for (const [id, d] of Object.entries(j.photos)) if (validAssetId(id) && typeof d === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,/.test(d)) photos[id] = d;
    }
    S.settings.restore = { systems: j.systems.filter(okId), planets: j.planets.filter(okId), finds: j.finds.filter(okId), photos, photoCount: Object.keys(photos).length };
    S.settings.msg = '';
  } catch (e) {
    S.settings.restore = null; S.settings.msg = '';
    toast('That file isn’t a Traveller’s Log backup.');
  }
  refreshSheet();
}

async function doRestore() {
  const r = S.settings.restore; if (!r || S.settings.busy) return;
  S.settings.busy = 'restore'; refreshSheet();
  let ok = 0, shots = 0, failed = 0;
  const have = new Set(await store.keys('photos').catch(() => []));
  for (const [id, d] of Object.entries(r.photos)) {
    try {
      const blob = await (await fetch(d)).blob();
      await store.put('photos', id, { blob, type: blob.type, createdAt: new Date().toISOString() });
      const u = photoUrls.get(id); if (u) URL.revokeObjectURL(u);
      photoUrls.delete(id); have.add(id); shots++;
    } catch (e) { failed++; }
  }
  for (const [coll, items] of [['systems', r.systems], ['planets', r.planets], ['finds', r.finds]]) {
    for (const item of items) {
      const body = Object.assign({}, item); delete body.id;
      // Screenshots that aren't in the file or on this device would only show as empty tiles
      body.photos = (Array.isArray(body.photos) ? body.photos : []).filter(p => have.has(p));
      try { await store.put(coll, item.id, body); ok++; } catch (e) { failed++; }
    }
  }
  try { await loadAll(); } catch (e) {}
  changed();
  syncOwn();
  const what = `${plural(ok, 'entry', 'entries')}${shots ? ` and ${plural(shots, 'screenshot')}` : ''}`;
  S.settings = freshSettings({ msg: failed ? `Restored ${what}. ${failed} couldn’t be saved.` : `Restored ${what}.` });
  refreshSheet(); render();
}

async function removeExamples() {
  if (S.settings.busy) return;
  S.settings.busy = 'examples'; refreshSheet();
  try {
    for (const coll of ['finds', 'planets', 'systems']) {
      for (const item of all(coll).filter(x => x.example)) {
        await withRetry(() => S.db.collection(coll).doc(item.id).delete());
        S[coll].delete(item.id);
      }
    }
    S.settings = { restore: null, busy: '', confirmExamples: false, msg: 'Examples removed. Your log is ready for your own discoveries.' };
  } catch (e) {
    S.settings.busy = ''; S.settings.msg = ''; toast(explain(e));
  }
  S.stack = S.stack.filter(r => S[COLL[r.type]].has(r.id));
  refreshSheet(); render();
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#lightbox')) { closeLightbox(); return; }
  if (t.closest('#sheet')) { onSheetClick(e); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  const ds = a.dataset;
  switch (ds.act) {
    case 'tab': goTab(ds.tab); break;
    case 'back': back(); break;
    case 'open': go(ds.type, ds.id); break;
    case 'add': openAdd(); break;
    case 'new': openNew(ds.kind, { systemId: ds.system || '', planetId: ds.planet || '' }); break;
    case 'edit': openEdit(ds.type, ds.id); break;
    case 'fav': toggleFav(ds.type, ds.id); break;
    case 'copy': copyText(ds.text); break;
    case 'photo': openLightbox(ds.pid); break;
    case 'settings': openSettings(); break;
    case 'install': doInstall(); break;
    case 'install-later': dismissInstall(); break;
    case 'reload': location.reload(); break;
    case 'remove-examples': openSettings({ examples: true }); break;
    case 'sort': S.filters.sort[ds.list] = ds.sort; render(); break;
    case 'kind': S.filters.findKind = ds.kind; render(); break;
  }
});

function onSheetClick(e) {
  const t = e.target;
  if (t === sheet) { if (sheetState && sheetState.scrimClose) closeSheet(); return; }
  const b = t.closest('[data-sheet],[data-sheet-act],[data-chip],[data-multi],[data-multi-add],[data-glyph],[data-photo-remove],[data-pick-biome]');
  if (!b || b.disabled) return;
  const ds = b.dataset, form = sheetState && sheetState.form;
  if (ds.sheet === 'cancel') { cancelSheet(); return; }
  if (ds.sheet === 'save') { if (sheetState && sheetState.onSave && !(form && form.saving)) sheetState.onSave(); return; }
  if (form && ds.chip) {
    const f = flatFields(SPECS[form.kind]).find(x => x.k === ds.chip);
    form.draft[ds.chip] = (form.draft[ds.chip] === ds.v && !(f && f.noClear)) ? '' : ds.v;
    refreshSheet(); return;
  }
  if (form && ds.multi) {
    const arr = form.draft[ds.multi] || [];
    form.draft[ds.multi] = arr.includes(ds.v) ? arr.filter(x => x !== ds.v) : [...arr, ds.v];
    refreshSheet(); return;
  }
  if (form && ds.multiAdd) { addCustom(form, ds.multiAdd); return; }
  if (form && ds.pickBiome) { form.draft.biome = ds.pickBiome; refreshSheet(); return; }
  if (form && ds.glyph) {
    const g = String(form.draft.glyphs || '');
    form.draft.glyphs = ds.glyph === 'del' ? g.slice(0, -1) : (g.length < 12 ? g + ds.glyph : g);
    updateGlyphField(form); return;
  }
  if (form && ds.photoRemove) {
    const pid = ds.photoRemove;
    form.draft.photos = form.draft.photos.filter(x => x !== pid);
    if (form.uploads.includes(pid)) { form.uploads = form.uploads.filter(x => x !== pid); dropAsset(pid); }
    else form.removed.push(pid);
    refreshSheet(); return;
  }
  switch (ds.sheetAct) {
    case 'new-system': case 'new-planet': case 'new-find': {
      const ctx = (sheetState && sheetState.ctx) || {};
      openNew(ds.sheetAct.slice(4), ctx); break;
    }
    case 'ask-delete': if (form) { form.confirmDelete = true; form.error = ''; refreshSheet(); $('#sheet-body').scrollTop = 0; } break;
    case 'cancel-delete': if (form) { form.confirmDelete = false; refreshSheet(); } break;
    case 'do-delete': if (form && !form.saving) performDelete(form); break;
    case 'export': makeBackup(); break;
    case 'backup-save': saveBackup(); break;
    case 'backup-cancel': S.settings.backup = null; refreshSheet(); break;
    case 'install': doInstall(); break;
    case 'restore-go': doRestore(); break;
    case 'restore-cancel': S.settings.restore = null; refreshSheet(); break;
    case 'examples-ask': S.settings.confirmExamples = true; S.settings.msg = ''; refreshSheet(); break;
    case 'examples-cancel': S.settings.confirmExamples = false; refreshSheet(); break;
    case 'examples-go': removeExamples(); break;
    case 'crew-start': case 'crew-join':
      S.settings.crewMode = ds.sheetAct === 'crew-start' ? 'create' : 'join'; S.settings.crewError = ''; S.settings.msg = '';
      refreshSheet(); setTimeout(() => { const el = $('#crew-name'); if (el && !el.value) el.focus(); else { const c = $('#crew-code'); if (c) c.focus(); } }, 50);
      break;
    case 'crew-cancel': S.settings.crewMode = ''; S.settings.crewError = ''; refreshSheet(); break;
    case 'crew-create-go': createCrew(); break;
    case 'crew-join-go': joinCrew(); break;
    case 'crew-copy': copyText(fmtCode(crew.code)); break;
    case 'crew-share': shareInvite(); break;
    case 'crew-leave-ask': S.settings.crewConfirmLeave = true; S.settings.crewError = ''; refreshSheet(); break;
    case 'crew-leave-cancel': S.settings.crewConfirmLeave = false; refreshSheet(); break;
    case 'crew-leave-go': leaveCrew(); break;
  }
}

function addCustom(form, k) {
  const inp = $(`#f-${k}-add`); if (!inp) return;
  const v = inp.value.trim().replace(/\s+/g, ' ').slice(0, 60);
  if (v && !(form.draft[k] || []).includes(v)) form.draft[k] = [...(form.draft[k] || []), v];
  refreshSheet();
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.filter) { S.filters[t.dataset.filter] = t.value; render(); return; }
  // Crew name and code survive the settings sheet re-drawing
  if (t.id === 'crew-name') { S.settings.crewName = t.value; return; }
  if (t.id === 'crew-code') { S.settings.crewCode = t.value; return; }
  const form = sheetState && sheetState.form; if (!form) return;
  if (t.id === 'f-glyphs') {
    const v = t.value.toUpperCase().replace(/[^0-9A-F]/g, '').slice(0, 12);
    if (v !== t.value) t.value = v;
    form.draft.glyphs = v;
    const disp = $('#glyph-display'); if (disp) disp.innerHTML = glyphStrip(v);
    return;
  }
  if (t.matches('input[data-k], textarea[data-k]')) form.draft[t.dataset.k] = t.value;
  if (t.dataset.k === 'description') updateBiomeGuide(form);
});

document.addEventListener('change', e => {
  const t = e.target, form = sheetState && sheetState.form;
  if (t.id === 'f-photos-in') { if (form && S.assets && t.files.length) addPhotos(form, t.files); t.value = ''; return; }
  if (t.id === 'restore-in') { loadRestore(t.files[0]); t.value = ''; return; }
  if (form && t.dataset.words) {
    const k = t.dataset.words;
    form.other = form.other || {};
    form.other[k] = t.value === '__other';
    form.draft[k] = form.other[k] ? '' : t.value;
    refreshSheet();
    if (form.other[k]) { const o = $(`#f-${k}-other`); if (o) o.focus(); }
    return;
  }
  if (form && t.matches('select[data-k]')) {
    form.draft[t.dataset.k] = t.value;
    if (t.dataset.k === 'systemId' && form.draft.planetId) {
      const p = S.planets.get(form.draft.planetId);
      if (!p || p.systemId !== t.value) form.draft.planetId = '';
    }
    if (t.dataset.rerender) refreshSheet();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!lightbox.hidden) { closeLightbox(); return; }
    if (sheetState && !sheetState.form) closeSheet();
    return;
  }
  if (e.key === 'Enter' && (e.target.id === 'crew-name' || e.target.id === 'crew-code')) {
    e.preventDefault();
    if (S.settings.crewMode === 'create') createCrew(); else if (S.settings.crewMode === 'join') joinCrew();
    return;
  }
  if (e.key === 'Enter' && e.target.id && /^f-.+-add$/.test(e.target.id)) {
    e.preventDefault();
    const form = sheetState && sheetState.form;
    if (form) addCustom(form, e.target.id.slice(2, -4));
  }
});

// The biome guide stays open or closed while the form redraws

/* ---------- Storage: everything is kept on this device, in IndexedDB ---------- */
const STORES = ['systems', 'planets', 'finds', 'photos', 'meta'];
let idb = null, bc = null;
const newId = () => { const a = new Uint8Array(12); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); };

function openIdb() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error('no indexedDB')); return; }
    const req = indexedDB.open('travellers-log', 1);
    req.onupgradeneeded = () => { for (const s of STORES) if (!req.result.objectStoreNames.contains(s)) req.result.createObjectStore(s); };
    req.onsuccess = () => { const d = req.result; d.onversionchange = () => d.close(); res(d); };
    req.onerror = () => rej(req.error);
    req.onblocked = () => rej(new Error('blocked'));
  });
}
// Runs fn inside one transaction and resolves with what fn returned, once the transaction has committed
function tx(names, mode, fn) {
  return new Promise((res, rej) => {
    let t, out;
    try { t = idb.transaction(names, mode); } catch (e) { rej(e); return; }
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('aborted'));
    try { out = fn(t); } catch (e) { try { t.abort(); } catch (_) {} rej(e); }
  });
}
const store = {
  get: (name, id) => tx([name], 'readonly', t => { const box = {}; t.objectStore(name).get(id).onsuccess = e => { box.v = e.target.result; }; return box; }).then(b => b.v),
  keys: name => tx([name], 'readonly', t => { const box = {}; t.objectStore(name).getAllKeys().onsuccess = e => { box.v = e.target.result; }; return box; }).then(b => b.v || []),
  entries: name => tx([name], 'readonly', t => { const out = []; t.objectStore(name).openCursor().onsuccess = e => { const c = e.target.result; if (c) { out.push([c.key, c.value]); c.continue(); } }; return out; }),
  put: (name, id, v) => tx([name], 'readwrite', t => { t.objectStore(name).put(v, id); }),
  del: (name, id) => tx([name], 'readwrite', t => { t.objectStore(name).delete(id); }),
};
// Other open windows of the app reload when this one saves something
function changed() { if (bc) { try { bc.postMessage('changed'); } catch (e) {} } }

// The same calls the claude.ai version makes, answered from this device
const localDb = {
  collection: coll => ({
    doc: id => {
      const docId = id || newId();
      return {
        id: docId,
        set: body => store.put(coll, docId, body).then(() => { changed(); pushOwn(coll, Object.assign({}, body, { id: docId })); }),
        update: patch => store.get(coll, docId).then(cur => {
          if (!cur) throw { code: 'not_found' };
          return store.put(coll, docId, Object.assign({}, cur, patch));
        }).then(changed),
        delete: () => store.del(coll, docId).then(() => { changed(); dropOwn(coll, docId); }),
      };
    },
  }),
};

async function loadAll() {
  for (const coll of ['systems', 'planets', 'finds']) {
    const rows = await store.entries(coll);
    S[coll] = new Map(rows.map(([id, v]) => [id, Object.assign({}, v, { id })]));
    S.loaded[coll] = true;
  }
  applyCrew();
}
async function seedOnce() {
  if (await store.get('meta', 'seeded')) return;
  await tx(['systems', 'planets', 'finds', 'meta'], 'readwrite', t => {
    for (const coll of ['systems', 'planets', 'finds']) for (const d of SEED[coll]) { const b = Object.assign({}, d); delete b.id; t.objectStore(coll).put(b, d.id); }
    t.objectStore('meta').put(new Date().toISOString(), 'seeded');
  });
}

// Firebase loads only once someone starts or joins a crew
let fbLoading = null;
function loadFirebase() {
  if (!fbLoading) fbLoading = (async () => {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VER}/`;
    const [appM, authM, fs] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(f => import(base + f)));
    const app = appM.getApps().length ? appM.getApp() : appM.initializeApp(FIREBASE_CONFIG);
    let db;
    try { db = fs.initializeFirestore(app, { ignoreUndefinedProperties: true, localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
    catch (e) { db = fs.getFirestore(app); }
    // Each phone gets an anonymous account, so nobody needs to sign up
    const auth = authM.getAuth(app);
    await auth.authStateReady();
    if (!auth.currentUser) await authM.signInAnonymously(auth);
    crew.uid = auth.currentUser.uid;
    return (crew.fb = { fs, db });
  })().catch(e => { fbLoading = null; throw e; });
  return fbLoading;
}

function crewChanged() { scheduleRender(); if (settingsOpen()) refreshSheet(); }
function stopCrew() { crew.unsubs.forEach(u => { try { u(); } catch (e) {} }); crew.unsubs = []; }

async function restoreCrew() {
  try { crew.name = (await store.get('meta', 'crew-name')) || ''; } catch (e) {}
  if (!FIREBASE_CONFIG) return;
  let saved = null;
  try { saved = await store.get('meta', 'crew'); } catch (e) {}
  if (saved && saved.code) { crew.code = saved.code; crew.name = saved.name || crew.name; connectCrew(); }
}
window.addEventListener('online', () => { if (FIREBASE_CONFIG && crew.code && !crewOn()) connectCrew(); });

async function connectCrew() {
  if (!FIREBASE_CONFIG || !crew.code) return;
  crew.status = 'connecting'; crew.error = ''; crewChanged();
  let fb;
  try { fb = await loadFirebase(); }
  catch (e) { crew.status = 'offline'; crewChanged(); return; }   // tries again when the phone is back online
  const { fs, db } = fb, code = crew.code;
  stopCrew();
  const onErr = err => {
    crew.status = 'error';
    crew.error = err && err.code === 'permission-denied' ? 'You’re not in this crew any more. Leave it, then join again with the code.' : 'Can’t reach the crew right now.';
    crewChanged();
  };
  crew.unsubs.push(fs.onSnapshot(fs.collection(db, 'crews', code, 'members'), snap => {
    crew.members = new Map(snap.docs.map(d => [d.id, cleanName((d.data() || {}).name) || 'Traveller']));
    crewChanged();
  }, onErr));
  crew.unsubs.push(fs.onSnapshot(fs.collection(db, 'crews', code, 'items'), { includeMetadataChanges: true }, snap => {
    const before = crew.status;
    crew.status = snap.metadata.fromCache ? 'offline' : 'live';
    crew.docs = snap.docs.map(d => d.data());
    buildCrewItems();
    scheduleRender();
    if (before !== crew.status && settingsOpen()) refreshSheet();
  }, onErr));
  syncOwn();
}

// Crewmates' entries are other people's data: keep only plain fields of sane size
function cleanShared(data) {
  const o = {};
  if (!data || typeof data !== 'object') return o;
  for (const [k, v] of Object.entries(data)) {
    if (!/^[a-zA-Z]{1,30}$/.test(k)) continue;
    if (typeof v === 'string') o[k] = v.slice(0, 5000);
    else if (typeof v === 'number' && Number.isFinite(v)) o[k] = v;
    else if (typeof v === 'boolean' || v === null) o[k] = v;
    else if (Array.isArray(v)) o[k] = v.filter(x => typeof x === 'string').slice(0, 100).map(x => x.slice(0, 200));
  }
  return o;
}
function buildCrewItems() {
  const items = { systems: new Map(), planets: new Map(), finds: new Map() };
  for (const d of crew.docs) {
    if (!d || typeof d.owner !== 'string' || d.owner === crew.uid || typeof d.id !== 'string' || !hasOwn(COLL, d.type)) continue;
    const pre = d.owner + '~';
    const v = Object.assign(cleanShared(d.data), { id: pre + d.id, _crew: true, _owner: d.owner, photos: [], favorite: false, example: false });
    if (typeof v.systemId === 'string' && v.systemId) v.systemId = pre + v.systemId;
    if (typeof v.planetId === 'string' && v.planetId) v.planetId = pre + v.planetId;
    if (d.type === 'find' && !hasOwn(KIND_LABEL, v.kind)) v.kind = 'other';
    if (!['S', 'A', 'B', 'C'].includes(v.cls)) v.cls = '';
    items[COLL[d.type]].set(v.id, v);
  }
  crew.items = items;
  applyCrew();
}
// Your own entries plus the crew's, in the lists the views read from
function applyCrew() {
  for (const c of ['systems', 'planets', 'finds']) {
    const m = new Map();
    for (const [id, v] of S[c]) if (!v._crew) m.set(id, v);
    for (const [id, v] of crew.items[c]) m.set(id, v);
    S[c] = m;
  }
}

// Sending your own entries. Screenshots, stars and example entries stay on this phone.
function shareData(item) {
  const d = Object.assign({}, item);
  for (const k of ['id', 'photos', 'favorite', 'example', '_crew', '_owner']) delete d[k];
  return d;
}
const crewKey = (type, id) => `${crew.uid}_${type}_${id}`;
const crewPayload = (type, item) => ({ owner: crew.uid, type, id: item.id, data: shareData(item), updatedAt: item.updatedAt || '' });
function pushOwn(coll, item) {
  if (!crewOn() || !item || item._crew || item.example) return;
  const { fs, db } = crew.fb, type = TYPE_OF[coll];
  fs.setDoc(fs.doc(db, 'crews', crew.code, 'items', crewKey(type, item.id)), crewPayload(type, item)).catch(() => {});
}
function dropOwn(coll, id) {
  if (!crewOn()) return;
  const { fs, db } = crew.fb;
  fs.deleteDoc(fs.doc(db, 'crews', crew.code, 'items', crewKey(TYPE_OF[coll], id))).catch(() => {});
}
// Makes the crew's copy of your log match your phone (after joining, restoring, or time offline)
async function syncOwn() {
  if (!crewOn()) return;
  const { fs, db } = crew.fb, code = crew.code;
  try {
    const snap = await fs.getDocs(fs.query(fs.collection(db, 'crews', code, 'items'), fs.where('owner', '==', crew.uid)));
    const remote = new Map(snap.docs.map(d => [d.id, d.data()]));
    const writes = [];
    for (const coll of ['systems', 'planets', 'finds']) {
      const type = TYPE_OF[coll];
      for (const it of mineOf(coll)) {
        if (it.example) continue;
        const key = crewKey(type, it.id), r = remote.get(key);
        remote.delete(key);
        if (!r || r.updatedAt !== (it.updatedAt || '')) writes.push(b => b.set(fs.doc(db, 'crews', code, 'items', key), crewPayload(type, it)));
      }
    }
    for (const key of remote.keys()) writes.push(b => b.delete(fs.doc(db, 'crews', code, 'items', key)));
    for (let i = 0; i < writes.length; i += 200) {
      const b = fs.writeBatch(db);
      writes.slice(i, i + 200).forEach(w => w(b));
      await b.commit();
    }
  } catch (e) { /* tries again next time the app opens */ }
}

async function saveCrew(code, name) {
  crew.code = code; crew.name = name;
  try { await store.put('meta', 'crew', code ? { code, name } : null); } catch (e) {}
  if (name) store.put('meta', 'crew-name', name).catch(() => {});
}
function crewFail(msg) { S.settings.busy = ''; S.settings.crewError = msg; refreshSheet(); }
function crewErrorText(e) {
  const c = e && e.code;
  if (c === 'timeout' || c === 'unavailable' || !navigator.onLine) return 'Couldn’t reach the crew server. Check your internet and try again.';
  if (c === 'permission-denied') return 'The crew server said no. Check the code and try again.';
  return 'Something went wrong. Try again in a moment.';
}

async function createCrew() {
  const st = S.settings, name = cleanName(st.crewName);
  if (!name) return crewFail('Enter your name first, so your crew can see who logged what.');
  st.busy = 'crew'; st.crewError = ''; refreshSheet();
  try {
    const { fs, db } = await withTimeout(loadFirebase(), 20000);
    let code = '';
    for (let i = 0; i < 3 && !code; i++) {
      const c = makeCode();
      try { await withTimeout(fs.setDoc(fs.doc(db, 'crews', c), { createdBy: crew.uid, createdAt: fs.serverTimestamp() }), 15000); code = c; }
      catch (e) { if (!e || e.code !== 'permission-denied') throw e; }   // that code is taken: try another
    }
    if (!code) throw { code: 'unavailable' };
    await withTimeout(fs.setDoc(fs.doc(db, 'crews', code, 'members', crew.uid), { name, joinedAt: fs.serverTimestamp() }), 15000);
    await saveCrew(code, name);
  } catch (e) { return crewFail(crewErrorText(e)); }
  S.settings = freshSettings({ msg: `Crew started. Invite your friends with the code ${fmtCode(crew.code)}.` });
  connectCrew(); refreshSheet(); render();
}

async function joinCrew() {
  const st = S.settings, name = cleanName(st.crewName), code = normCode(st.crewCode);
  if (!name) return crewFail('Enter your name first, so your crew can see who logged what.');
  if (code.length !== 8) return crewFail('A crew code has 8 letters and numbers, like K7Q2-MXP9.');
  st.busy = 'crew'; st.crewError = ''; refreshSheet();
  try {
    const { fs, db } = await withTimeout(loadFirebase(), 20000);
    const snap = await withTimeout(fs.getDocFromServer(fs.doc(db, 'crews', code)), 15000);
    if (!snap.exists()) return crewFail('No crew has that code. Check it with your friend.');
    await withTimeout(fs.setDoc(fs.doc(db, 'crews', code, 'members', crew.uid), { name, joinedAt: fs.serverTimestamp() }), 15000);
    await saveCrew(code, name);
  } catch (e) { return crewFail(crewErrorText(e)); }
  S.settings = freshSettings({ msg: 'You joined the crew. Your discoveries and theirs now update live for everyone.' });
  connectCrew(); refreshSheet(); render();
}

async function leaveCrew() {
  const st = S.settings;
  st.busy = 'crew'; st.crewError = ''; refreshSheet();
  try {
    const { fs, db } = await withTimeout(loadFirebase(), 20000), code = crew.code;
    const snap = await withTimeout(fs.getDocs(fs.query(fs.collection(db, 'crews', code, 'items'), fs.where('owner', '==', crew.uid))), 15000);
    for (let i = 0; i < snap.docs.length; i += 200) {
      const b = fs.writeBatch(db);
      snap.docs.slice(i, i + 200).forEach(d => b.delete(d.ref));
      await withTimeout(b.commit(), 15000);
    }
    await withTimeout(fs.deleteDoc(fs.doc(db, 'crews', code, 'members', crew.uid)), 15000);
  } catch (e) { return crewFail('Couldn’t reach the crew server to leave. Check your internet and try again.'); }
  stopCrew();
  await saveCrew('', crew.name);
  crew.status = 'off'; crew.members = new Map(); crew.docs = [];
  crew.items = { systems: new Map(), planets: new Map(), finds: new Map() };
  applyCrew();
  S.stack = S.stack.filter(r => S[COLL[r.type]].has(r.id));
  S.settings = freshSettings({ msg: 'You left the crew. Your own log is still here.' });
  refreshSheet(); render();
}

function shareInvite() {
  const url = location.origin + location.pathname;
  const text = `Join my No Man's Sky crew in Traveller's Log! Open ${url} and add it to your home screen, then go to Settings → Crew → Join with a code and enter ${fmtCode(crew.code)}`;
  if (navigator.share) { navigator.share({ title: "Traveller's Log crew", text }).catch(() => {}); return; }
  try { navigator.clipboard.writeText(text).then(() => toast('Invite copied. Paste it to your friends.'), () => toast(`Your crew code is ${fmtCode(crew.code)}`)); }
  catch (e) { toast(`Your crew code is ${fmtCode(crew.code)}`); }
}

function renderCrewSettings() {
  const st = S.settings, busy = st.busy === 'crew';
  const err = st.crewError ? `<div class="form-error" role="alert">${esc(st.crewError)}</div>` : '';
  if (crew.code) {
    const names = [...crew.members].map(([uid, n]) => uid === crew.uid ? `${n} (you)` : n);
    const status = { live: 'Live', connecting: 'Connecting…', offline: 'Offline. Changes sync when you’re back online.', error: crew.error, off: '' }[crew.status] || '';
    return `<section class="set"><h3>Crew</h3>${err}
      <div class="crew-code"><span class="mono">${esc(fmtCode(crew.code))}</span><button type="button" class="link-btn" data-sheet-act="crew-copy">Copy code</button></div>
      <p>Friends join in Settings → Crew → Join with a code. Everyone sees each other's systems, planets and finds as they're logged.</p>
      <button type="button" class="btn btn-primary" data-sheet-act="crew-share">${icon('share')}Invite friends</button>
      <p class="hint"><span class="live-dot ${crew.status}"></span>${esc(status)}${names.length ? ` · ${esc(names.join(', '))}` : ''}</p>
      ${st.crewConfirmLeave
        ? `<p>Leave the crew? Your discoveries are taken out of it, and theirs leave your lists. Your own log stays.</p><div class="confirm-actions"><button type="button" class="btn btn-danger-solid" data-sheet-act="crew-leave-go"${busy ? ' disabled' : ''}>${busy ? 'Leaving…' : 'Leave crew'}</button><button type="button" class="btn" data-sheet-act="crew-leave-cancel">Stay</button></div>`
        : '<button type="button" class="btn btn-danger" data-sheet-act="crew-leave-ask">Leave crew</button>'}</section>`;
  }
  const intro = '<p>Share discoveries with friends. Everyone in a crew sees each other\'s systems, planets and finds, updating live. Screenshots stay on each phone.</p>';
  const nameField = `<label class="field" for="crew-name"><span class="lbl">Your name in the crew</span><input class="input" id="crew-name" value="${esc(st.crewName)}" maxlength="40" placeholder="Your in-game name" autocomplete="nickname" autocapitalize="words" enterkeyhint="go"></label>`;
  if (st.crewMode === 'create') {
    return `<section class="set"><h3>Start a crew</h3>${err}${nameField}<div class="confirm-actions"><button type="button" class="btn btn-primary" data-sheet-act="crew-create-go"${busy ? ' disabled' : ''}>${busy ? 'Starting…' : 'Start crew'}</button><button type="button" class="btn" data-sheet-act="crew-cancel">Cancel</button></div></section>`;
  }
  if (st.crewMode === 'join') {
    return `<section class="set"><h3>Join a crew</h3>${err}${nameField}<label class="field" for="crew-code"><span class="lbl">Crew code</span><input class="input mono" id="crew-code" value="${esc(st.crewCode)}" maxlength="12" placeholder="K7Q2-MXP9" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go"></label><div class="confirm-actions"><button type="button" class="btn btn-primary" data-sheet-act="crew-join-go"${busy ? ' disabled' : ''}>${busy ? 'Joining…' : 'Join crew'}</button><button type="button" class="btn" data-sheet-act="crew-cancel">Cancel</button></div></section>`;
  }
  return `<section class="set"><h3>Crew</h3>${intro}${err}<div class="confirm-actions"><button type="button" class="btn btn-primary" data-sheet-act="crew-start">Start a crew</button><button type="button" class="btn" data-sheet-act="crew-join">Join with a code</button></div></section>`;
}

/* ---------- Installing ---------- */
const IS_IOS = document.documentElement.classList.contains('ios');
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  scheduleRender(); if (sheetState && !sheetState.form) refreshSheet();
});
window.addEventListener('appinstalled', () => { installEvt = null; dismissInstall(); toast('Installed. Open Traveller’s Log from your home screen.'); });
function installDismissed() { try { return localStorage.getItem('install-dismissed') === '1'; } catch (e) { return false; } }
function dismissInstall() { try { localStorage.setItem('install-dismissed', '1'); } catch (e) {} S.installHidden = true; scheduleRender(); }
function installText() {
  if (installEvt) return 'It gets its own icon on your home screen, opens full screen and works offline.';
  if (IS_IOS) return `In Safari, tap Share ${icon('share', 'inline-ic')} then <b>Add to Home Screen</b>. Do it before you log anything: entries saved in Safari don't carry over to the home-screen app.`;
  return 'Open your browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>. It then opens full screen and works offline.';
}
function installBanner() {
  if (S.status !== 'ready' || isStandalone() || S.installHidden || installDismissed()) return '';
  return `<div class="banner col"><div><b>Install it as an app</b><p>${installText()}</p></div><div class="banner-actions">${installEvt ? '<button class="btn btn-primary btn-sm" data-act="install">Install</button>' : ''}<button class="btn btn-sm" data-act="install-later">Not now</button></div></div>`;
}
async function doInstall() {
  const e = installEvt; if (!e) return;
  installEvt = null;
  try { e.prompt(); await e.userChoice; } catch (err) {}
  render(); if (sheetState && !sheetState.form) refreshSheet();
}

async function boot() {
  document.querySelectorAll('[data-icon]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon)));
  render();
  try {
    idb = await openIdb();
    await seedOnce();
    await loadAll();
    S.db = localDb; S.assets = true; S.status = 'ready';
    restoreCrew();
  } catch (e) {
    S.status = 'unsupported';
  }
  render();
  try {
    bc = new BroadcastChannel('travellers-log');
    bc.onmessage = () => loadAll().then(() => { render(); if (sheetState && !sheetState.form) refreshSheet(); }, () => {});
  } catch (e) {}
  // Ask the browser not to clear the log when the phone runs low on space
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {}); } catch (e) {}
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  // sw.js says so when it has just downloaded a newer version of the app
  navigator.serviceWorker.addEventListener('message', e => { if (e.data === 'update-ready') $('#update-bar').hidden = false; });
  try { navigator.serviceWorker.startMessages(); } catch (e) {}
}
boot();
})();
</script>
