<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traveller's Log</title>
<meta name="description" content="Log the star systems, planets, moons and finds from your No Man's Sky travels.">
<meta name="theme-color" content="#100E22" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F1F9" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Traveller's Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script>
// Marks iPhone and iPad, so the install tips show the Safari steps.
// No "status bar style" tag on purpose: on iOS 26 it shifts the layout and leaves a dark bar under the tabs,
// while without it the status bar simply takes the page's own background colour.
if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) document.documentElement.classList.add('ios');
</script>
<style>
/* Layout: one-column phone app (max 640px). Sticky top bar, scrolling view, fixed bottom tabs,
   floating Add button, bottom-sheet forms. Dark-first deep-space hull with a sunset-orange flare. */
:root{
  color-scheme: dark;
  --void:#100E22; --hull:#1B1934; --hull-2:#27243F; --line:#3A355E; --line-soft:#2B2848;
  --text:#EFEBFA; --muted:#A6A1C4; --faint:#7C779B;
  --flare:#FF8B4E; --flare-ink:#1C0E04; --flare-soft:rgba(255,139,78,.13);
  --scan:#62D8D1; --danger:#FF6F7D; --warn:#FFC857;
  --star-yellow:#FFD45C; --star-red:#FF6A4D; --star-green:#6EE07A; --star-blue:#6FAEFF; --star-purple:#BD8EFF;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --scrim:rgba(6,5,16,.66); --lightbox:rgba(5,4,12,.94); --on-photo:#FFFFFF;
  --f-display:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r-m:12px; --r-l:18px; --tabbar-h:62px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --void:#F3F1F9; --hull:#FFFFFF; --hull-2:#ECE9F5; --line:#D3CEE5; --line-soft:#E3DFEE;
    --text:#1A1834; --muted:#5D5880; --faint:#8984A6;
    --flare:#C2501A; --flare-ink:#FFFFFF; --flare-soft:rgba(194,80,26,.09);
    --scan:#11807A; --danger:#C3304A; --warn:#946400;
    --star-yellow:#E0A800; --star-red:#DD4528; --star-green:#2F9F45; --star-blue:#2F70D8; --star-purple:#8A56E0;
    --shadow:0 12px 32px rgba(40,30,80,.16); --scrim:rgba(26,24,52,.42);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --void:#F3F1F9; --hull:#FFFFFF; --hull-2:#ECE9F5; --line:#D3CEE5; --line-soft:#E3DFEE;
  --text:#1A1834; --muted:#5D5880; --faint:#8984A6;
  --flare:#C2501A; --flare-ink:#FFFFFF; --flare-soft:rgba(194,80,26,.09);
  --scan:#11807A; --danger:#C3304A; --warn:#946400;
  --star-yellow:#E0A800; --star-red:#DD4528; --star-green:#2F9F45; --star-blue:#2F70D8; --star-purple:#8A56E0;
  --shadow:0 12px 32px rgba(40,30,80,.16); --scrim:rgba(26,24,52,.42);
}

*,*::before,*::after{ box-sizing:border-box }
[hidden]{ display:none !important }
html{ -webkit-text-size-adjust:100% }
html.sheet-open{ overflow:hidden }
html{ background:var(--void) }
@media (display-mode: standalone){ html{ overscroll-behavior-y:none } }
body{ margin:0; background:var(--void); color:var(--text); font-family:var(--f-body); font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:40; background:var(--void) }
button{ font:inherit; color:inherit }
button:disabled{ cursor:default }
:focus-visible{ outline:2px solid var(--flare); outline-offset:2px }
.wrap{ width:100%; max-width:640px; margin-inline:auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)) }
.vh{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }
.ic{ width:22px; height:22px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
.ic .f{ fill:currentColor; stroke:none }

/* Top bar */
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--void); border-bottom:1px solid var(--line-soft) }
.topbar-inner{ display:flex; align-items:center; gap:6px; min-height:56px }
.top-title{ flex:1; min-width:0; margin:0; font-family:var(--f-display); font-weight:600; font-size:20px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.icon-btn{ width:44px; height:44px; flex:none; display:grid; place-items:center; border:0; border-radius:12px; background:transparent; color:var(--text); cursor:pointer }
.icon-btn:hover{ background:var(--hull) }
#btn-back{ margin-left:-10px }
.top-btn{ display:inline-flex; align-items:center; gap:6px; min-height:38px; padding:0 14px 0 10px; border-radius:10px; border:1px solid var(--line); background:var(--hull); color:var(--text); font-weight:700; font-size:15px; cursor:pointer }
.top-btn .ic{ width:18px; height:18px }
.ro-pill{ flex:none; font-family:var(--f-display); font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 10px }

/* View */
#view{ padding-block:16px calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom,0px)); overflow-x:hidden; overflow-x:clip }
#view-head:not(:empty){ margin-bottom:16px }
#view-body{ display:grid; gap:22px; min-width:0 }
.stack{ display:grid; gap:10px; min-width:0 }
.section{ display:grid; gap:10px; min-width:0 }
.section-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:32px }
.section-head h3, .set h3{ margin:0; font-family:var(--f-display); font-size:13px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted) }
.count{ color:var(--faint); font-family:var(--f-mono); font-size:12px; letter-spacing:0; font-variant-numeric:tabular-nums; margin-left:4px }
.link-btn{ display:inline-flex; align-items:center; gap:4px; background:none; border:0; padding:6px 2px; color:var(--flare); font-weight:700; font-size:15px; cursor:pointer }
.link-btn .ic{ width:18px; height:18px; stroke-width:2.2 }
.muted-note{ margin:0; color:var(--muted); font-size:15px }
.meta{ margin:0; color:var(--faint); font-size:13px }

/* Search */
.search{ position:relative }
.search .ic{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--faint); width:20px; height:20px; pointer-events:none }
.search .input{ padding-left:42px }

/* Lists */
.list{ background:var(--hull); border:1px solid var(--line-soft); border-radius:var(--r-l); overflow:hidden; min-width:0 }
.row{ display:flex; align-items:center; gap:12px; width:100%; min-height:62px; padding:10px 12px 10px 14px; border:0; background:none; text-align:left; cursor:pointer }
.row + .row{ border-top:1px solid var(--line-soft) }
.row:hover{ background:var(--hull-2) }
.row-main{ flex:1; min-width:0; display:grid }
.row-title{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.row-sub{ color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.row-end{ flex:none; display:flex; align-items:center; gap:6px }
.ic.ic-fav{ width:16px; height:16px; color:var(--flare); fill:currentColor }
.ic.ic-chev{ width:18px; height:18px; color:var(--faint) }
.list-bar{ display:flex; align-items:center; justify-content:space-between; gap:12px }
.list-bar .count{ font-size:13px; margin:0 }
.seg{ display:inline-flex; padding:3px; border-radius:10px; background:var(--hull); border:1px solid var(--line-soft) }
.seg-btn{ border:0; background:transparent; padding:4px 12px; border-radius:7px; font-size:14px; font-weight:700; color:var(--muted); cursor:pointer }
.seg-btn[aria-pressed="true"]{ background:var(--hull-2); color:var(--text) }

/* Bodies: stars, worlds, finds */
.star-dot{ width:36px; height:36px; flex:none; border-radius:50%; background:radial-gradient(circle, #FFFFFF 0 12%, var(--star) 30%, color-mix(in srgb, var(--star) 30%, transparent) 52%, transparent 72%) }
.disc{ width:30px; height:30px; margin:3px; flex:none; border-radius:50%; background:radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--biome) 50%, #FFFFFF) 0, var(--biome) 46%, color-mix(in srgb, var(--biome) 45%, #000000) 100%) }
.disc.moon{ width:20px; height:20px; margin:8px }
.kind-tile{ width:36px; height:36px; flex:none; display:grid; place-items:center; border-radius:10px; background:var(--hull-2); color:var(--scan) }
.kind-tile .ic{ width:20px; height:20px }
.badge{ display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:6px; border:1px solid var(--line); font-family:var(--f-mono); font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); white-space:nowrap }
.badge-warn{ color:var(--warn); border-color:color-mix(in srgb, var(--warn) 45%, transparent) }
.badge-cls{ color:var(--text) }
.badge-cls.s{ color:var(--flare); border-color:color-mix(in srgb, var(--flare) 55%, transparent) }

/* Log home */
.totals{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px }
.total{ display:grid; justify-items:start; gap:0; padding:10px 12px; border-radius:var(--r-m); border:1px solid var(--line-soft); background:var(--hull); text-align:left; cursor:pointer; min-width:0 }
.total b{ font-family:var(--f-display); font-weight:600; font-size:26px; line-height:1.15; font-variant-numeric:tabular-nums }
.total span{ font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100% }
.banner{ display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:var(--r-l); background:var(--flare-soft); border:1px solid color-mix(in srgb, var(--flare) 28%, transparent) }
.banner > div{ flex:1; min-width:0 }
.banner p{ margin:2px 0 0; color:var(--muted); font-size:14px }
.banner-warn{ background:color-mix(in srgb, var(--warn) 11%, transparent); border-color:color-mix(in srgb, var(--warn) 35%, transparent) }
.banner.col{ flex-direction:column; align-items:stretch; gap:10px }
.banner-actions{ display:flex; flex-wrap:wrap; gap:8px }
.ic.inline-ic{ width:18px; height:18px; vertical-align:-4px }
.loading{ display:flex; align-items:center; gap:12px; color:var(--muted); padding:24px 4px }
.pulse{ width:12px; height:12px; border-radius:50%; background:var(--scan); animation:pulse 1.2s ease-in-out infinite }
.empty{ display:grid; gap:10px; justify-items:start; padding:24px 20px; border:1px dashed var(--line); border-radius:var(--r-l) }
.empty h3{ margin:0; font-family:var(--f-display); font-size:22px; font-weight:600; text-wrap:balance }
.empty p{ margin:0; color:var(--muted); max-width:52ch }

/* Detail hero */
.hero{ position:relative; display:grid; gap:6px; padding-top:4px; min-height:100px; isolation:isolate }
.hero > .eyebrow, .hero > h2, .hero > .hero-sub{ padding-right:108px }
.eyebrow{ margin:0; font-family:var(--f-display); font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted) }
.hero h2{ margin:0; font-family:var(--f-display); font-weight:700; font-size:clamp(28px, 7.4vw, 40px); line-height:1.08; text-wrap:balance; overflow-wrap:anywhere }
.hero-sub{ margin:0; color:var(--muted) }
.orb{ position:absolute; top:-8px; right:-8px; width:118px; max-width:40%; aspect-ratio:1; border-radius:50%; z-index:-1; pointer-events:none;
  background:radial-gradient(circle, #FFFFFF 0 7%, var(--star) 21%, color-mix(in srgb, var(--star) 38%, transparent) 40%, transparent 68%);
  animation:flare-in .9s cubic-bezier(.2,.7,.2,1) both }
.orb::after{ content:""; position:absolute; inset:-35%; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--star) 16%, transparent), transparent 62%) }
.orb.planet{ width:92px; top:4px; right:4px; background:radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--biome) 50%, #FFFFFF) 0, var(--biome) 46%, color-mix(in srgb, var(--biome) 42%, #000000) 100%); box-shadow:0 0 44px -10px var(--biome) }
.orb.planet.moon{ width:62px; top:16px; right:18px }
.orb.planet::after{ display:none }
.hero .kind-tile.xl{ position:absolute; top:6px; right:4px; width:74px; height:74px; border-radius:22px }
.kind-tile.xl .ic{ width:38px; height:38px; stroke-width:1.6 }
.hero-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:6px }
.crumbs{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px }
.crumb{ display:inline-flex; align-items:center; gap:8px; min-height:36px; max-width:100%; padding:0 10px 0 8px; border-radius:999px; border:1px solid var(--line); background:var(--hull); font-size:14px; font-weight:700; cursor:pointer }
.crumb > span:not([class]){ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0 }
.crumb .star-dot{ width:20px; height:20px }
.crumb .disc{ width:16px; height:16px; margin:2px }
.crumb .ic{ width:16px; height:16px; color:var(--faint) }

/* Crews */
.badge-crew{ color:var(--scan); border-color:color-mix(in srgb, var(--scan) 40%, transparent); text-transform:none; letter-spacing:0; max-width:96px }
.badge-crew > span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.hero .badge-crew{ max-width:100% }
.set .field{ justify-self:stretch }
.crew-code{ display:flex; align-items:center; gap:14px }
.crew-code .mono{ font-size:26px; letter-spacing:.12em }
.live-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--faint); vertical-align:1px }
.live-dot.live{ background:var(--scan) }
.live-pill{ font-family:var(--f-mono); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint) }
.live-pill.live{ color:var(--scan) }

/* Biome guide in the planet form */
.guide{ border:1px solid var(--line-soft); border-radius:var(--r-m); background:var(--hull) }
.guide > summary{ display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; min-height:44px; padding:8px 12px; cursor:pointer; list-style:none; color:var(--flare); font-weight:700; font-size:15px }
.guide > summary::-webkit-details-marker{ display:none }
.guide > summary::before{ content:""; width:7px; height:7px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(-45deg); transition:transform .15s; margin-right:2px }
.guide[open] > summary::before{ transform:rotate(45deg) }
.guide-hint{ color:var(--scan); font-size:13px; font-weight:700 }
.guide-body{ display:grid; gap:10px; padding:0 10px 10px }
.guide-body p{ margin:0 2px; font-size:14px; color:var(--muted) }
.guide-list{ display:grid; gap:6px }
.guide-row{ display:flex; align-items:flex-start; gap:10px; width:100%; padding:8px 10px; border-radius:10px; border:1px solid transparent; background:var(--hull-2); color:var(--text); text-align:left; cursor:pointer }
.guide-row .sw{ flex:none; width:12px; height:12px; margin-top:5px; border-radius:50%; background:var(--sw) }
.guide-row b{ font-size:15px }
.guide-row small{ display:block; color:var(--muted); font-size:13px; line-height:1.45 }
.guide-row em{ margin-left:8px; font-style:normal; font-size:12px; font-weight:700; color:var(--scan) }
.guide-row.match{ border-color:var(--scan) }
.guide-row[aria-pressed="true"]{ border-color:var(--flare) }

.stats{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; margin:0; background:var(--line-soft); border:1px solid var(--line-soft); border-radius:var(--r-l); overflow:hidden }
.stats > div{ background:var(--hull); padding:10px 14px; min-width:0 }
.stats > div:last-child:nth-child(odd){ grid-column:1 / -1 }
.stats dt{ font-family:var(--f-display); font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted) }
.stats dd{ margin:2px 0 0; font-weight:700; overflow-wrap:anywhere }
.mono{ font-family:var(--f-mono); font-weight:600; letter-spacing:.03em }
.notes{ margin:0; white-space:pre-wrap; overflow-wrap:anywhere; padding:12px 14px; border-radius:var(--r-l); background:var(--hull); border:1px solid var(--line-soft); max-width:65ch }
.tags{ display:flex; flex-wrap:wrap; gap:6px }
.tag{ padding:4px 10px; border-radius:999px; background:var(--hull); border:1px solid var(--line-soft); font-size:14px }
.fauna{ display:grid; gap:8px; padding:12px 14px; border-radius:var(--r-l); background:var(--hull); border:1px solid var(--line-soft) }
.fauna-line{ display:flex; justify-content:space-between; gap:12px; font-size:15px }
.fauna-line b{ font-family:var(--f-mono); font-variant-numeric:tabular-nums }
.meter{ height:6px; border-radius:3px; background:var(--hull-2); overflow:hidden }
.meter > i{ display:block; height:100%; border-radius:3px; background:var(--scan) }
.coords{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; border-radius:var(--r-l); background:var(--hull); border:1px solid var(--line-soft) }
.coords .mono{ font-size:17px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; min-width:0 }

/* Portal glyphs */
.glyphs{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:3px }
.glyph{ aspect-ratio:1; max-width:100%; display:grid; place-items:center; border-radius:6px; background:var(--hull); border:1px solid var(--line-soft); color:var(--text) }
.glyph .ic{ width:74%; height:74%; stroke-width:1.6 }
.glyph.empty{ background:transparent; border-style:dashed; border-color:var(--line) }
.glyph-code{ display:flex; align-items:center; justify-content:space-between; gap:12px }
.glyph-code .mono{ font-size:14px; letter-spacing:.16em; color:var(--muted); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; min-width:0 }
.glyph-pad{ display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:6px }
.gkey{ display:grid; justify-items:center; gap:1px; padding:6px 0 3px; border-radius:10px; border:1px solid var(--line); background:var(--hull); color:var(--text); cursor:pointer; min-width:0 }
.gkey .ic{ width:24px; height:24px; stroke-width:1.6 }
.gkey span{ font-family:var(--f-mono); font-size:10px; color:var(--faint) }
.gkey:active{ background:var(--flare-soft); border-color:var(--flare) }

/* Photos */
.photos{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px }
.photos.n1{ grid-template-columns:1fr }
.photos.n2{ grid-template-columns:repeat(2,minmax(0,1fr)) }
.photo{ display:block; padding:0; border:0; border-radius:10px; overflow:hidden; aspect-ratio:1; max-width:100%; background:var(--hull-2); cursor:zoom-in }
.photos.n1 .photo{ aspect-ratio:16/9 }
.photo img, .pthumb img{ display:block; width:100%; height:100%; object-fit:cover }
.broken img{ visibility:hidden }
.photo-edit{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px }
.pthumb{ position:relative; aspect-ratio:1; max-width:100%; border-radius:10px; overflow:hidden; background:var(--hull-2) }
.pthumb-x{ position:absolute; top:4px; right:4px; width:28px; height:28px; display:grid; place-items:center; border:0; border-radius:50%; background:var(--scrim); color:var(--on-photo); cursor:pointer }
.pthumb-x .ic{ width:16px; height:16px; stroke-width:2.4 }
.pthumb.add{ display:grid; place-items:center; align-content:center; gap:2px; border:1px dashed var(--line); background:transparent; color:var(--muted); font-size:13px; cursor:pointer }
.pthumb.pending{ display:grid; place-items:center; padding:4px; text-align:center; font-size:12px; color:var(--muted) }

/* Buttons and chips */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:var(--r-m); border:1px solid var(--line); background:var(--hull); color:var(--text); font-weight:700; font-size:15px; cursor:pointer; text-decoration:none }
.btn .ic{ width:18px; height:18px; stroke-width:2.2 }
.btn-sm{ min-height:36px; padding:0 14px; font-size:14px }
.btn-primary{ background:var(--flare); color:var(--flare-ink); border-color:transparent }
.btn-ghost{ background:transparent; border-color:transparent; color:var(--flare); padding:0 10px }
.btn-danger{ background:transparent; color:var(--danger); border-color:color-mix(in srgb, var(--danger) 45%, transparent) }
.btn-danger-solid{ background:var(--danger); color:var(--void); border-color:transparent }
.btn:disabled{ opacity:.5 }

<header class="topbar">

<div class="sheet" id="sheet" hidden></div>

  plant:'<path d="M5 19C5 10.5 10 5 19 5c0 9-5 14-14 14zM5 19l8.5-8.5"/>',

  ship:'<path d="M12 3l2.6 7.6 6.4 3.2v2.1l-6.2-1.1-1 4.2h-3.6l-1-4.2L3 16v-2.1l6.4-3.2z"/>',

  poi:'<path d="M12 21s-6.5-5.6-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/>',
  other:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4.6M12 16h.01"/>',
  share:'<path d="M12 14.5V3.5M8 7.2l4-3.7 4 3.7M7.5 10H5.5v10.5h13V10h-2"/>',
};
const icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n] || ''}</svg>`;
const glyphSvg = h => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${GLYPH_PATHS[h] || ''}</svg>`;

/* ---------- State ---------- */
const S = {
  db: null, assets: null,
  status: 'connecting',         // connecting | ready | unsupported
  canWrite: true,
  systems: new Map(), planets: new Map(), finds: new Map(),
  loaded: { systems: false, planets: false, finds: false },
  tab: 'log', stack: [], scrolls: [],
  filters: { log: '', systems: '', planets: '', finds: '', findKind: 'all', sort: { systems: 'recent', planets: 'recent', finds: 'recent' } },
  settings: { restore: null, busy: '', confirmExamples: false, msg: '', backup: null, usage: '' },
  installHidden: false,
};

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const val = v => v == null ? '' : String(v);
const norm = s => String(s || '').trim().toLowerCase();
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;
const all = c => [...S[c].values()];
const byName = (a, b) => (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base', numeric: true });
const byRecent = (a, b) => (b.createdAt || '').localeCompare(a.createdAt || '');
const byBody = (a, b) => ((a.body === 'Moon') - (b.body === 'Moon')) || byName(a, b);
const sortBy = (arr, how) => arr.sort(how === 'az' ? byName : byRecent);
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); };
const validAssetId = id => typeof id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(id);
// Screenshots live in IndexedDB; each one gets a blob: URL the first time it's shown
const photoUrls = new Map(), photoLoads = new Map();
const photoUrl = id => photoUrls.get(id) || '';
const imgTag = id => { const u = photoUrl(id); return `<img data-photo data-pid="${esc(id)}"${u ? ` src="${esc(u)}"` : ''} alt="" loading="lazy">`; };
const labelOf = (pairs, v) => { const p = pairs.find(x => x[0] === v); return p && v ? p[1] : ''; };
const starVar = c => STAR_COLORS.includes(c) ? `var(--star-${c.toLowerCase()})` : 'var(--faint)';
const biomeColor = b => Object.prototype.hasOwnProperty.call(BIOMES, b) ? BIOMES[b] : BIOMES.Other;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hay = (...xs) => xs.flat().filter(Boolean).join(' ').toLowerCase();
const sysHay = s => hay(s.name, s.galaxy, s.region, s.starColor, s.starClass, s.lifeform, s.economy, s.notes, s.glyphs);
const plHay = p => hay(p.name, p.body, p.biome, p.description, p.weather, p.sentinels, tierOf(SENTINEL_WORDS, p.sentinels), p.flora, p.fauna, p.resources, p.notes);
const fdHay = f => hay(f.name, KIND_LABEL[f.kind], f.subtype, f.cls ? f.cls + '-class' : '', f.coords, f.notes);
const exampleCount = () => ['systems', 'planets', 'finds'].reduce((n, c) => n + all(c).filter(x => x.example).length, 0);

function indexes() {
  const pBySys = new Map(), fBySys = new Map(), fByPl = new Map();
  const push = (m, k, v) => { if (!k) return; let a = m.get(k); if (!a) m.set(k, a = []); a.push(v); };
  for (const p of S.planets.values()) push(pBySys, p.systemId, p);
  for (const f of S.finds.values()) { push(fBySys, f.systemId, f); push(fByPl, f.planetId, f); }
  return { ps: id => pBySys.get(id) || [], fs: id => fBySys.get(id) || [], fp: id => fByPl.get(id) || [] };
}

async function withRetry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === 'unavailable') { await sleep(300 + Math.random() * 700); return fn(); }
    throw e;
  }
}
function explain(e) {
  if (e && e.name === 'QuotaExceededError') return 'Your phone has no space left for this app. Delete some screenshots or entries, then try again.';
  return "Couldn't save that on this device. Try again.";
}

/* ---------- Elements ---------- */
const viewHead = $('#view-head'), viewBody = $('#view-body');
const fab = $('#fab'), sheet = $('#sheet'), lightbox = $('#lightbox'), toastEl = $('#toast');
const tabs = [...document.querySelectorAll('.tab')];
let toastT = 0;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2800);
}

/* ---------- Routing ---------- */
const current = () => S.stack.length ? S.stack[S.stack.length - 1] : { type: 'tab' };
function go(type, id) { S.scrolls[S.stack.length] = window.scrollY; S.stack.push({ type, id }); render(); window.scrollTo(0, 0); }
function back() { S.stack.pop(); render(); window.scrollTo(0, S.scrolls[S.stack.length] || 0); }
function goTab(t) {
  if (S.tab === t && !S.stack.length) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  S.tab = t; S.stack = []; render(); window.scrollTo(0, 0);
}

/* ---------- Render ---------- */
let lastKey = '', renderQueued = false;
function scheduleRender() { if (renderQueued) return; renderQueued = true; setTimeout(() => { renderQueued = false; render(); }, 0); }

function render() {
  const route = current(), X = indexes();
  renderTop(route);
  const v = viewFor(route, X);
  if (v.key !== lastKey) { viewHead.innerHTML = v.head; lastKey = v.key; }
  viewBody.innerHTML = v.body;
  hydratePhotos(viewBody);
  tabs.forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
  fab.hidden = !(S.status === 'ready' && S.canWrite);
  $('#ro-pill').hidden = !(S.status === 'ready' && !S.canWrite);
}

function renderTop(route) {
  const TITLES = { log: "Traveller's Log", systems: 'Star systems', planets: 'Planets & moons', finds: 'Finds' };
  let title = TITLES[S.tab], action = '';
  if (route.type === 'system') title = 'Star system';
  if (route.type === 'planet') title = (S.planets.get(route.id) || {}).body === 'Moon' ? 'Moon' : 'Planet';
  if (route.type === 'find') title = KIND_LABEL[(S.finds.get(route.id) || {}).kind] || 'Find';
  if (route.type === 'tab' && S.tab === 'log') {
    action = `<button class="icon-btn" data-act="settings" aria-label="Log settings">${icon('sliders')}</button>`;
  } else if (route.type !== 'tab' && S.canWrite && isMine(S[COLL[route.type]].get(route.id))) {
    action = `<button class="top-btn" data-act="edit" data-type="${route.type}" data-id="${esc(route.id)}">${icon('edit')}Edit</button>`;
  }
  $('#top-title').textContent = title;
  $('#btn-back').hidden = route.type === 'tab';
  const slot = $('#top-action');
  if (slot.innerHTML !== action) slot.innerHTML = action;
}

function viewFor(route, X) {
  if (route.type === 'system') return { key: 's:' + route.id, head: '', body: viewSystem(route.id, X) };
  if (route.type === 'planet') return { key: 'p:' + route.id, head: '', body: viewPlanet(route.id, X) };
  if (route.type === 'find') return { key: 'f:' + route.id, head: '', body: viewFind(route.id) };
  if (S.tab === 'systems') return { key: 'tab:systems', head: searchBox('systems', 'Filter by name, galaxy, region, glyphs'), body: viewSystems(X) };
  if (S.tab === 'planets') return { key: 'tab:planets', head: searchBox('planets', 'Filter by name, biome, resource'), body: viewPlanets() };
  if (S.tab === 'finds') return { key: 'tab:finds', head: searchBox('finds', 'Filter by name, type, notes'), body: viewFinds() };
  return { key: 'tab:log', head: searchBox('log', 'Search your whole log'), body: viewLog(X) };
}

/* ---------- Building blocks ---------- */
function searchBox(k, ph) {
  return `<div class="search">${icon('search')}<input class="input" type="search" id="q-${k}" data-filter="${k}" value="${esc(S.filters[k])}" placeholder="${esc(ph)}" aria-label="${esc(ph)}" autocomplete="off" enterkeyhint="search"></div>`;
}
function gate() {
  if (S.status === 'unsupported') return `<div class="banner banner-warn" role="status"><div><b>This browser can't save your log.</b><p>Open the app in Safari or Chrome, and not in a private window.</p></div></div>`;
  if (S.status === 'connecting') return `<div class="loading" role="status"><span class="pulse"></span>Opening your log…</div>`;
  return '';
}
const section = (title, action, content) => `<section class="section"><div class="section-head"><h3>${title}</h3>${action || ''}</div>${content}</section>`;
const listOf = rows => `<div class="list">${rows.join('')}</div>`;
const newBtn = (kind, label, ctx = {}) => `<button class="btn btn-primary" data-act="new" data-kind="${kind}" data-system="${esc(ctx.system || '')}" data-planet="${esc(ctx.planet || '')}">${icon('plus')}${esc(label)}</button>`;
const newLink = (kind, label, ctx = {}) => `<button class="link-btn" data-act="new" data-kind="${kind}" data-system="${esc(ctx.system || '')}" data-planet="${esc(ctx.planet || '')}">${icon('plus')}${esc(label)}</button>`;
const emptyState = (title, text, action) => `<div class="empty"><h3>${esc(title)}</h3><p>${esc(text)}</p>${action || ''}</div>`;
const noMatch = q => `<p class="muted-note">Nothing matches “${esc(q)}”.</p>`;
const starDot = (color, extra = '') => `<span class="star-dot${extra}" style="--star:${starVar(color)}" aria-hidden="true"></span>`;
const planetDisc = p => `<span class="disc${p.body === 'Moon' ? ' moon' : ''}" style="--biome:${biomeColor(p.biome)}" aria-hidden="true"></span>`;
const kindTile = (kind, extra = '') => `<span class="kind-tile${extra}" aria-hidden="true">${icon(KIND_LABEL[kind] ? kind : 'other')}</span>`;

function rowEnd(item, extra = '') {
  const who = item._crew ? `<span class="badge badge-crew"><span>${esc(ownerName(item._owner))}</span></span>` : '';
  return `<span class="row-end">${who}${extra}${item.favorite ? icon('star', 'ic-fav') : ''}${icon('chevron', 'ic-chev')}</span>`;
}
function systemRow(s, X) {
  const np = X.ps(s.id).length, nf = X.fs(s.id).length;
  const sub = [s.galaxy, s.lifeform && s.lifeform !== 'None' ? s.lifeform : '', plural(np, 'planet'), nf ? plural(nf, 'find') : ''].filter(Boolean).join(' · ');
  return `<button class="row" data-act="open" data-type="system" data-id="${esc(s.id)}">${starDot(s.starColor)}<span class="row-main"><span class="row-title">${esc(s.name || 'Unnamed system')}</span><span class="row-sub">${esc(sub)}</span></span>${rowEnd(s)}</button>`;
}
function planetRow(p, showSystem = true) {
  const sys = S.systems.get(p.systemId);
  const sub = [p.body === 'Moon' ? 'Moon' : 'Planet', p.biome, showSystem ? (sys ? sys.name : 'Unknown system') : p.description].filter(Boolean).join(' · ');
  const st = tierOf(SENTINEL_WORDS, p.sentinels);
  const hostile = st === 'Aggressive' || st === 'Corrupted' ? `<span class="badge badge-warn">${st}</span>` : '';
  return `<button class="row" data-act="open" data-type="planet" data-id="${esc(p.id)}">${planetDisc(p)}<span class="row-main"><span class="row-title">${esc(p.name || 'Unnamed')}</span><span class="row-sub">${esc(sub)}</span></span>${rowEnd(p, hostile)}</button>`;
}
function findWhere(f) {
  const p = f.planetId && S.planets.get(f.planetId), s = S.systems.get(f.systemId);
  if (p) return p.name;
  if (s) return `${s.name}, in space`;
  return 'Unknown location';
}
function findRow(f, showWhere = true) {
  const kl = KIND_LABEL[f.kind] || 'Find';
  const sub = [kl, f.subtype && f.subtype !== kl ? f.subtype : '', showWhere ? findWhere(f) : ''].filter(Boolean).join(' · ');
  const cls = f.cls ? `<span class="badge badge-cls${f.cls === 'S' ? ' s' : ''}">${esc(f.cls)}</span>` : '';
  return `<button class="row" data-act="open" data-type="find" data-id="${esc(f.id)}">${kindTile(f.kind)}<span class="row-main"><span class="row-title">${esc(f.name || 'Unnamed find')}</span><span class="row-sub">${esc(sub)}</span></span>${rowEnd(f, cls)}</button>`;
}
const rowFor = (t, v, X) => t === 'system' ? systemRow(v, X) : t === 'planet' ? planetRow(v) : findRow(v);

function glyphStrip(code) {
  const chars = String(code || '').toUpperCase().split('');
  let cells = '';
  for (let i = 0; i < 12; i++) {
    const c = chars[i];
    cells += c && GLYPH_PATHS[c] ? `<span class="glyph" title="${GLYPH_NAME[c]}">${glyphSvg(c)}</span>` : '<span class="glyph empty"></span>';
  }
  const names = chars.map(c => GLYPH_NAME[c]).filter(Boolean).join(', ');
  return `<div class="glyphs" role="img" aria-label="${esc(names ? 'Portal glyphs: ' + names : 'No glyphs entered')}">${cells}</div>`;
}
// P SSS YY ZZZ XXX: planet, system, then the Y, Z and X coordinates
const groupGlyphs = c => c.length === 12 ? `${c[0]} ${c.slice(1, 4)} ${c.slice(4, 6)} ${c.slice(6, 9)} ${c.slice(9)}` : c;

function statsBlock(pairs) {
  const items = pairs.filter(p => p[1] !== '' && p[1] != null);
  if (!items.length) return '';
  return `<dl class="stats">${items.map(([k, v, cls]) => `<div><dt>${esc(k)}</dt><dd${cls ? ` class="${cls}"` : ''}>${esc(v)}</dd></div>`).join('')}</dl>`;
}
const notesBlock = n => n ? section('Notes', '', `<p class="notes">${esc(n)}</p>`) : '';
function photosBlock(ids) {
  ids = (ids || []).filter(validAssetId);
  if (!ids.length) return '';
  return section(`Screenshots<span class="count">${ids.length}</span>`, '', `<div class="photos n${Math.min(ids.length, 3)}">${ids.map(id => `<button class="photo" data-act="photo" data-pid="${esc(id)}" aria-label="View screenshot full size">${imgTag(id)}</button>`).join('')}</div>`);
}
function heroActions(type, item) {
  if (item._crew) return `<div class="hero-actions"><span class="badge badge-crew"><span>Shared by ${esc(ownerName(item._owner))}</span></span></div>`;
  const fav = S.canWrite ? `<button class="chip" data-act="fav" data-type="${type}" data-id="${esc(item.id)}" aria-pressed="${!!item.favorite}">${icon('star')}${item.favorite ? 'Starred' : 'Star'}</button>` : (item.favorite ? `<span class="badge">Starred</span>` : '');
  const ex = item.example ? '<span class="badge">Example</span>' : '';
  return fav || ex ? `<div class="hero-actions">${fav}${ex}</div>` : '';
}
function metaLine(item) {
  const c = fmtDate(item.createdAt), u = fmtDate(item.updatedAt);
  const by = item._crew ? ` by ${esc(ownerName(item._owner))} on` : '';
  return c ? `<p class="meta">Logged${by} ${esc(c)}${u && u !== c ? ` · edited ${esc(u)}` : ''}</p>` : '';
}
function missing() {
  return gate() || `<div class="empty"><h3>This entry is gone</h3><p>It was deleted, maybe in another window.</p><button class="btn" data-act="back">Go back</button></div>`;
}

/* ---------- Views ---------- */
function viewLog(X) {
  const g = gate(); if (g) return g;
  const out = [installBanner()];
  const ex = exampleCount();
  if (ex && S.canWrite) out.push(`<div class="banner"><div><b>These are example entries.</b><p>They show how a logged system looks. Remove them when you start your own log.</p></div><button class="btn btn-sm" data-act="remove-examples">Remove</button></div>`);
  const q = norm(S.filters.log);
  if (q) return out.join('') + searchResults(q, X);
  // Totals, Starred and Recently logged are your own; the crew gets its own section
  const ns = mineOf('systems').length, np = mineOf('planets').length, nf = mineOf('finds').length;
  if (!(ns + np + nf)) {
    out.push(emptyState('Your log is empty', 'Warp somewhere new, then log the system: its star, economy and portal glyphs. Planets and finds go inside it.', S.canWrite ? newBtn('system', 'Log a star system') : ''));
    if (crew.code) out.push(crewFeed(X));
    return out.join('');
  }
  out.push(`<div class="totals">${[['systems', ns, 'Systems'], ['planets', np, 'Planets'], ['finds', nf, 'Finds']].map(([t, n, l]) => `<button class="total" data-act="tab" data-tab="${t}"><b>${n}</b><span>${l}</span></button>`).join('')}</div>`);
  const tagged = [...mineOf('systems').map(v => ['system', v]), ...mineOf('planets').map(v => ['planet', v]), ...mineOf('finds').map(v => ['find', v])];
  const favs = tagged.filter(([, v]) => v.favorite);
  if (favs.length) out.push(section(`Starred<span class="count">${favs.length}</span>`, '', listOf(favs.map(([t, v]) => rowFor(t, v, X)))));
  const recent = tagged.sort((a, b) => byRecent(a[1], b[1])).slice(0, 12);
  out.push(section('Recently logged', '', listOf(recent.map(([t, v]) => rowFor(t, v, X)))));
  if (crew.code) out.push(crewFeed(X));
  return out.join('');
}

function crewFeed(X) {
  const items = [...[...crew.items.systems.values()].map(v => ['system', v]), ...[...crew.items.planets.values()].map(v => ['planet', v]), ...[...crew.items.finds.values()].map(v => ['find', v])]
    .sort((a, b) => byRecent(a[1], b[1])).slice(0, 12);
  const st = crew.status === 'live' ? 'Live' : crew.status === 'connecting' ? 'Connecting' : 'Offline';
  return section('Crew discoveries', `<span class="live-pill ${crew.status}"><span class="live-dot ${crew.status}"></span>${st}</span>`,
    items.length ? listOf(items.map(([t, v]) => rowFor(t, v, X))) : '<p class="muted-note">Nothing from your crew yet. What they log shows up here straight away.</p>');
}

function searchResults(q, X) {
  const ss = all('systems').filter(s => sysHay(s).includes(q)).sort(byName);
  const ps = all('planets').filter(p => plHay(p).includes(q)).sort(byName);
  const fs = all('finds').filter(f => fdHay(f).includes(q)).sort(byName);
  if (!ss.length && !ps.length && !fs.length) return noMatch(S.filters.log.trim());
  return [
    ss.length ? section(`Systems<span class="count">${ss.length}</span>`, '', listOf(ss.map(s => systemRow(s, X)))) : '',
    ps.length ? section(`Planets & moons<span class="count">${ps.length}</span>`, '', listOf(ps.map(p => planetRow(p)))) : '',
    fs.length ? section(`Finds<span class="count">${fs.length}</span>`, '', listOf(fs.map(f => findRow(f)))) : '',
  ].join('');
}

function sortBar(list, n, noun, nouns) {
  const cur = S.filters.sort[list];
  return `<div class="list-bar"><span class="count">${plural(n, noun, nouns)}</span><div class="seg" role="group" aria-label="Sort order">${[['recent', 'Recent'], ['az', 'A–Z']].map(([v, l]) => `<button class="seg-btn" data-act="sort" data-list="${list}" data-sort="${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div></div>`;
}

function viewSystems(X) {
  const g = gate(); if (g) return g;
  if (!S.systems.size) return emptyState('No star systems yet', 'Log the system you are in right now: its star colour, economy and portal glyphs.', S.canWrite ? newBtn('system', 'Log a star system') : '');
  const q = norm(S.filters.systems);
  const items = sortBy(all('systems').filter(s => !q || sysHay(s).includes(q)), S.filters.sort.systems);
  return `<div class="stack">${sortBar('systems', items.length, 'system')}${items.length ? listOf(items.map(s => systemRow(s, X))) : noMatch(S.filters.systems.trim())}</div>`;
}

function viewPlanets() {
  const g = gate(); if (g) return g;
  if (!S.planets.size) return emptyState('No planets yet', 'Land somewhere and log its biome, weather, sentinels and resources.', S.canWrite ? (S.systems.size ? newBtn('planet', 'Log a planet') : newBtn('system', 'Log a star system first')) : '');
  const q = norm(S.filters.planets);
  const items = sortBy(all('planets').filter(p => !q || plHay(p).includes(q)), S.filters.sort.planets);
  return `<div class="stack">${sortBar('planets', items.length, 'world')}${items.length ? listOf(items.map(p => planetRow(p))) : noMatch(S.filters.planets.trim())}</div>`;
}

function viewFinds() {
  const g = gate(); if (g) return g;
  if (!S.finds.size) return emptyState('No finds yet', 'Log creatures, plants, starships, multi-tools, bases and anything else worth coming back for.', S.canWrite ? (S.systems.size ? newBtn('find', 'Log a find') : newBtn('system', 'Log a star system first')) : '');
  const counts = {};
  for (const f of S.finds.values()) counts[f.kind] = (counts[f.kind] || 0) + 1;
  if (S.filters.findKind !== 'all' && !counts[S.filters.findKind]) S.filters.findKind = 'all';
  const kind = S.filters.findKind, q = norm(S.filters.finds);
  const chips = `<div class="chips scroll" role="group" aria-label="Show only one kind"><button class="chip" data-act="kind" data-kind="all" aria-pressed="${kind === 'all'}">All <span class="n">${S.finds.size}</span></button>${FIND_KINDS.filter(([k]) => counts[k]).map(([k, l]) => `<button class="chip" data-act="kind" data-kind="${k}" aria-pressed="${kind === k}">${l} <span class="n">${counts[k]}</span></button>`).join('')}</div>`;
  const items = sortBy(all('finds').filter(f => (kind === 'all' || f.kind === kind) && (!q || fdHay(f).includes(q))), S.filters.sort.finds);
  return chips + `<div class="stack">${sortBar('finds', items.length, 'find')}${items.length ? listOf(items.map(f => findRow(f))) : noMatch(S.filters.finds.trim() || KIND_LABEL[kind])}</div>`;
}

function viewSystem(id, X) {
  const s = S.systems.get(id); if (!s) return missing();
  const planets = X.ps(id).slice().sort(byBody);
  const finds = X.fs(id).slice().sort(byRecent);
  return [
    `<section class="hero" style="--star:${starVar(s.starColor)}"><div class="orb" aria-hidden="true"></div>
      <p class="eyebrow">${esc([s.starColor ? s.starColor + ' star' : 'Star system', s.galaxy].filter(Boolean).join(' · '))}</p>
      <h2>${esc(s.name || 'Unnamed system')}</h2>
      ${s.region ? `<p class="hero-sub">${esc(s.region)}</p>` : ''}
      ${heroActions('system', s)}</section>`,
    s.glyphs ? section('Portal address', '', `<div class="stack">${glyphStrip(s.glyphs)}<div class="glyph-code"><span class="mono">${esc(groupGlyphs(s.glyphs))}</span><button class="link-btn" data-act="copy" data-text="${esc(s.glyphs)}">Copy code</button></div></div>`) : '',
    statsBlock([['Spectral class', s.starClass, 'mono'], ['Lifeform', s.lifeform], ['Economy', s.economy], ['Wealth', labelOf(WEALTH, s.wealth)], ['Conflict', labelOf(CONFLICT, s.conflict)]]),
    notesBlock(s.notes),
    photosBlock(s.photos),
    section(`Planets & moons<span class="count">${planets.length}</span>`, isMine(s) ? newLink('planet', 'Add', { system: id }) : '', planets.length ? listOf(planets.map(p => planetRow(p, false))) : '<p class="muted-note">No planets logged in this system yet.</p>'),
    section(`Finds<span class="count">${finds.length}</span>`, isMine(s) ? newLink('find', 'Add', { system: id }) : '', finds.length ? listOf(finds.map(f => findRow(f))) : '<p class="muted-note">No finds logged in this system yet.</p>'),
    metaLine(s),
  ].join('');
}

function viewPlanet(id, X) {
  const p = S.planets.get(id); if (!p) return missing();
  const sys = S.systems.get(p.systemId);
  const finds = X.fp(id).slice().sort(byRecent);
  const ft = Number(p.faunaTotal) || 0, ff = Math.min(Number(p.faunaFound) || 0, ft || Infinity);
  return [
    `<section class="hero" style="--biome:${biomeColor(p.biome)}"><div class="orb planet${p.body === 'Moon' ? ' moon' : ''}" aria-hidden="true"></div>
      <p class="eyebrow">${esc([p.body || 'Planet', p.biome].filter(Boolean).join(' · '))}</p>
      <h2>${esc(p.name || 'Unnamed')}</h2>
      <div class="crumbs">${sys ? `<button class="crumb" data-act="open" data-type="system" data-id="${esc(sys.id)}">${starDot(sys.starColor)}<span>${esc(sys.name)}</span>${icon('chevron')}</button>` : '<span class="badge">Unknown system</span>'}</div>
      ${heroActions('planet', p)}</section>`,
    statsBlock([['In-game type', p.description], ['Weather', p.weather], ['Sentinels', withTier(SENTINEL_WORDS, p.sentinels)], ['Flora', withTier(FLORA_WORDS, p.flora)], ['Fauna', withTier(FAUNA_WORDS, p.fauna)]]),
    ft ? section('Fauna discovered', '', `<div class="fauna"><div class="fauna-line"><span>${ff === ft ? 'All creatures found' : 'Creatures found'}</span><b>${ff} / ${ft}</b></div><div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${ft}" aria-valuenow="${ff}"><i style="width:${Math.round(ff / ft * 100)}%"></i></div></div>`) : '',
    (p.resources || []).length ? section(`Resources<span class="count">${p.resources.length}</span>`, '', `<div class="tags">${p.resources.map(r => `<span class="tag">${esc(r)}</span>`).join('')}</div>`) : '',
    notesBlock(p.notes),
    photosBlock(p.photos),
    section(`Finds<span class="count">${finds.length}</span>`, isMine(p) ? newLink('find', 'Add', { system: p.systemId, planet: id }) : '', finds.length ? listOf(finds.map(f => findRow(f, false))) : `<p class="muted-note">Nothing logged on this ${p.body === 'Moon' ? 'moon' : 'planet'} yet.</p>`),
    metaLine(p),
  ].join('');
}

function viewFind(id) {
  const f = S.finds.get(id); if (!f) return missing();
  const sys = S.systems.get(f.systemId), pl = f.planetId && S.planets.get(f.planetId);
  const kl = KIND_LABEL[f.kind] || 'Find';
  return [
    `<section class="hero">${kindTile(f.kind, ' xl')}
      <p class="eyebrow">${esc([kl, f.subtype && f.subtype !== kl ? f.subtype : ''].filter(Boolean).join(' · '))}</p>
      <h2>${esc(f.name || 'Unnamed find')}</h2>
      <div class="crumbs">
        ${pl ? `<button class="crumb" data-act="open" data-type="planet" data-id="${esc(pl.id)}">${planetDisc(pl)}<span>${esc(pl.name)}</span>${icon('chevron')}</button>` : ''}
        ${sys ? `<button class="crumb" data-act="open" data-type="system" data-id="${esc(sys.id)}">${starDot(sys.starColor)}<span>${esc(sys.name)}${pl ? '' : ', in space'}</span>${icon('chevron')}</button>` : '<span class="badge">Unknown system</span>'}
      </div>
      ${heroActions('find', f)}</section>`,
    statsBlock([['Class', f.cls ? f.cls + '-class' : ''], ['Type', f.subtype]]),
    f.coords ? section('Planetary coordinates', '', `<div class="coords"><span class="mono">${esc(f.coords)}</span><button class="link-btn" data-act="copy" data-text="${esc(f.coords)}">Copy</button></div>`) : '',
    notesBlock(f.notes),
    photosBlock(f.photos),
    metaLine(f),
  ].join('');
}

/* ---------- Sheets ---------- */
let sheetState = null;
function openSheet(opts) {
  if (sheetState) closeSheet();
  sheetState = opts;
  sheet.innerHTML = `<div class="sheet-panel${opts.tall ? ' tall' : ''}" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="sheet-head"><button type="button" class="btn btn-ghost" data-sheet="cancel">${esc(opts.cancelLabel || 'Cancel')}</button><h2 id="sheet-title">${esc(opts.title)}</h2>${opts.onSave ? `<button type="button" class="btn btn-primary btn-sm" data-sheet="save">Save</button>` : '<span></span>'}</div>
    <div class="sheet-body" id="sheet-body"></div></div>`;
  sheet.hidden = false;
  document.documentElement.classList.add('sheet-open');
  refreshSheet();
  sheet.querySelector('.sheet-panel').focus({ preventScroll: true });
}
function refreshSheet() {
  if (!sheetState) return;
  $('#sheet-body').innerHTML = sheetState.render();
  hydratePhotos($('#sheet-body'));
  const save = sheet.querySelector('[data-sheet="save"]'), f = sheetState.form;
  if (save && f) { save.disabled = !!(f.confirmDelete || f.saving); save.textContent = f.saving ? 'Saving…' : 'Save'; }
}
function closeSheet() {
  sheetState = null; sheet.hidden = true; sheet.innerHTML = '';
  document.documentElement.classList.remove('sheet-open');
}
function cancelSheet() { const s = sheetState; if (s && s.onCancel) s.onCancel(); closeSheet(); }

/* ---------- Forms ---------- */
const SPECS = {
  system: { coll: 'systems', noun: 'star system', fields: [
    { k: 'name', t: 'text', label: 'System name', required: true, placeholder: 'As shown in the Discoveries menu' },
    { k: 'starColor', t: 'chips', label: 'Star colour', options: STAR_COLORS, swatch: starVar },
    { row: [ { k: 'galaxy', t: 'text', label: 'Galaxy', list: GALAXIES }, { k: 'starClass', t: 'text', label: 'Spectral class', mono: true, placeholder: 'G2pf' } ] },
    { k: 'region', t: 'text', label: 'Region', placeholder: 'e.g. Loychazinq Spur' },
    { k: 'lifeform', t: 'chips', label: 'Dominant lifeform', options: LIFEFORMS },
    { row: [ { k: 'economy', t: 'select', label: 'Economy', options: ECONOMIES }, { k: 'conflict', t: 'select', label: 'Conflict', options: CONFLICT } ] },
    { k: 'wealth', t: 'select', label: 'Wealth', options: WEALTH },
    { k: 'glyphs', t: 'glyphs', label: 'Portal address' },
    { k: 'notes', t: 'textarea', label: 'Notes', placeholder: 'Station traders, pirates, anything worth remembering' },
    { k: 'photos', t: 'photos', label: 'Screenshots' },
  ] },
  planet: { coll: 'planets', noun: 'planet', fields: [
    { k: 'systemId', t: 'system', label: 'Star system', required: true },
    { k: 'name', t: 'text', label: 'Name', required: true, placeholder: 'As shown in the Discoveries menu' },
    { k: 'body', t: 'chips', label: 'Body', options: ['Planet', 'Moon'], noClear: true },
    { k: 'biome', t: 'chips', label: 'Biome', options: Object.keys(BIOMES), swatch: biomeColor },
    { k: 'biomeGuide', t: 'biomeGuide' },
    { row: [ { k: 'description', t: 'text', label: 'In-game type', list: PLANET_TYPES, placeholder: 'Paradise Planet' }, { k: 'weather', t: 'text', label: 'Weather', list: WEATHER } ] },
    { k: 'sentinels', t: 'words', label: 'Sentinels', groups: SENTINEL_WORDS, hint: 'Pick the word the game shows. The list runs from no sentinels to corrupted ones.' },
    { row: [ { k: 'flora', t: 'words', label: 'Flora', groups: FLORA_WORDS }, { k: 'fauna', t: 'words', label: 'Fauna', groups: FAUNA_WORDS } ] },
    { k: 'faunaFound', k2: 'faunaTotal', t: 'pair', label: 'Fauna discovered', hint: 'From the Discoveries menu, for example 5 of 8.' },
    { k: 'resources', t: 'multi', label: 'Resources', options: RESOURCES },
    { k: 'notes', t: 'textarea', label: 'Notes', placeholder: 'Storms, good base spots, where the deposits are' },
    { k: 'photos', t: 'photos', label: 'Screenshots' },
  ] },
  find: { coll: 'finds', noun: 'find', fields: [
    { k: 'kind', t: 'chips', label: 'What is it?', options: FIND_KINDS, noClear: true },
    { k: 'name', t: 'text', label: 'Name', required: true },
    { k: 'systemId', t: 'system', label: 'Star system', required: true },
    { k: 'planetId', t: 'planet', label: 'Planet or moon' },
    { k: 'cls', t: 'chips', label: 'Class', options: ['S', 'A', 'B', 'C'], showIf: d => d.kind === 'ship' || d.kind === 'tool' },
    { k: 'subtype', t: 'text', label: 'Type', listFn: d => SUBTYPES[d.kind] || [], showIf: d => !!SUBTYPES[d.kind] },
    { k: 'coords', t: 'text', label: 'Planetary coordinates', mono: true, placeholder: '+12.40, -56.81', showIf: d => !!d.planetId },
    { k: 'notes', t: 'textarea', label: 'Notes', placeholder: 'Price, behaviour, what it drops, how to get there' },
    { k: 'photos', t: 'photos', label: 'Screenshots' },
  ] },
};
const flatFields = spec => spec.fields.flatMap(f => f.row || [f]);
const optPairs = opts => opts.map(o => Array.isArray(o) ? o : [o, o || 'Not recorded']);
const recentSystem = () => mineOf('systems').sort(byRecent)[0];

function blankDraft(kind, ctx) {
  const rs = recentSystem();
  let systemId = ctx.systemId || '';
  if (!systemId && ctx.planetId) systemId = (S.planets.get(ctx.planetId) || {}).systemId || '';
  if (!systemId && rs) systemId = rs.id;
  if (kind === 'system') return { name: '', galaxy: rs ? rs.galaxy || 'Euclid' : 'Euclid', region: '', starColor: '', starClass: '', lifeform: '', economy: '', wealth: '', conflict: '', glyphs: '', notes: '', photos: [], favorite: false };
  if (kind === 'planet') return { systemId, name: '', body: 'Planet', biome: '', description: '', weather: '', sentinels: '', flora: '', fauna: '', faunaFound: '', faunaTotal: '', resources: [], notes: '', photos: [], favorite: false };
  return { kind: 'creature', name: '', systemId, planetId: ctx.planetId || '', cls: '', subtype: '', coords: '', notes: '', photos: [], favorite: false };
}

function openForm(kind, existing, ctx) {
  const spec = SPECS[kind];
  const draft = existing ? JSON.parse(JSON.stringify(existing)) : blankDraft(kind, ctx || {});
  delete draft.id;
  if (!Array.isArray(draft.photos)) draft.photos = [];
  if (kind === 'planet' && !Array.isArray(draft.resources)) draft.resources = [];
  const form = { kind, id: existing ? existing.id : null, draft, uploads: [], removed: [], uploading: 0, confirmDelete: false, error: '', saving: false };
  openSheet({ title: `${existing ? 'Edit' : 'New'} ${spec.noun}`, tall: true, form, render: () => renderForm(form), onSave: () => submitForm(form), onCancel: () => discardUploads(form) });
}
function openNew(kind, ctx) {
  if (!S.canWrite || S.status !== 'ready') return;
  if (kind !== 'system' && !mineOf('systems').length) kind = 'system';
  // New entries only go inside your own systems and planets, never a crewmate's
  ctx = Object.assign({}, ctx);
  if (ctx.systemId && !isMine(S.systems.get(ctx.systemId))) ctx.systemId = '';
  if (ctx.planetId && !isMine(S.planets.get(ctx.planetId))) ctx.planetId = '';
  openForm(kind, null, ctx);
}
function openEdit(type, id) {
  const item = S[COLL[type]].get(id);
  if (isMine(item) && S.canWrite) openForm(type, item);
}

function renderForm(form) {
  if (form.confirmDelete) return renderDeleteConfirm(form);
  const spec = SPECS[form.kind];
  const err = form.error ? `<div class="form-error" role="alert">${esc(form.error)}</div>` : '';
  const del = form.id ? `<div class="danger-zone"><button type="button" class="btn btn-danger" data-sheet-act="ask-delete">${icon('trash')}Delete this ${spec.noun}</button></div>` : '';
  return err + spec.fields.map(f => renderField(f, form)).join('') + del;
}

function renderField(f, form) {
  const d = form.draft;
  if (f.row) { const inner = f.row.filter(x => !x.showIf || x.showIf(d)).map(x => renderField(x, form)).join(''); return inner ? `<div class="row2">${inner}</div>` : ''; }
  if (f.showIf && !f.showIf(d)) return '';
  const id = 'f-' + f.k;
  const lbl = (forId) => `<span class="lbl"${forId ? ` id="${forId}"` : ''}>${esc(f.label)}${f.required ? '<i class="req">required</i>' : ''}</span>`;
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
  switch (f.t) {
    case 'text': {
      const list = f.list || (f.listFn ? f.listFn(d) : null);
      const lid = list && list.length ? `dl-${f.k}-${d.kind || 'x'}` : '';
      return `<label class="field" for="${id}">${lbl()}<input class="input${f.mono ? ' mono' : ''}" id="${id}" data-k="${f.k}" value="${esc(val(d[f.k]))}" placeholder="${esc(f.placeholder || '')}"${lid ? ` list="${lid}"` : ''} autocomplete="off" ${f.mono ? 'spellcheck="false" autocapitalize="off"' : 'autocapitalize="words"'}>${lid ? `<datalist id="${lid}">${list.map(o => `<option value="${esc(o)}"></option>`).join('')}</datalist>` : ''}${hint}</label>`;
    }
    case 'textarea':
      return `<label class="field" for="${id}">${lbl()}<textarea class="input" id="${id}" data-k="${f.k}" rows="4" placeholder="${esc(f.placeholder || '')}" autocapitalize="sentences">${esc(val(d[f.k]))}</textarea>${hint}</label>`;
    case 'biomeGuide':
      return `<details class="guide" id="biome-guide"${form.guideOpen ? ' open' : ''}><summary>How to tell the biome<span class="guide-hint" id="biome-guide-hint">${guideHint(d)}</span></summary><div class="guide-body">
        <p>Scan the planet from space, or open it in the Discoveries menu. The first word of its type, like “Hiemal Planet”, gives the biome away. Tap a biome to pick it.</p>
        <div class="guide-list" id="biome-guide-list">${guideList(d)}</div>
        <p>“Paradise” is a Lush world with calm weather and few sentinels. “Tropical” can be Lush or Marsh: pick Marsh if it’s foggy or swampy. Colour names like Crimson or Azure are Exotic.</p>
      </div></details>`;
    case 'words': {
      // Grouped dropdown of the game's own words, plus a box for anything not on the list
      const v = val(d[f.k]);
      const known = f.groups.some(g => g[2].includes(v));
      const other = !!(form.other && form.other[f.k]) || (!!v && !known);
      const sel = other ? '__other' : v;
      const opt = (value, label) => `<option value="${esc(value)}"${value === sel ? ' selected' : ''}>${esc(label)}</option>`;
      return `<label class="field" for="${id}">${lbl()}<select class="input" id="${id}" data-words="${f.k}">${opt('', 'Not recorded')}${f.groups.map(([, head, ws]) => `<optgroup label="${esc(head)}">${ws.map(w => opt(w, w)).join('')}</optgroup>`).join('')}${opt('__other', 'Other (type it)')}</select>${other ? `<input class="input" id="${id}-other" data-k="${f.k}" value="${esc(v)}" placeholder="Type the word the game shows" aria-label="${esc(f.label)}, as the game shows it" autocomplete="off" autocapitalize="words">` : ''}${hint}</label>`;
    }
    case 'select':
      return `<label class="field" for="${id}">${lbl()}<select class="input" id="${id}" data-k="${f.k}">${optPairs(f.options).map(([v, l]) => `<option value="${esc(v)}"${val(d[f.k]) === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>${hint}</label>`;
    case 'chips':
      return `<div class="field" role="group" aria-labelledby="${id}-l">${lbl(id + '-l')}<div class="chips">${optPairs(f.options).map(([v, l]) => `<button type="button" class="chip" data-chip="${f.k}" data-v="${esc(v)}" aria-pressed="${d[f.k] === v}">${f.swatch ? `<span class="sw" style="--sw:${f.swatch(v)}"></span>` : ''}${esc(l)}</button>`).join('')}</div>${hint}</div>`;
    case 'multi': {
      const sel = new Set(d[f.k] || []);
      const opts = [...new Set([...(d[f.k] || []).filter(x => !f.options.includes(x)), ...f.options])];
      return `<div class="field" role="group" aria-labelledby="${id}-l"><span class="lbl" id="${id}-l">${esc(f.label)}${sel.size ? ` · ${sel.size} picked` : ''}</span><div class="chip-box"><div class="chips small">${opts.map(o => `<button type="button" class="chip" data-multi="${f.k}" data-v="${esc(o)}" aria-pressed="${sel.has(o)}">${esc(o)}</button>`).join('')}</div></div><div class="add-row"><input class="input" id="${id}-add" placeholder="Add one that isn't listed" aria-label="Add a resource that isn't listed" autocomplete="off" enterkeyhint="done"><button type="button" class="btn" data-multi-add="${f.k}">Add</button></div></div>`;
    }
    case 'pair':
      return `<div class="field" role="group" aria-labelledby="${id}-l">${lbl(id + '-l')}<div class="pair"><input class="input" type="number" inputmode="numeric" min="0" id="${id}" data-k="${f.k}" value="${esc(val(d[f.k]))}" aria-label="Creatures discovered"><span>of</span><input class="input" type="number" inputmode="numeric" min="0" id="f-${f.k2}" data-k="${f.k2}" value="${esc(val(d[f.k2]))}" aria-label="Creatures on this world"></div>${hint}</div>`;
    case 'system': {
      const systems = mineOf('systems').sort(byName);
      return `<label class="field" for="${id}">${lbl()}<select class="input" id="${id}" data-k="${f.k}" data-rerender="1">${S.systems.has(d[f.k]) ? '' : '<option value="">Choose a system</option>'}${systems.map(s => `<option value="${esc(s.id)}"${s.id === d[f.k] ? ' selected' : ''}>${esc(s.name || 'Unnamed system')}</option>`).join('')}</select></label>`;
    }
    case 'planet': {
      const planets = d.systemId ? mineOf('planets').filter(p => p.systemId === d.systemId).sort(byBody) : [];
      return `<label class="field" for="${id}">${lbl()}<select class="input" id="${id}" data-k="${f.k}" data-rerender="1"><option value="">In space (station, orbit, freighter)</option>${planets.map(p => `<option value="${esc(p.id)}"${p.id === d[f.k] ? ' selected' : ''}>${esc(p.name)}${p.body === 'Moon' ? ' (moon)' : ''}</option>`).join('')}</select>${planets.length ? '' : '<span class="hint">No planets logged in this system yet.</span>'}</label>`;
    }
    case 'glyphs':

function deletionTargets(kind, id) {
  const t = [];
  const add = (coll, item) => t.push({ coll, id: item.id, photos: (item.photos || []).filter(validAssetId) });
  if (kind === 'system') {
    for (const p of all('planets')) if (p.systemId === id) add('planets', p);
    for (const f of all('finds')) if (f.systemId === id) add('finds', f);
  }
  if (kind === 'planet') for (const f of all('finds')) if (f.planetId === id) add('finds', f);
  const self = S[COLL[kind]].get(id);
  if (self) add(COLL[kind], self);
  return t;
}
function renderDeleteConfirm(form) {
  const t = deletionTargets(form.kind, form.id);
  const np = t.filter(x => x.coll === 'planets' && x.id !== form.id).length;
  const nf = t.filter(x => x.coll === 'finds' && x.id !== form.id).length;
  const shots = t.reduce((n, x) => n + x.photos.length, 0);
  const extra = [np ? plural(np, 'planet') : '', nf ? plural(nf, 'find') : ''].filter(Boolean).join(' and ');
  const name = form.draft.name || 'this entry';
  return `<div class="confirm" role="alertdialog" aria-labelledby="cf-h"><h3 id="cf-h">Delete “${esc(name)}”?</h3><p>${extra ? `This also deletes the ${extra} logged ${form.kind === 'system' ? 'in this system' : 'on it'}. ` : ''}${shots ? `${plural(shots, 'screenshot')} will be deleted too. ` : ''}This can't be undone.</p><div class="confirm-actions"><button type="button" class="btn btn-danger-solid" data-sheet-act="do-delete"${form.saving ? ' disabled' : ''}>${form.saving ? 'Deleting…' : 'Delete'}</button><button type="button" class="btn" data-sheet-act="cancel-delete">Keep it</button></div></div>`;
}

function normalize(kind, d) {
  const o = {};
  for (const [k, v] of Object.entries(d)) o[k] = typeof v === 'string' ? v.trim() : v;
  const toNum = v => { const n = parseInt(v, 10); return Number.isFinite(n) && n >= 0 ? n : null; };
  if (kind === 'system') o.glyphs = String(o.glyphs || '').toUpperCase().replace(/[^0-9A-F]/g, '').slice(0, 12);
  if (kind === 'planet') { o.faunaFound = toNum(o.faunaFound); o.faunaTotal = toNum(o.faunaTotal); o.resources = (o.resources || []).filter(Boolean); }
  if (kind === 'find') { if (o.kind !== 'ship' && o.kind !== 'tool') o.cls = ''; if (!o.planetId) o.coords = ''; }
  o.photos = (o.photos || []).filter(validAssetId);
  o.favorite = !!o.favorite;
  return o;
}

async function submitForm(form) {
  const spec = SPECS[form.kind], d = form.draft;
  const fail = msg => { form.error = msg; refreshSheet(); const b = $('#sheet-body'); if (b) b.scrollTop = 0; };
  if (form.uploading) return fail('Screenshots are still being added. Save again in a moment.');
  if (!String(d.name || '').trim()) return fail(`Give the ${spec.noun} a name.`);
  if (form.kind !== 'system' && !isMine(S.systems.get(d.systemId))) return fail('Pick the star system it belongs to.');
  if (form.kind === 'find' && d.planetId && !isMine(S.planets.get(d.planetId))) d.planetId = '';
  const body = normalize(form.kind, d);
  const now = new Date().toISOString();
  const prev = form.id ? S[spec.coll].get(form.id) : null;
  body.createdAt = (prev && prev.createdAt) || now;
  body.updatedAt = now;
  form.saving = true; form.error = ''; refreshSheet();
  try {
    const ref = form.id ? S.db.collection(spec.coll).doc(form.id) : S.db.collection(spec.coll).doc();
    await withRetry(() => ref.set(body));
    S[spec.coll].set(ref.id, Object.assign({ id: ref.id }, body));
    form.uploads = [];
    for (const pid of form.removed) dropAsset(pid);
    closeSheet();
    toast(form.id ? 'Changes saved' : `${spec.noun[0].toUpperCase() + spec.noun.slice(1)} logged`);
    if (!form.id) {
      const r = current();
      const parentHere = (form.kind === 'planet' && r.type === 'system' && r.id === body.systemId) ||
        (form.kind === 'find' && ((r.type === 'planet' && r.id === body.planetId) || (r.type === 'system' && r.id === body.systemId)));
      if (parentHere) render(); else go(form.kind, ref.id);
    } else render();
  } catch (e) {
    form.saving = false; fail(explain(e));
  }
}

async function performDelete(form) {
  const targets = deletionTargets(form.kind, form.id);
  form.saving = true; refreshSheet();
  try {
    for (const t of targets) {
      await withRetry(() => S.db.collection(t.coll).doc(t.id).delete());
      S[t.coll].delete(t.id);
      t.photos.forEach(dropAsset);
    }
    discardUploads(form);
    closeSheet();
    const gone = new Set(targets.map(t => t.id));
    S.stack = S.stack.filter(r => !gone.has(r.id));
    render(); window.scrollTo(0, 0);
    toast('Deleted');
  } catch (e) {
    form.saving = false; form.confirmDelete = false; form.error = explain(e); refreshSheet();
  }
}

/* ---------- Screenshots ---------- */
function dropAsset(id) {
  const u = photoUrls.get(id); if (u) URL.revokeObjectURL(u);
  photoUrls.delete(id);
  store.del('photos', id).catch(() => {});
}
function loadPhoto(id) {
  if (photoUrls.has(id)) return Promise.resolve(photoUrls.get(id));
  if (!photoLoads.has(id)) {
    photoLoads.set(id, store.get('photos', id).then(rec => rec && rec.blob ? rec.blob : null, () => null).then(blob => {
      photoLoads.delete(id);
      if (!blob) return '';
      const u = URL.createObjectURL(blob); photoUrls.set(id, u); return u;
    }));
  }
  return photoLoads.get(id);
}
// Fill in screenshots that weren't loaded yet when the HTML was built
function hydratePhotos(root) {
  if (!root) return;
  root.querySelectorAll('img[data-pid]:not([src])').forEach(img => {
    loadPhoto(img.dataset.pid).then(u => {
      if (u) img.src = u;
      else { const p = img.closest('.photo, .pthumb'); if (p) p.classList.add('broken'); }
    });
  });
}
function discardUploads(form) { form.uploads.forEach(dropAsset); form.uploads = []; }

async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, 1800 / Math.max(w, h));
    if (s === 1 && file.size < 1.5e6 && /^image\/(jpeg|png|webp)$/.test(file.type)) return file;
    const c = document.createElement('canvas');
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const out = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
    return out || file;
  } catch (e) { return file; }
  finally { URL.revokeObjectURL(url); }
}

async function addPhotos(form, files) {
  const list = [...files].slice(0, Math.max(0, MAX_PHOTOS - form.draft.photos.length - form.uploading));
  for (const file of list) {
    form.uploading++; refreshSheet();
    try {
      const blob = await shrink(file);
      const type = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'].includes(blob.type) ? blob.type : '';
      if (!type) throw { code: 'unsupported_type' };
      const id = newId();
      await store.put('photos', id, { blob, type, createdAt: new Date().toISOString() });
      photoUrls.set(id, URL.createObjectURL(blob));
      form.draft.photos = [...form.draft.photos, id];
      form.uploads.push(id);
    } catch (e) {
      const code = e && (e.code || e.name);
      toast(code === 'unsupported_type' ? 'That image type isn’t supported. Use a PNG or JPEG.'
        : code === 'QuotaExceededError' ? 'Your phone has no space left for screenshots.'
        : 'Couldn’t add that screenshot. Try again.');
    } finally {
      form.uploading--;
      if (sheetState && sheetState.form === form) refreshSheet();
    }
  }
}

/* ---------- Settings: backup, restore, examples, install ---------- */
const freshSettings = (o = {}) => Object.assign({ restore: null, busy: '', confirmExamples: false, msg: '', backup: null, usage: '', crewMode: '', crewName: crew.name, crewCode: '', crewError: '', crewConfirmLeave: false }, o);

function renderSettings() {

      ? `<p class="hint">Backup ready: ${plural(b.entries, 'entry', 'entries')} and ${plural(b.photos, 'screenshot')}, ${fmtSize(b.blob.size)}.</p><div class="confirm-actions"><button type="button" class="btn btn-primary" data-sheet-act="backup-save">${icon('share')}Save backup file</button><button type="button" class="btn" data-sheet-act="backup-cancel">Cancel</button></div>`
      : `<button type="button" class="btn" data-sheet-act="export"${st.busy ? ' disabled' : ''}>${st.busy === 'export' ? 'Making backup…' : 'Make backup file'}</button>`}</section>`);
    const r = st.restore;
    out.push(`<section class="set"><h3>Restore</h3>${r
      ? `<p>This file has ${plural(r.systems.length, 'system')}, ${plural(r.planets.length, 'planet')}, ${plural(r.finds.length, 'find')} and ${plural(r.photoCount, 'screenshot')}. Entries already in your log with the same ID are replaced. Nothing gets deleted.</p><div class="confirm-actions"><button type="button" class="btn btn-primary" data-sheet-act="restore-go"${st.busy ? ' disabled' : ''}>${st.busy === 'restore' ? 'Restoring…' : 'Restore'}</button><button type="button" class="btn" data-sheet-act="restore-cancel">Cancel</button></div>`
      : `<p>Load a backup file you saved earlier. Backups from the claude.ai version of this log work too, without their screenshots.</p><label class="btn">Choose backup file<input type="file" id="restore-in" class="vh"></label>`}</section>`);
  }
  if (!isStandalone()) out.push(`<section class="set"><h3>Install as an app</h3><p>${installText()}</p>${installEvt ? `<button type="button" class="btn btn-primary" data-sheet-act="install">Install</button>` : ''}</section>`);
  out.push(`<section class="set"><h3>Where your log lives</h3><p>On this device only. Nothing is uploaded anywhere. Deleting the app or clearing this site's data in your browser can erase it, so keep a backup.</p>${st.usage ? `<p class="hint">${esc(st.usage)}</p>` : ''}</section>`);
