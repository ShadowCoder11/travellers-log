/* ---------- Address translator ---------- */
// Galactic address (signal booster): XXXX:YYYY:ZZZZ:SSSS. Portal address: P SSS YY ZZZ XXX.
// From the wiki's Portal address page: portal X and Z = galactic + 801 (wrapping at FFF),
// portal Y = galactic + 81 (wrapping at FF), and the system index carries over.
const hexOf = (n, w) => n.toString(16).toUpperCase().padStart(w, '0');
// null while it's still being typed, { error } when it can't be in a galaxy
function parseGalactic(text) {
  const s = String(text || '').toUpperCase().trim();
  if (!s) return null;
  let parts = s.split(/[\s:]+/).filter(Boolean);
  if (parts.length >= 4 && parts.slice(-4).every(p => /^[0-9A-F]{1,4}$/.test(p))) parts = parts.slice(-4);
  else {
    const hex = s.replace(/[^0-9A-F]/g, '');
    if (hex.length < 16) return null;
    const h = hex.slice(-16);
    parts = [h.slice(0, 4), h.slice(4, 8), h.slice(8, 12), h.slice(12)];
  }
  const [x, y, z, sys] = parts.map(p => parseInt(p, 16));
  if (x > 0xFFE || y > 0xFE || z > 0xFFE || sys > 0xFFF) return { error: true };
  return { x, y, z, sys };
}
const toPortal = (g, planet) => planet + hexOf(g.sys, 3) + hexOf((g.y + 0x81) % 0x100, 2) + hexOf((g.z + 0x801) % 0x1000, 3) + hexOf((g.x + 0x801) % 0x1000, 3);
function toGalactic(code) {
  const n = (a, b) => parseInt(code.slice(a, b), 16);
  return [hexOf((n(9, 12) + 0x7FF) % 0x1000, 4), hexOf((n(4, 6) + 0x7F) % 0x100, 4), hexOf((n(6, 9) + 0x7FF) % 0x1000, 4), hexOf(n(1, 4), 4)].join(':');
}
// A system in your log (or your crew's) at this address, whatever planet the first glyph picks
const trMatch = code => all('systems').find(s => typeof s.glyphs === 'string' && s.glyphs.length === 12 && s.glyphs.slice(1) === code.slice(1));

function translatorHead() {
  const t = S.tr;
  const pad = GLYPHS.map(([h, n]) => `<button type="button" class="gkey" data-act="tr-key" data-g="${h}" aria-label="${n} glyph, ${h}">${glyphSvg(h)}<span>${h}</span></button>`).join('');
  return `<div class="tr">
    ${section('Galactic address', '<button class="link-btn" data-act="tr-clear">Clear</button>', `<div class="field"><input class="input mono" id="tr-gal" value="${esc(t.gal)}" placeholder="0A1F:0081:0D2C:0079" aria-label="Galactic address" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done"><span class="hint">Four groups of hex digits, as a signal booster shows them. A name in front, like HUKYA:, is fine.</span></div>`)}
    ${section('Portal address', '', `<div class="stack"><div id="tr-strip">${glyphStrip(t.code)}</div><div class="glyph-pad">${pad}</div><div class="add-row"><input class="input mono" id="tr-code" maxlength="12" value="${esc(t.code)}" placeholder="Or type the 12-digit code" aria-label="Portal code" autocomplete="off" autocapitalize="characters" spellcheck="false"><button type="button" class="btn" data-act="tr-key" data-g="del" aria-label="Remove last glyph">${icon('backspace')}</button></div><span class="hint">The first glyph picks the planet, from 1 to 6. A galactic address doesn’t include one, so 1, the first planet, is used.</span></div>`)}
  </div>`;
}
function trResult() {
  const t = S.tr;
  if (t.error) return `<div class="form-error" role="alert">${esc(t.error)}</div>`;
  if (t.code.length !== 12) return `<p class="muted-note">${t.code || t.gal.trim() ? 'Keep going: a galactic address has four groups of four, and a portal address has 12 glyphs.' : 'Type a galactic address, or tap the glyphs of a portal address. Each one fills in the other.'}</p>`;
  const r = regionOf(t.code), d = r ? Math.hypot(r.x, r.y, r.z) * 400 : 0;
  const p = parseInt(t.code[0], 16), m = trMatch(t.code), gal = toGalactic(t.code);
  const acts = [
    `<button class="btn btn-sm" data-act="copy" data-text="${esc(t.code)}">Copy glyph code</button>`,
    `<button class="btn btn-sm" data-act="copy" data-text="${esc(gal)}">Copy galactic address</button>`,
    S.status === 'ready' ? `<button class="btn btn-sm" data-act="tr-here">${icon('poi')}I’m here</button>` : '',
    !m && S.canWrite && S.status === 'ready' ? `<button class="btn btn-sm btn-primary" data-act="tr-log">${icon('plus')}Log this system</button>` : '',
  ].join('');
  return [
    statsBlock([['From the galaxy centre', d < 1 ? 'At the centre' : fmtLy(d)], ['Planet', p === 0 || p > 6 ? `${p}, which sends you to planet 1` : String(p)]]),
    m ? section('In your log', '', listOf([systemRow(m, indexes())])) : '',
    `<div class="confirm-actions">${acts}</div>`,
  ].join('');
}
// Typing in one box fills in the other, without redrawing the page (so the keyboard stays up)
function updateTranslator(from) {
  const t = S.tr, gal = $('#tr-gal'), code = $('#tr-code'), strip = $('#tr-strip'), res = $('#tr-result');
  if (gal && from !== 'gal') gal.value = t.gal;
  if (code && from !== 'code') code.value = t.code;
  if (strip) strip.innerHTML = glyphStrip(t.code);
  if (res) res.innerHTML = trResult();
}
function trFromGalactic(v) {
  const t = S.tr, g = parseGalactic(v);
  t.gal = v;
  t.error = g && g.error ? 'That address is outside the galaxy. Check the four groups of numbers.' : '';
  t.code = g && !g.error ? toPortal(g, /^[1-6]/.test(t.code) ? t.code[0] : '1') : '';
  updateTranslator('gal');
}
function trFromCode(code, from) {
  const t = S.tr;
  t.code = code; t.error = '';
  t.gal = code.length === 12 ? toGalactic(code) : '';
  updateTranslator(from);
}

// The economy and wealth guide: rows that match the typed Galaxy Map word light up
const econMatch = (q, ws) => q.length >= 3 && ws.some(w => { const l = w.toLowerCase(); return l.includes(q) || q.includes(l); });
const econQ = form => String(form.econQ || '').trim().toLowerCase();
function econRows(form, kind) {
  const d = form.draft, q = econQ(form);
  const rows = kind === 'econ' ? ECONOMY_WORDS.map(([v, ws, note]) => [v, v, ws, note]) : WEALTH_WORDS;
  const cur = kind === 'econ' ? d.economy : d.wealth;
  return rows.map(([v, label, ws, note]) => {
    const m = econMatch(q, ws);
    const words = note ? note : ws.filter(w => w !== v).join(', ') || ws.join(', ');
    return `<button type="button" class="guide-row${m ? ' match' : ''}" data-pick-${kind}="${esc(v)}" aria-pressed="${cur === v}"><span><b>${esc(label)}</b>${m ? '<em>matches</em>' : ''}<small>${esc(words)}</small></span></button>`;
  }).join('');
}
function econHint(form) {
  const q = econQ(form);
  const hits = [...ECONOMY_WORDS.filter(([, ws]) => econMatch(q, ws)).map(([v]) => v), ...WEALTH_WORDS.filter(([, , ws]) => econMatch(q, ws)).map(([, l]) => l)];
  return hits.length ? `Matches ${hits.join(', ')}` : '';
}
function updateEconGuide(form) {
  const e = $('#econ-guide-econ'), w = $('#econ-guide-wealth'), h = $('#econ-guide-hint');
  if (e) e.innerHTML = econRows(form, 'econ');
  if (w) w.innerHTML = econRows(form, 'wealth');
  if (h) h.textContent = econHint(form);
}

function guideHint(d) {
  const m = biomeMatches(d.description);
  return m.length ? `Your type says ${m.join(' or ')}` : '';
}
function guideList(d) {

  return BIOME_WORDS.map(([b, ws, note]) => `<button type="button" class="guide-row${m.includes(b) ? ' match' : ''}" data-pick-biome="${esc(b)}" aria-pressed="${d.biome === b}"><span class="sw" style="--sw:${biomeColor(b)}"></span><span><b>${esc(b)}</b>${m.includes(b) ? '<em>matches your type</em>' : ''}<small>${esc(note || ws.join(', '))}</small></span></button>`).join('');
}

function updateGlyphField(form) {

function deletionTargets(kind, id) {
  const t = [];
  const add = (coll, item) => t.push({ coll, id: item.id, photos: (item.photos || []).filter(validAssetId) });
  if (kind === 'system') {
    for (const p of all('planets')) if (p.systemId === id) add('planets', p);
    for (const f of all('finds')) if (f.systemId === id) add('finds', f);
  }
  if (kind === 'planet') for (const f of all('finds')) if (f.planetId === id) add('finds', f);
  const self = S[COLL[kind]].get(id);
  if (self) add(COLL[kind], self);
  return t;
}
function renderDeleteConfirm(form) {
  const t = deletionTargets(form.kind, form.id);
  const np = t.filter(x => x.coll === 'planets' && x.id !== form.id).length;
  const nf = t.filter(x => x.coll === 'finds' && x.id !== form.id).length;
  const shots = t.reduce((n, x) => n + x.photos.length, 0);
  const extra = [np ? plural(np, 'planet') : '', nf ? plural(nf, 'find') : ''].filter(Boolean).join(' and ');
  const name = form.draft.name || 'this entry';
  return `<div class="confirm" role="alertdialog" aria-labelledby="cf-h"><h3 id="cf-h">Delete “${esc(name)}”?</h3><p>${extra ? `This also deletes the ${extra} logged ${form.kind === 'system' ? 'in this system' : 'on it'}. ` : ''}${shots ? `${plural(shots, 'screenshot')} will be deleted too. ` : ''}This can't be undone.</p><div class="confirm-actions"><button type="button" class="btn btn-danger-solid" data-sheet-act="do-delete"${form.saving ? ' disabled' : ''}>${form.saving ? 'Deleting…' : 'Delete'}</button><button type="button" class="btn" data-sheet-act="cancel-delete">Keep it</button></div></div>`;
}

function normalize(kind, d) {
  const o = {};
  for (const [k, v] of Object.entries(d)) o[k] = typeof v === 'string' ? v.trim() : v;
  const toNum = v => { const n = parseInt(v, 10); return Number.isFinite(n) && n >= 0 ? n : null; };
  if (kind === 'system') {
    o.glyphs = String(o.glyphs || '').toUpperCase().replace(/[^0-9A-F]/g, '').slice(0, 12);
    // Buy prices are below average and sell prices above, whatever sign was typed
    const pct = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.').replace(/[^0-9.]/g, '')); return Number.isFinite(n) ? Math.min(100, Math.round(n * 10) / 10) : null; };
    const b = pct(o.buyMod), s = pct(o.sellMod);
    o.buyMod = b == null ? null : -b; o.sellMod = s;
  }
  if (kind === 'recipe') {
    o.ingredients = (Array.isArray(o.ingredients) ? o.ingredients : []).map(x => String(x || '').trim().replace(/\s+/g, ' ').slice(0, 80)).filter(Boolean).slice(0, 3);
    const n = parseInt(String(o.value == null ? '' : o.value).replace(/[^0-9]/g, ''), 10);
    o.value = Number.isFinite(n) ? n : null;
  }
  if (kind === 'planet') { o.faunaFound = toNum(o.faunaFound); o.faunaTotal = toNum(o.faunaTotal); o.resources = (o.resources || []).filter(Boolean); }
  if (kind === 'find') {
    if (!['ship', 'tool', 'fleet'].includes(o.kind)) o.cls = '';
    if (o.kind === 'fleet') { o.systemId = ''; o.planetId = ''; }   // your own ships live in your freighter, not a system
    if (!o.planetId) o.coords = '';
  }
  o.photos = (o.photos || []).filter(validAssetId);
  o.favorite = !!o.favorite;
  return o;
}

async function submitForm(form) {
  const spec = SPECS[form.kind], d = form.draft;
  const fail = msg => { form.error = msg; refreshSheet(); const b = $('#sheet-body'); if (b) b.scrollTop = 0; };
  if (form.uploading) return fail('Screenshots are still being added. Save again in a moment.');
  if (!String(d.name || '').trim()) return fail(`Give the ${spec.noun} a name.`);
  const needsSystem = form.kind === 'planet' || (form.kind === 'find' && d.kind !== 'fleet');
  if (needsSystem && !isMine(S.systems.get(d.systemId))) return fail('Pick the star system it belongs to.');
  if (form.kind === 'find' && d.planetId && !isMine(S.planets.get(d.planetId))) d.planetId = '';
  const body = normalize(form.kind, d);
  const now = new Date().toISOString();
  const prev = form.id ? S[spec.coll].get(form.id) : null;
  body.createdAt = (prev && prev.createdAt) || now;
  body.updatedAt = now;
  form.saving = true; form.error = ''; refreshSheet();
  try {
    const ref = form.id ? S.db.collection(spec.coll).doc(form.id) : S.db.collection(spec.coll).doc();
    await withRetry(() => ref.set(body));
    S[spec.coll].set(ref.id, Object.assign({ id: ref.id }, body));
    form.uploads = [];
    for (const pid of form.removed) dropAsset(pid);
    closeSheet();
    toast(form.id ? 'Changes saved' : `${spec.noun[0].toUpperCase() + spec.noun.slice(1)} logged`);
    if (!form.id) {
      const r = current();
      const parentHere = (form.kind === 'planet' && r.type === 'system' && r.id === body.systemId) ||
        (form.kind === 'find' && ((r.type === 'planet' && r.id === body.planetId) || (r.type === 'system' && r.id === body.systemId)));
      if (parentHere) render(); else go(form.kind, ref.id);
    } else render();
  } catch (e) {
    form.saving = false; fail(explain(e));
  }
}

async function performDelete(form) {
  const targets = deletionTargets(form.kind, form.id);
  form.saving = true; refreshSheet();
  try {
    for (const t of targets) {
      await withRetry(() => S.db.collection(t.coll).doc(t.id).delete());
      S[t.coll].delete(t.id);
      t.photos.forEach(dropAsset);
    }
    discardUploads(form);
    closeSheet();
    const gone = new Set(targets.map(t => t.id));
    S.stack = S.stack.filter(r => !gone.has(r.id));
    render(); window.scrollTo(0, 0);
    toast('Deleted');
  } catch (e) {
    form.saving = false; form.confirmDelete = false; form.error = explain(e); refreshSheet();
  }
}

/* ---------- Screenshots ---------- */
function dropAsset(id) {
  const u = photoUrls.get(id); if (u) URL.revokeObjectURL(u);
  photoUrls.delete(id);
  store.del('photos', id).catch(() => {});
}
function loadPhoto(id) {
  if (photoUrls.has(id)) return Promise.resolve(photoUrls.get(id));
  if (!photoLoads.has(id)) {
    photoLoads.set(id, store.get('photos', id).then(rec => rec && rec.blob ? rec.blob : null, () => null).then(blob => {
      photoLoads.delete(id);
      if (!blob) return '';
      const u = URL.createObjectURL(blob); photoUrls.set(id, u); return u;
    }));
  }
  return photoLoads.get(id);
}
// Fill in screenshots that weren't loaded yet when the HTML was built
function hydratePhotos(root) {
  if (!root) return;
  root.querySelectorAll('img[data-pid]:not([src])').forEach(img => {
    loadPhoto(img.dataset.pid).then(u => {
      if (u) img.src = u;
      else { const p = img.closest('.photo, .pthumb'); if (p) p.classList.add('broken'); }
    });
  });
}
function discardUploads(form) { form.uploads.forEach(dropAsset); form.uploads = []; }

async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, 1800 / Math.max(w, h));
    if (s === 1 && file.size < 1.5e6 && /^image\/(jpeg|png|webp)$/.test(file.type)) return file;
    const c = document.createElement('canvas');
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const out = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
    return out || file;
  } catch (e) { return file; }
  finally { URL.revokeObjectURL(url); }
}

async function addPhotos(form, files) {
  const list = [...files].slice(0, Math.max(0, MAX_PHOTOS - form.draft.photos.length - form.uploading));
  for (const file of list) {
    form.uploading++; refreshSheet();
    try {
      const blob = await shrink(file);
      const type = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'].includes(blob.type) ? blob.type : '';
      if (!type) throw { code: 'unsupported_type' };
      const id = newId();
      await store.put('photos', id, { blob, type, createdAt: new Date().toISOString() });
      photoUrls.set(id, URL.createObjectURL(blob));
      form.draft.photos = [...form.draft.photos, id];
      form.uploads.push(id);
    } catch (e) {
      const code = e && (e.code || e.name);
      toast(code === 'unsupported_type' ? 'That image type isn’t supported. Use a PNG or JPEG.'
        : code === 'QuotaExceededError' ? 'Your phone has no space left for screenshots.'
        : 'Couldn’t add that screenshot. Try again.');
    } finally {
      form.uploading--;
      if (sheetState && sheetState.form === form) refreshSheet();
    }
  }
}

async function toggleFav(type, id) {
  const coll = COLL[type], item = S[coll].get(id);

  const next = !item.favorite;
  S[coll].set(id, Object.assign({}, item, { favorite: next })); render();

  catch (e) { const cur = S[coll].get(id); if (cur) S[coll].set(id, Object.assign({}, cur, { favorite: !next })); render(); toast(explain(e)); }
}

function renderSettings() {
  const st = S.settings, ex = exampleCount(), out = [];
  if (st.msg) out.push(`<div class="form-ok" role="status">${esc(st.msg)}</div>`);
  if (FIREBASE_CONFIG && S.status === 'ready') out.push(renderCrewSettings());
  if (ex && S.canWrite) {
    const n = `${ex} example ${ex === 1 ? 'entry' : 'entries'}`;
    out.push(`<section class="set"><h3>Example entries</h3>${st.confirmExamples
      ? `<p>Remove the ${n}? Anything you logged yourself stays.</p><div class="confirm-actions"><button type="button" class="btn btn-danger-solid" data-sheet-act="examples-go"${st.busy ? ' disabled' : ''}>${st.busy === 'examples' ? 'Removing…' : 'Remove examples'}</button><button type="button" class="btn" data-sheet-act="examples-cancel">Keep them</button></div>`
      : `<p>${n} came with this log to show how it works.</p><button type="button" class="btn" data-sheet-act="examples-ask">Remove examples</button>`}</section>`);
  }
  if (S.status === 'ready') {
    const b = st.backup;
    out.push(`<section class="set"><h3>Back up</h3><p>Your log is saved only on this device. Make a backup file now and then, screenshots included, so you can get everything back if you lose or reset your phone.</p>${b
      ? `<p class="hint">Backup ready: ${plural(b.entries, 'entry', 'entries')} and ${plural(b.photos, 'screenshot')}, ${fmtSize(b.blob.size)}.</p><div class="confirm-actions"><button type="button" class="btn btn-primary" data-sheet-act="backup-save">${icon('share')}Save backup file</button><button type="button" class="btn" data-sheet-act="backup-cancel">Cancel</button></div>`
      : `<button type="button" class="btn" data-sheet-act="export"${st.busy ? ' disabled' : ''}>${st.busy === 'export' ? 'Making backup…' : 'Make backup file'}</button>`}</section>`);
    const r = st.restore;
    out.push(`<section class="set"><h3>Restore</h3>${r
      ? `<p>This file has ${plural(r.systems.length, 'system')}, ${plural(r.planets.length, 'planet')}, ${plural(r.finds.length, 'find')}${r.recipes.length ? `, ${plural(r.recipes.length, 'recipe')}` : ''} and ${plural(r.photoCount, 'screenshot')}. Entries already in your log with the same ID are replaced. Nothing gets deleted.</p><div class="confirm-actions"><button type="button" class="btn btn-primary" data-sheet-act="restore-go"${st.busy ? ' disabled' : ''}>${st.busy === 'restore' ? 'Restoring…' : 'Restore'}</button><button type="button" class="btn" data-sheet-act="restore-cancel">Cancel</button></div>`
      : `<p>Load a backup file you saved earlier. Backups from the claude.ai version of this log work too, without their screenshots.</p><label class="btn">Choose backup file<input type="file" id="restore-in" class="vh"></label>`}</section>`);
  }
  if (!isStandalone()) out.push(`<section class="set"><h3>Install as an app</h3><p>${installText()}</p>${installEvt ? `<button type="button" class="btn btn-primary" data-sheet-act="install">Install</button>` : ''}</section>`);
  out.push(`<section class="set"><h3>App version</h3><p>You're on version ${esc(APP_VERSION)}.</p>${st.updateTo
    ? `<button type="button" class="btn btn-primary" data-sheet-act="apply-update">Update to version ${esc(st.updateTo)}</button>`
    : `<button type="button" class="btn" data-sheet-act="check-update"${st.busy === 'update' ? ' disabled' : ''}>${st.busy === 'update' ? 'Checking…' : 'Check for updates'}</button>`}</section>`);
  out.push(`<section class="set"><h3>Where your log lives</h3><p>On this device only. Nothing is uploaded anywhere. Deleting the app or clearing this site's data in your browser can erase it, so keep a backup.</p>${st.usage ? `<p class="hint">${esc(st.usage)}</p>` : ''}</section>`);
  return out.join('');
}

const fmtSize = n => n < 1e6 ? `${Math.max(1, Math.round(n / 1e3))} KB` : `${(n / 1e6).toFixed(n < 1e7 ? 1 : 0)} MB`;
async function storageUsage() {
  try { const e = await navigator.storage.estimate(); return e && e.usage != null ? `Using about ${fmtSize(e.usage)} on this device.` : ''; }
  catch (e) { return ''; }
}
const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });

// Step 1: build the file. Step 2 (saveBackup) hands it over on a fresh tap,
// because phones only open the share sheet straight after a tap.
async function makeBackup() {
  if (S.settings.busy) return;
  S.settings.busy = 'export'; S.settings.msg = ''; refreshSheet();
  try {
    const colls = { systems: mineOf('systems'), planets: mineOf('planets'), finds: mineOf('finds'), recipes: mineOf('recipes') };
    const ids = new Set();
    for (const c in colls) for (const x of colls[c]) for (const id of (x.photos || [])) if (validAssetId(id)) ids.add(id);
    const head = JSON.stringify(Object.assign({ app: 'travellers-log', version: 2, exportedAt: new Date().toISOString() }, colls));
    const parts = [head.slice(0, -1), ',"photos":{'];
    let n = 0;
    for (const id of ids) {
      const rec = await store.get('photos', id);
      if (!rec || !rec.blob) continue;
      parts.push(new Blob([(n ? ',' : '') + JSON.stringify(id) + ':' + JSON.stringify(await blobToDataUrl(rec.blob))]));
      n++;
    }
    parts.push('}}');
    S.settings.backup = { blob: new Blob(parts, { type: 'application/json' }), entries: colls.systems.length + colls.planets.length + colls.finds.length + colls.recipes.length, photos: n, name: `travellers-log-${new Date().toISOString().slice(0, 10)}.json` };
  } catch (e) {
    toast('Couldn’t make the backup file. Try again.');
  }
  S.settings.busy = ''; refreshSheet();
}

async function saveBackup() {
  const b = S.settings.backup; if (!b) return;
  const file = new File([b.blob], b.name, { type: 'application/json' });
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      S.settings.backup = null; S.settings.msg = 'Done. Keep the backup file somewhere safe, like Files or a cloud drive.'; refreshSheet();
      return;
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(b.blob);
  const a = document.createElement('a'); a.href = url; a.download = b.name; a.hidden = true;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  S.settings.backup = null; S.settings.msg = 'Backup file saved to your downloads.'; refreshSheet();
}

async function loadRestore(file) {
  if (!file) return;
  const okId = x => x && typeof x === 'object' && !Array.isArray(x) && typeof x.id === 'string' && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(x.id) && x.id !== '.' && x.id !== '..';
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.systems) || !Array.isArray(j.planets) || !Array.isArray(j.finds)) throw new Error('shape');
    const photos = {};
    if (j.photos && typeof j.photos === 'object') {
      for (const [id, d] of Object.entries(j.photos)) if (validAssetId(id) && typeof d === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,/.test(d)) photos[id] = d;
    }
    S.settings.restore = { systems: j.systems.filter(okId), planets: j.planets.filter(okId), finds: j.finds.filter(okId), recipes: Array.isArray(j.recipes) ? j.recipes.filter(okId) : [], photos, photoCount: Object.keys(photos).length };
    S.settings.msg = '';
  } catch (e) {
    S.settings.restore = null; S.settings.msg = '';
    toast('That file isn’t a Traveller’s Log backup.');
  }
  refreshSheet();
}

async function doRestore() {
  const r = S.settings.restore; if (!r || S.settings.busy) return;
  S.settings.busy = 'restore'; refreshSheet();
  let ok = 0, shots = 0, failed = 0;
  const have = new Set(await store.keys('photos').catch(() => []));
  for (const [id, d] of Object.entries(r.photos)) {
    try {
      const blob = await (await fetch(d)).blob();
      await store.put('photos', id, { blob, type: blob.type, createdAt: new Date().toISOString() });
      const u = photoUrls.get(id); if (u) URL.revokeObjectURL(u);
      photoUrls.delete(id); have.add(id); shots++;
    } catch (e) { failed++; }
  }
  for (const [coll, items] of [['systems', r.systems], ['planets', r.planets], ['finds', r.finds], ['recipes', r.recipes]]) {
    for (const item of items) {
      const body = Object.assign({}, item); delete body.id;
      // Screenshots that aren't in the file or on this device would only show as empty tiles
      body.photos = (Array.isArray(body.photos) ? body.photos : []).filter(p => have.has(p));
      try { await store.put(coll, item.id, body); ok++; } catch (e) { failed++; }
    }
  }
  try { await loadAll(); } catch (e) {}
  changed();
  syncOwn();
  const what = `${plural(ok, 'entry', 'entries')}${shots ? ` and ${plural(shots, 'screenshot')}` : ''}`;
  S.settings = freshSettings({ msg: failed ? `Restored ${what}. ${failed} couldn’t be saved.` : `Restored ${what}.` });
  refreshSheet(); render();
}

async function removeExamples() {
  if (S.settings.busy) return;
  S.settings.busy = 'examples'; refreshSheet();
  try {
    for (const coll of ['finds', 'planets', 'systems']) {
      for (const item of all(coll).filter(x => x.example)) {
        await withRetry(() => S.db.collection(coll).doc(item.id).delete());
        S[coll].delete(item.id);
      }
    }
    S.settings = { restore: null, busy: '', confirmExamples: false, msg: 'Examples removed. Your log is ready for your own discoveries.' };
  } catch (e) {
    S.settings.busy = ''; S.settings.msg = ''; toast(explain(e));
  }
  S.stack = S.stack.filter(routeAlive);
  refreshSheet(); render();
}

  switch (ds.act) {

    case 'back': back(); break;
    case 'open': go(ds.type, ds.id); break;
    case 'add': openAdd(); break;

    case 'resources': go('resources'); break;
    case 'trade': go('trade'); break;
    case 'translate': go('translate'); break;
    case 'tr-key': {
      const c = S.tr.code;
      trFromCode(ds.g === 'del' ? c.slice(0, -1) : (c.length < 12 ? c + ds.g : c), 'pad');
      break;
    }
    case 'tr-clear': S.tr = { gal: '', code: '', error: '' }; updateTranslator(); break;
    case 'tr-here': {
      const code = S.tr.code; if (code.length !== 12) break;
      const m = trMatch(code), h = S.here;
      setHere(m ? hereFromSystem(m) : { systemId: '', name: '', glyphs: code, galaxy: (h && h.galaxy) || ((recentSystem() || {}).galaxy) || 'Euclid', star: '', economy: '' });
      toast('Location set');
      break;
    }
    case 'tr-log': if (S.tr.code.length === 12) openNew('system', { glyphs: S.tr.code }); break;
    case 'recipes': go('recipes'); break;
    case 'good': toggleGood(ds.good); break;
    case 'goods-clear': S.goods.clear(); store.put('meta', 'trade-goods', []).catch(() => {}); render(); break;
    case 'res': S.filters.resource = S.filters.resource === ds.res ? '' : ds.res; render(); break;
    case 'here-set': openHere(); break;
    case 'here-clear': setHere(null); toast('Location cleared'); break;
    case 'here-sys': toggleHere(ds.id); break;

});

function onSheetClick(e) {
  const t = e.target;
  if (t === sheet) { if (sheetState && sheetState.scrimClose) closeSheet(); return; }
  const b = t.closest('[data-sheet],[data-sheet-act],[data-chip],[data-multi],[data-multi-add],[data-glyph],[data-photo-remove],[data-pick-biome],[data-pick-econ],[data-pick-wealth]');
  if (!b || b.disabled) return;
  const ds = b.dataset, form = sheetState && sheetState.form;
  if (ds.sheet === 'cancel') { cancelSheet(); return; }
  if (ds.sheet === 'save') { if (sheetState && sheetState.onSave && !(form && form.saving)) sheetState.onSave(); return; }
  if (form && ds.chip) {
    const f = flatFields(SPECS[form.kind]).find(x => x.k === ds.chip);
    form.draft[ds.chip] = (form.draft[ds.chip] === ds.v && !(f && f.noClear)) ? '' : ds.v;
    refreshSheet(); return;
  }
  if (form && ds.multi) {
    const arr = form.draft[ds.multi] || [];
    form.draft[ds.multi] = arr.includes(ds.v) ? arr.filter(x => x !== ds.v) : [...arr, ds.v];
    // Flip just this chip and the "· 3 picked" count, so the list stays exactly where it is
    b.setAttribute('aria-pressed', String(form.draft[ds.multi].includes(ds.v)));
    const f = flatFields(SPECS[form.kind]).find(x => x.k === ds.multi), n = form.draft[ds.multi].length, lbl = $(`#f-${ds.multi}-l`);
    if (lbl && f) lbl.textContent = f.label + (n ? ` · ${n} picked` : '');
    return;
  }
  if (form && ds.multiAdd) { addCustom(form, ds.multiAdd); return; }
  if (form && ds.pickBiome) { form.draft.biome = ds.pickBiome; refreshSheet(); return; }
  if (form && ds.pickEcon) { form.draft.economy = ds.pickEcon; refreshSheet(); return; }
  if (form && ds.pickWealth) { form.draft.wealth = ds.pickWealth; refreshSheet(); return; }
  if (form && ds.glyph) {
    const g = String(form.draft.glyphs || '');
    form.draft.glyphs = ds.glyph === 'del' ? g.slice(0, -1) : (g.length < 12 ? g + ds.glyph : g);
    updateGlyphField(form); return;
  }
  if (form && ds.photoRemove) {
    const pid = ds.photoRemove;
    form.draft.photos = form.draft.photos.filter(x => x !== pid);
    if (form.uploads.includes(pid)) { form.uploads = form.uploads.filter(x => x !== pid); dropAsset(pid); }
    else form.removed.push(pid);
    refreshSheet(); return;
  }
  switch (ds.sheetAct) {
    case 'new-fleet': openNew('find', { kind: 'fleet' }); break;
    case 'new-recipe': openNew('recipe', {}); break;
    case 'new-system': case 'new-planet': case 'new-find': {
      const ctx = (sheetState && sheetState.ctx) || {};
      openNew(ds.sheetAct.slice(4), ctx); break;
    }
    case 'ask-delete': if (form) { form.confirmDelete = true; form.error = ''; refreshSheet(); $('#sheet-body').scrollTop = 0; } break;
    case 'cancel-delete': if (form) { form.confirmDelete = false; refreshSheet(); } break;
    case 'do-delete': if (form && !form.saving) performDelete(form); break;
    case 'export': makeBackup(); break;
    case 'backup-save': saveBackup(); break;
    case 'backup-cancel': S.settings.backup = null; refreshSheet(); break;
    case 'install': doInstall(); break;
    case 'restore-go': doRestore(); break;
    case 'restore-cancel': S.settings.restore = null; refreshSheet(); break;
    case 'examples-ask': S.settings.confirmExamples = true; S.settings.msg = ''; refreshSheet(); break;
    case 'examples-cancel': S.settings.confirmExamples = false; refreshSheet(); break;
    case 'examples-go': removeExamples(); break;
    case 'crew-start': case 'crew-join':
      S.settings.crewMode = ds.sheetAct === 'crew-start' ? 'create' : 'join'; S.settings.crewError = ''; S.settings.msg = '';
      refreshSheet(); setTimeout(() => { const el = $('#crew-name'); if (el && !el.value) el.focus(); else { const c = $('#crew-code'); if (c) c.focus(); } }, 50);
      break;
    case 'crew-cancel': S.settings.crewMode = ''; S.settings.crewError = ''; refreshSheet(); break;
    case 'crew-create-go': createCrew(); break;
    case 'crew-join-go': joinCrew(); break;
    case 'crew-copy': copyText(fmtCode(crew.code)); break;
    case 'crew-share': shareInvite(); break;
    case 'crew-leave-ask': S.settings.crewConfirmLeave = true; S.settings.crewError = ''; refreshSheet(); break;
    case 'crew-leave-cancel': S.settings.crewConfirmLeave = false; refreshSheet(); break;
    case 'crew-leave-go': leaveCrew(); break;
    case 'check-update':
      (async () => {
        S.settings.busy = 'update'; S.settings.msg = ''; refreshSheet();
        const v = await checkForUpdate(true);
        S.settings.busy = '';
        if (v && v !== APP_VERSION) S.settings.updateTo = v;
        else S.settings.msg = v ? 'You’re on the latest version.' : 'Couldn’t check for updates. Are you online?';
        refreshSheet();
        const b = $('#sheet-body'); if (b && S.settings.msg) b.scrollTop = 0;
      })();
      break;
    case 'apply-update': applyUpdate(); break;
  }
}

function addCustom(form, k) {
  const inp = $(`#f-${k}-add`); if (!inp) return;
  const v = inp.value.trim().replace(/\s+/g, ' ').slice(0, 60);
  if (v && !(form.draft[k] || []).includes(v)) form.draft[k] = [...(form.draft[k] || []), v];
  refreshSheet();
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.filter) { S.filters[t.dataset.filter] = t.value; render(); return; }
  // Crew name and code survive the settings sheet re-drawing
  if (t.id === 'crew-name') { S.settings.crewName = t.value; return; }
  if (t.id === 'crew-code') { S.settings.crewCode = t.value; return; }
  if (t.id === 'tr-gal') { trFromGalactic(t.value); return; }
  if (t.id === 'tr-code') {
    const v = t.value.toUpperCase().replace(/[^0-9A-F]/g, '').slice(0, 12);
    if (v !== t.value) t.value = v;
    trFromCode(v, 'code');
    return;
  }
  const form = sheetState && sheetState.form; if (!form) return;
  if (t.id === 'f-glyphs') {
    const v = t.value.toUpperCase().replace(/[^0-9A-F]/g, '').slice(0, 12);
    if (v !== t.value) t.value = v;
    form.draft.glyphs = v;
    const disp = $('#glyph-display'); if (disp) disp.innerHTML = glyphStrip(v);
    return;
  }
  if (t.id === 'econ-guide-q') { form.econQ = t.value; updateEconGuide(form); return; }
  if (t.dataset.ing != null) {
    const a = Array.isArray(form.draft.ingredients) ? [...form.draft.ingredients] : [];
    a[Number(t.dataset.ing)] = t.value;
    form.draft.ingredients = Array.from(a, x => x || '');
    return;
  }
  if (t.matches('input[data-k], textarea[data-k]')) form.draft[t.dataset.k] = t.value;
  if (t.dataset.k === 'description') updateBiomeGuide(form);
});

document.addEventListener('change', e => {
  const t = e.target, form = sheetState && sheetState.form;
  if (t.id === 'f-photos-in') { if (form && S.assets && t.files.length) addPhotos(form, t.files); t.value = ''; return; }
  if (t.id === 'restore-in') { loadRestore(t.files[0]); t.value = ''; return; }
  if (form && t.dataset.words) {
    const k = t.dataset.words;
    form.other = form.other || {};
    form.other[k] = t.value === '__other';
    form.draft[k] = form.other[k] ? '' : t.value;
    refreshSheet();
    if (form.other[k]) { const o = $(`#f-${k}-other`); if (o) o.focus(); }
    return;
  }
  if (form && t.matches('select[data-k]')) {
    form.draft[t.dataset.k] = t.value;
    if (t.dataset.k === 'systemId' && form.draft.planetId) {
      const p = S.planets.get(form.draft.planetId);
      if (!p || p.systemId !== t.value) form.draft.planetId = '';
    }
    if (t.dataset.rerender) refreshSheet();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!lightbox.hidden) { closeLightbox(); return; }
    if (sheetState && !sheetState.form) closeSheet();
    return;
  }
  if (e.key === 'Enter' && (e.target.id === 'crew-name' || e.target.id === 'crew-code')) {
    e.preventDefault();
    if (S.settings.crewMode === 'create') createCrew(); else if (S.settings.crewMode === 'join') joinCrew();
    return;
  }
  if (e.key === 'Enter' && e.target.id && /^f-.+-add$/.test(e.target.id)) {
    e.preventDefault();
    const form = sheetState && sheetState.form;
    if (form) addCustom(form, e.target.id.slice(2, -4));
  }
});

// The biome guide stays open or closed while the form redraws
document.addEventListener('toggle', e => {
  if (!e.target || !sheetState || !sheetState.form) return;
  if (e.target.id === 'biome-guide') sheetState.form.guideOpen = e.target.open;
  if (e.target.id === 'econ-guide') sheetState.form.econGuideOpen = e.target.open;

/* ---------- Storage: everything is kept on this device, in IndexedDB ---------- */
const STORES = ['systems', 'planets', 'finds', 'recipes', 'photos', 'meta'];
let idb = null, bc = null;
const newId = () => { const a = new Uint8Array(12); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); };

function openIdb() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error('no indexedDB')); return; }
    // Version 2 added the recipe book. Upgrading only adds the new store; nothing else changes.
    const req = indexedDB.open('travellers-log', 2);
    let waitT = 0;
    req.onupgradeneeded = () => { for (const s of STORES) if (!req.result.objectStoreNames.contains(s)) req.result.createObjectStore(s); };
    req.onsuccess = () => { clearTimeout(waitT); const d = req.result; d.onversionchange = () => d.close(); res(d); };
    req.onerror = () => { clearTimeout(waitT); rej(req.error); };
    // An older copy of the app open in another window closes itself; give it a moment
    req.onblocked = () => { waitT = setTimeout(() => rej(new Error('blocked')), 10000); };
  });
}
// Runs fn inside one transaction and resolves with what fn returned, once the transaction has committed
function tx(names, mode, fn) {
  return new Promise((res, rej) => {
    let t, out;
    try { t = idb.transaction(names, mode); } catch (e) { rej(e); return; }
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('aborted'));
    try { out = fn(t); } catch (e) { try { t.abort(); } catch (_) {} rej(e); }
  });
}
const store = {
  get: (name, id) => tx([name], 'readonly', t => { const box = {}; t.objectStore(name).get(id).onsuccess = e => { box.v = e.target.result; }; return box; }).then(b => b.v),
  keys: name => tx([name], 'readonly', t => { const box = {}; t.objectStore(name).getAllKeys().onsuccess = e => { box.v = e.target.result; }; return box; }).then(b => b.v || []),
  entries: name => tx([name], 'readonly', t => { const out = []; t.objectStore(name).openCursor().onsuccess = e => { const c = e.target.result; if (c) { out.push([c.key, c.value]); c.continue(); } }; return out; }),
  put: (name, id, v) => tx([name], 'readwrite', t => { t.objectStore(name).put(v, id); }),
  del: (name, id) => tx([name], 'readwrite', t => { t.objectStore(name).delete(id); }),
};
// Other open windows of the app reload when this one saves something
function changed() { if (bc) { try { bc.postMessage('changed'); } catch (e) {} } }

// The same calls the claude.ai version makes, answered from this device
const localDb = {
  collection: coll => ({
    doc: id => {
      const docId = id || newId();
      return {
        id: docId,
        set: body => store.put(coll, docId, body).then(() => { changed(); pushOwn(coll, Object.assign({}, body, { id: docId })); }),
        update: patch => store.get(coll, docId).then(cur => {
          if (!cur) throw { code: 'not_found' };
          return store.put(coll, docId, Object.assign({}, cur, patch));
        }).then(changed),
        delete: () => store.del(coll, docId).then(() => { changed(); dropOwn(coll, docId); }),
      };
    },
  }),
};

// Crewmates' entries are other people's data: keep only plain fields of sane size
function cleanShared(data) {
  const o = {};
  if (!data || typeof data !== 'object') return o;
  for (const [k, v] of Object.entries(data)) {
    if (!/^[a-zA-Z]{1,30}$/.test(k)) continue;
    if (typeof v === 'string') o[k] = v.slice(0, 5000);
    else if (typeof v === 'number' && Number.isFinite(v)) o[k] = v;
    else if (typeof v === 'boolean' || v === null) o[k] = v;
    else if (Array.isArray(v)) o[k] = v.filter(x => typeof x === 'string').slice(0, 100).map(x => x.slice(0, 200));
  }
  return o;
}
function buildCrewItems() {
  const items = emptyItems();
  for (const d of crew.docs) {
    if (!d || typeof d.owner !== 'string' || d.owner === crew.uid || typeof d.id !== 'string' || !hasOwn(COLL, d.type)) continue;
    const pre = d.owner + '~';
    const v = Object.assign(cleanShared(d.data), { id: pre + d.id, _crew: true, _owner: d.owner, photos: [], favorite: false, example: false });
    if (typeof v.systemId === 'string' && v.systemId) v.systemId = pre + v.systemId;
    if (typeof v.planetId === 'string' && v.planetId) v.planetId = pre + v.planetId;
    if (d.type === 'find' && !hasOwn(KIND_LABEL, v.kind)) v.kind = 'other';
    if (d.type === 'find' && v.kind === 'fleet') continue;   // freighters are personal
    if (d.type === 'planet') v.faunaFound = myFauna.has(v.id) ? myFauna.get(v.id) : null;
    if (!['S', 'A', 'B', 'C'].includes(v.cls)) v.cls = '';
    items[COLL[d.type]].set(v.id, v);
  }
  crew.items = items;
  applyCrew();
}
// Your own entries plus the crew's, in the lists the views read from
function applyCrew() {
  for (const c of COLLS) {
    const m = new Map();
    for (const [id, v] of S[c]) if (!v._crew) m.set(id, v);
    for (const [id, v] of crew.items[c]) m.set(id, v);

// Sending your own entries. Screenshots, stars and example entries stay on this phone.
function shareData(item) {

  return d;
}

  const { fs, db } = crew.fb, type = TYPE_OF[coll];
  fs.setDoc(fs.doc(db, 'crews', crew.code, 'items', crewKey(type, item.id)), crewPayload(type, item)).catch(() => {});
}

// Makes the crew's copy of your log match your phone (after joining, restoring, or time offline)
async function syncOwn() {
  if (!crewOn()) return;
  const { fs, db } = crew.fb, code = crew.code;
  try {
    const snap = await fs.getDocs(fs.query(fs.collection(db, 'crews', code, 'items'), fs.where('owner', '==', crew.uid)));
    const remote = new Map(snap.docs.map(d => [d.id, d.data()]));
    const writes = [];
    for (const coll of COLLS) {
      const type = TYPE_OF[coll];
      for (const it of mineOf(coll)) {
        if (it.example || (coll === 'finds' && it.kind === 'fleet')) continue;
        const key = crewKey(type, it.id), r = remote.get(key);
        remote.delete(key);
        if (!r || r.updatedAt !== (it.updatedAt || '')) writes.push(b => b.set(fs.doc(db, 'crews', code, 'items', key), crewPayload(type, it)));
      }
    }
    for (const key of remote.keys()) writes.push(b => b.delete(fs.doc(db, 'crews', code, 'items', key)));
    for (let i = 0; i < writes.length; i += 200) {
      const b = fs.writeBatch(db);
      writes.slice(i, i + 200).forEach(w => w(b));
      await b.commit();
    }
  } catch (e) { /* tries again next time the app opens */ }
}

async function createCrew() {
  const st = S.settings, name = cleanName(st.crewName);
  if (!name) return crewFail('Enter your name first, so your crew can see who logged what.');
  st.busy = 'crew'; st.crewError = ''; refreshSheet();
  try {
    const { fs, db } = await withTimeout(loadFirebase(), 20000);
    let code = '';
    for (let i = 0; i < 3 && !code; i++) {
      const c = makeCode();
      try { await withTimeout(fs.setDoc(fs.doc(db, 'crews', c), { createdBy: crew.uid, createdAt: fs.serverTimestamp() }), 15000); code = c; }
      catch (e) { if (!e || e.code !== 'permission-denied') throw e; }   // that code is taken: try another
    }
    if (!code) throw { code: 'unavailable' };
    await withTimeout(fs.setDoc(fs.doc(db, 'crews', code, 'members', crew.uid), { name, joinedAt: fs.serverTimestamp() }), 15000);
    await saveCrew(code, name);
  } catch (e) { return crewFail(crewErrorText(e)); }
  S.settings = freshSettings({ msg: `Crew started. Invite your friends with the code ${fmtCode(crew.code)}.` });
  connectCrew(); refreshSheet(); render();
}

async function joinCrew() {
  const st = S.settings, name = cleanName(st.crewName), code = normCode(st.crewCode);
  if (!name) return crewFail('Enter your name first, so your crew can see who logged what.');
  if (code.length !== 8) return crewFail('A crew code has 8 letters and numbers, like K7Q2-MXP9.');
  st.busy = 'crew'; st.crewError = ''; refreshSheet();
  try {
    const { fs, db } = await withTimeout(loadFirebase(), 20000);
    const snap = await withTimeout(fs.getDocFromServer(fs.doc(db, 'crews', code)), 15000);
    if (!snap.exists()) return crewFail('No crew has that code. Check it with your friend.');
    await withTimeout(fs.setDoc(fs.doc(db, 'crews', code, 'members', crew.uid), { name, joinedAt: fs.serverTimestamp() }), 15000);
    await saveCrew(code, name);
  } catch (e) { return crewFail(crewErrorText(e)); }
  S.settings = freshSettings({ msg: 'You joined the crew. Your discoveries and theirs now update live for everyone.' });
  connectCrew(); refreshSheet(); render();
}

async function leaveCrew() {
  const st = S.settings;
  st.busy = 'crew'; st.crewError = ''; refreshSheet();
  try {
    const { fs, db } = await withTimeout(loadFirebase(), 20000), code = crew.code;
    const snap = await withTimeout(fs.getDocs(fs.query(fs.collection(db, 'crews', code, 'items'), fs.where('owner', '==', crew.uid))), 15000);
    for (let i = 0; i < snap.docs.length; i += 200) {
      const b = fs.writeBatch(db);
      snap.docs.slice(i, i + 200).forEach(d => b.delete(d.ref));
      await withTimeout(b.commit(), 15000);
    }
    await withTimeout(fs.deleteDoc(fs.doc(db, 'crews', code, 'members', crew.uid)), 15000);
  } catch (e) { return crewFail('Couldn’t reach the crew server to leave. Check your internet and try again.'); }
  stopCrew();
  await saveCrew('', crew.name);
  crew.status = 'off'; crew.members = new Map(); crew.docs = [];
  crew.items = emptyItems();
  applyCrew();
  S.stack = S.stack.filter(routeAlive);
  S.settings = freshSettings({ msg: 'You left the crew. Your own log is still here.' });
  refreshSheet(); render();
}

function shareInvite() {
  const url = location.origin + location.pathname;
  const text = `Join my No Man's Sky crew in Traveller's Log! Open ${url} and add it to your home screen, then go to Settings → Crew → Join with a code and enter ${fmtCode(crew.code)}`;
  if (navigator.share) { navigator.share({ title: "Traveller's Log crew", text }).catch(() => {}); return; }
  try { navigator.clipboard.writeText(text).then(() => toast('Invite copied. Paste it to your friends.'), () => toast(`Your crew code is ${fmtCode(crew.code)}`)); }
  catch (e) { toast(`Your crew code is ${fmtCode(crew.code)}`); }
}

function renderCrewSettings() {
  const st = S.settings, busy = st.busy === 'crew';
  const err = st.crewError ? `<div class="form-error" role="alert">${esc(st.crewError)}</div>` : '';
  if (crew.code) {
    const names = [...crew.members].map(([uid, n]) => uid === crew.uid ? `${n} (you)` : n);
    const status = { live: 'Live', connecting: 'Connecting…', offline: 'Offline. Changes sync when you’re back online.', error: crew.error, off: '' }[crew.status] || '';
    return `<section class="set"><h3>Crew</h3>${err}
      <div class="crew-code"><span class="mono">${esc(fmtCode(crew.code))}</span><button type="button" class="link-btn" data-sheet-act="crew-copy">Copy code</button></div>
      <p>Friends join in Settings → Crew → Join with a code. Everyone sees each other's systems, planets and finds as they're logged.</p>
      <button type="button" class="btn btn-primary" data-sheet-act="crew-share">${icon('share')}Invite friends</button>
      <p class="hint"><span class="live-dot ${crew.status}"></span>${esc(status)}${names.length ? ` · ${esc(names.join(', '))}` : ''}</p>
      ${st.crewConfirmLeave
        ? `<p>Leave the crew? Your discoveries are taken out of it, and theirs leave your lists. Your own log stays.</p><div class="confirm-actions"><button type="button" class="btn btn-danger-solid" data-sheet-act="crew-leave-go"${busy ? ' disabled' : ''}>${busy ? 'Leaving…' : 'Leave crew'}</button><button type="button" class="btn" data-sheet-act="crew-leave-cancel">Stay</button></div>`
        : '<button type="button" class="btn btn-danger" data-sheet-act="crew-leave-ask">Leave crew</button>'}</section>`;
  }
  const intro = '<p>Share discoveries with friends. Everyone in a crew sees each other\'s systems, planets and finds, updating live. Screenshots stay on each phone.</p>';
  const nameField = `<label class="field" for="crew-name"><span class="lbl">Your name in the crew</span><input class="input" id="crew-name" value="${esc(st.crewName)}" maxlength="40" placeholder="Your in-game name" autocomplete="nickname" autocapitalize="words" enterkeyhint="go"></label>`;
  if (st.crewMode === 'create') {
    return `<section class="set"><h3>Start a crew</h3>${err}${nameField}<div class="confirm-actions"><button type="button" class="btn btn-primary" data-sheet-act="crew-create-go"${busy ? ' disabled' : ''}>${busy ? 'Starting…' : 'Start crew'}</button><button type="button" class="btn" data-sheet-act="crew-cancel">Cancel</button></div></section>`;
  }
  if (st.crewMode === 'join') {
    return `<section class="set"><h3>Join a crew</h3>${err}${nameField}<label class="field" for="crew-code"><span class="lbl">Crew code</span><input class="input mono" id="crew-code" value="${esc(st.crewCode)}" maxlength="12" placeholder="K7Q2-MXP9" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go"></label><div class="confirm-actions"><button type="button" class="btn btn-primary" data-sheet-act="crew-join-go"${busy ? ' disabled' : ''}>${busy ? 'Joining…' : 'Join crew'}</button><button type="button" class="btn" data-sheet-act="crew-cancel">Cancel</button></div></section>`;
  }
  return `<section class="set"><h3>Crew</h3>${intro}${err}<div class="confirm-actions"><button type="button" class="btn btn-primary" data-sheet-act="crew-start">Start a crew</button><button type="button" class="btn" data-sheet-act="crew-join">Join with a code</button></div></section>`;
}

/* ---------- Updates ---------- */
// Goes up by one with every release. The app compares it with the copy on the website.
const APP_VERSION = '13';
const INDEX_URL = new URL('./', location.href).href;
let lastUpdateCheck = 0, freshIndex = null;
// Resolves with the website's version number, or null when it couldn't check (offline)
async function checkForUpdate(force) {
  if (!force && Date.now() - lastUpdateCheck < 60000) return null;
  lastUpdateCheck = Date.now();
  try {
    const res = await fetch(INDEX_URL + '?update-check=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return null;
    const text = await res.text();
    const m = text.match(/const APP_VERSION = '(\d+)'/);
    if (!m) return null;
    if (m[1] !== APP_VERSION) { freshIndex = text; $('#update-bar').hidden = false; }
    return m[1];
  } catch (e) { return null; }
}
// Puts the new page where the offline copy lives, then restarts the app on it
async function applyUpdate() {
  try {
    if (freshIndex && 'caches' in window) {
      for (const k of (await caches.keys()).filter(k => k.startsWith('tlog-shell-'))) {
        const c = await caches.open(k);
        await c.put(INDEX_URL, new Response(freshIndex, { headers: { 'Content-Type': 'text/html; charset=utf-8' } }));
      }
    }
  } catch (e) {}
  location.reload();
}

/* ---------- Installing ---------- */
const IS_IOS = document.documentElement.classList.contains('ios');
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  scheduleRender(); if (sheetState && !sheetState.form) refreshSheet();
});
window.addEventListener('appinstalled', () => { installEvt = null; dismissInstall(); toast('Installed. Open Traveller’s Log from your home screen.'); });
function installDismissed() { try { return localStorage.getItem('install-dismissed') === '1'; } catch (e) { return false; } }
function dismissInstall() { try { localStorage.setItem('install-dismissed', '1'); } catch (e) {} S.installHidden = true; scheduleRender(); }
function installText() {
  if (installEvt) return 'It gets its own icon on your home screen, opens full screen and works offline.';
  if (IS_IOS) return `In Safari, tap Share ${icon('share', 'inline-ic')} then <b>Add to Home Screen</b>. Do it before you log anything: entries saved in Safari don't carry over to the home-screen app.`;
  return 'Open your browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>. It then opens full screen and works offline.';
}
function installBanner() {
  if (S.status !== 'ready' || isStandalone() || S.installHidden || installDismissed()) return '';
  return `<div class="banner col"><div><b>Install it as an app</b><p>${installText()}</p></div><div class="banner-actions">${installEvt ? '<button class="btn btn-primary btn-sm" data-act="install">Install</button>' : ''}<button class="btn btn-sm" data-act="install-later">Not now</button></div></div>`;
}
async function doInstall() {
  const e = installEvt; if (!e) return;
  installEvt = null;
  try { e.prompt(); await e.userChoice; } catch (err) {}
  render(); if (sheetState && !sheetState.form) refreshSheet();
}

async function boot() {
  document.querySelectorAll('[data-icon]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon)));
  render();
  try {
    idb = await openIdb();
    await seedOnce();
    await loadAll();
    try { S.here = cleanHere(await store.get('meta', 'here')); } catch (e) {}
    try { const tg = await store.get('meta', 'trade-goods'); if (Array.isArray(tg)) S.goods = new Set(tg.filter(g => GOODS.has(g))); } catch (e) {}
    S.db = localDb; S.assets = true; S.status = 'ready';
    restoreCrew();
  } catch (e) {
    S.status = 'unsupported';
  }
  render();
  try {
    bc = new BroadcastChannel('travellers-log');
    bc.onmessage = () => loadAll().then(() => { render(); if (sheetState && !sheetState.form) refreshSheet(); }, () => {});
  } catch (e) {}
  // Ask the browser not to clear the log when the phone runs low on space
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {}); } catch (e) {}
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
if (/^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => setTimeout(() => checkForUpdate(true), 2500));
  // A home-screen app often resumes instead of restarting, so check again when it comes back
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
}
boot();
})();
</script>
