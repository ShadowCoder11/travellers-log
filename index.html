<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traveller's Log</title>
<meta name="description" content="Log the star systems, planets, moons and finds from your No Man's Sky travels.">
<meta name="theme-color" content="#100E22" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F1F9" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Traveller's Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script>
// Marks iPhone and iPad, so the install tips show the Safari steps.
// No "status bar style" tag on purpose: on iOS 26 it shifts the layout and leaves a dark bar under the tabs,
// while without it the status bar simply takes the page's own background colour.
if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) document.documentElement.classList.add('ios');
</script>
<style>
/* Layout: one-column phone app (max 640px). Sticky top bar, scrolling view, fixed bottom tabs,
   floating Add button, bottom-sheet forms. Dark-first deep-space hull with a sunset-orange flare. */
:root{
  color-scheme: dark;
  --void:#100E22; --hull:#1B1934; --hull-2:#27243F; --line:#3A355E; --line-soft:#2B2848;
  --text:#EFEBFA; --muted:#A6A1C4; --faint:#7C779B;
  --flare:#FF8B4E; --flare-ink:#1C0E04; --flare-soft:rgba(255,139,78,.13);
  --scan:#62D8D1; --danger:#FF6F7D; --warn:#FFC857;
  --star-yellow:#FFD45C; --star-red:#FF6A4D; --star-green:#6EE07A; --star-blue:#6FAEFF; --star-purple:#BD8EFF;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --scrim:rgba(6,5,16,.66); --lightbox:rgba(5,4,12,.94); --on-photo:#FFFFFF;
  --f-display:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r-m:12px; --r-l:18px; --tabbar-h:62px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --void:#F3F1F9; --hull:#FFFFFF; --hull-2:#ECE9F5; --line:#D3CEE5; --line-soft:#E3DFEE;
    --text:#1A1834; --muted:#5D5880; --faint:#8984A6;
    --flare:#C2501A; --flare-ink:#FFFFFF; --flare-soft:rgba(194,80,26,.09);
    --scan:#11807A; --danger:#C3304A; --warn:#946400;
    --star-yellow:#E0A800; --star-red:#DD4528; --star-green:#2F9F45; --star-blue:#2F70D8; --star-purple:#8A56E0;
    --shadow:0 12px 32px rgba(40,30,80,.16); --scrim:rgba(26,24,52,.42);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --void:#F3F1F9; --hull:#FFFFFF; --hull-2:#ECE9F5; --line:#D3CEE5; --line-soft:#E3DFEE;
  --text:#1A1834; --muted:#5D5880; --faint:#8984A6;
  --flare:#C2501A; --flare-ink:#FFFFFF; --flare-soft:rgba(194,80,26,.09);
  --scan:#11807A; --danger:#C3304A; --warn:#946400;
  --star-yellow:#E0A800; --star-red:#DD4528; --star-green:#2F9F45; --star-blue:#2F70D8; --star-purple:#8A56E0;
  --shadow:0 12px 32px rgba(40,30,80,.16); --scrim:rgba(26,24,52,.42);
}

*,*::before,*::after{ box-sizing:border-box }
[hidden]{ display:none !important }
html{ -webkit-text-size-adjust:100% }
html.sheet-open{ overflow:hidden }
html{ background:var(--void) }
@media (display-mode: standalone){ html{ overscroll-behavior-y:none } }
body{ margin:0; background:var(--void); color:var(--text); font-family:var(--f-body); font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:40; background:var(--void) }
button{ font:inherit; color:inherit }
button:disabled{ cursor:default }
:focus-visible{ outline:2px solid var(--flare); outline-offset:2px }
.wrap{ width:100%; max-width:640px; margin-inline:auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)) }
.vh{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }
.ic{ width:22px; height:22px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
.ic .f{ fill:currentColor; stroke:none }

/* Top bar */
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--void); border-bottom:1px solid var(--line-soft) }
.topbar-inner{ display:flex; align-items:center; gap:6px; min-height:56px }
.top-title{ flex:1; min-width:0; margin:0; font-family:var(--f-display); font-weight:600; font-size:20px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.icon-btn{ width:44px; height:44px; flex:none; display:grid; place-items:center; border:0; border-radius:12px; background:transparent; color:var(--text); cursor:pointer }
.icon-btn:hover{ background:var(--hull) }
#btn-back{ margin-left:-10px }
.top-btn{ display:inline-flex; align-items:center; gap:6px; min-height:38px; padding:0 14px 0 10px; border-radius:10px; border:1px solid var(--line); background:var(--hull); color:var(--text); font-weight:700; font-size:15px; cursor:pointer }
.top-btn .ic{ width:18px; height:18px }
.ro-pill{ flex:none; font-family:var(--f-display); font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 10px }

/* View */
#view{ padding-block:16px calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom,0px)); overflow-x:hidden; overflow-x:clip }
#view-head:not(:empty){ margin-bottom:16px }
#view-body{ display:grid; gap:22px; min-width:0 }
.stack{ display:grid; gap:10px; min-width:0 }
.section{ display:grid; gap:10px; min-width:0 }
.section-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:32px }
.section-head h3, .set h3{ margin:0; font-family:var(--f-display); font-size:13px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted) }
.count{ color:var(--faint); font-family:var(--f-mono); font-size:12px; letter-spacing:0; font-variant-numeric:tabular-nums; margin-left:4px }
.link-btn{ display:inline-flex; align-items:center; gap:4px; background:none; border:0; padding:6px 2px; color:var(--flare); font-weight:700; font-size:15px; cursor:pointer }
.link-btn .ic{ width:18px; height:18px; stroke-width:2.2 }
.muted-note{ margin:0; color:var(--muted); font-size:15px }
.meta{ margin:0; color:var(--faint); font-size:13px }

/* Search */
.search{ position:relative }
.search .ic{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--faint); width:20px; height:20px; pointer-events:none }
.search .input{ padding-left:42px }

/* Lists */
.list{ background:var(--hull); border:1px solid var(--line-soft); border-radius:var(--r-l); overflow:hidden; min-width:0 }
.row{ display:flex; align-items:center; gap:12px; width:100%; min-height:62px; padding:10px 12px 10px 14px; border:0; background:none; text-align:left; cursor:pointer }
.row + .row{ border-top:1px solid var(--line-soft) }
.row:hover{ background:var(--hull-2) }
.row-main{ flex:1; min-width:0; display:grid }
.row-title{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.row-sub{ color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.row-end{ flex:none; display:flex; align-items:center; gap:6px }
.ic.ic-fav{ width:16px; height:16px; color:var(--flare); fill:currentColor }
.ic.ic-chev{ width:18px; height:18px; color:var(--faint) }
.list-bar{ display:flex; align-items:center; justify-content:space-between; gap:12px }
.list-bar .count{ font-size:13px; margin:0 }
.seg{ display:inline-flex; padding:3px; border-radius:10px; background:var(--hull); border:1px solid var(--line-soft) }
.seg-btn{ border:0; background:transparent; padding:4px 12px; border-radius:7px; font-size:14px; font-weight:700; color:var(--muted); cursor:pointer }
.seg-btn[aria-pressed="true"]{ background:var(--hull-2); color:var(--text) }

/* Bodies: stars, worlds, finds */
.star-dot{ width:36px; height:36px; flex:none; border-radius:50%; background:radial-gradient(circle, #FFFFFF 0 12%, var(--star) 30%, color-mix(in srgb, var(--star) 30%, transparent) 52%, transparent 72%) }
.disc{ width:30px; height:30px; margin:3px; flex:none; border-radius:50%; background:radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--biome) 50%, #FFFFFF) 0, var(--biome) 46%, color-mix(in srgb, var(--biome) 45%, #000000) 100%) }
.disc.moon{ width:20px; height:20px; margin:8px }
.disc-wrap{ position:relative; flex:none; display:inline-flex }
.done-pip{ position:absolute; right:-1px; bottom:-1px; width:17px; height:17px; border-radius:50%; display:grid; place-items:center; background:var(--scan); color:var(--void); box-shadow:0 0 0 2px var(--hull) }
.done-pip .ic{ width:11px; height:11px; stroke-width:3.4 }
.disc.moon + .done-pip{ right:3px; bottom:3px }
.row:hover .done-pip{ box-shadow:0 0 0 2px var(--hull-2) }
.kind-tile{ width:36px; height:36px; flex:none; display:grid; place-items:center; border-radius:10px; background:var(--hull-2); color:var(--scan) }
.kind-tile .ic{ width:20px; height:20px }
.badge{ display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:6px; border:1px solid var(--line); font-family:var(--f-mono); font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); white-space:nowrap }
.badge-warn{ color:var(--warn); border-color:color-mix(in srgb, var(--warn) 45%, transparent) }
.badge-cls{ color:var(--text) }
.badge-cls.s{ color:var(--flare); border-color:color-mix(in srgb, var(--flare) 55%, transparent) }
.badge .ic{ width:12px; height:12px; stroke-width:3; margin:0 3px 0 -1px }
.badge-done{ color:var(--scan); border-color:color-mix(in srgb, var(--scan) 45%, transparent) }

/* Log home */
.totals{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px }
.total{ display:grid; justify-items:start; gap:0; padding:10px 12px; border-radius:var(--r-m); border:1px solid var(--line-soft); background:var(--hull); text-align:left; cursor:pointer; min-width:0 }
.total b{ font-family:var(--f-display); font-weight:600; font-size:26px; line-height:1.15; font-variant-numeric:tabular-nums }
.total span{ font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100% }
.banner{ display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:var(--r-l); background:var(--flare-soft); border:1px solid color-mix(in srgb, var(--flare) 28%, transparent) }
.banner > div{ flex:1; min-width:0 }
.banner p{ margin:2px 0 0; color:var(--muted); font-size:14px }
.banner-warn{ background:color-mix(in srgb, var(--warn) 11%, transparent); border-color:color-mix(in srgb, var(--warn) 35%, transparent) }
.banner.col{ flex-direction:column; align-items:stretch; gap:10px }
.banner-actions{ display:flex; flex-wrap:wrap; gap:8px }
.ic.inline-ic{ width:18px; height:18px; vertical-align:-4px }
.loading{ display:flex; align-items:center; gap:12px; color:var(--muted); padding:24px 4px }
.pulse{ width:12px; height:12px; border-radius:50%; background:var(--scan); animation:pulse 1.2s ease-in-out infinite }
.empty{ display:grid; gap:10px; justify-items:start; padding:24px 20px; border:1px dashed var(--line); border-radius:var(--r-l) }
.empty h3{ margin:0; font-family:var(--f-display); font-size:22px; font-weight:600; text-wrap:balance }
.empty p{ margin:0; color:var(--muted); max-width:52ch }

/* Detail hero */
.hero{ position:relative; display:grid; gap:6px; padding-top:4px; min-height:100px; isolation:isolate }
.hero > .eyebrow, .hero > h2, .hero > .hero-sub{ padding-right:108px }
.eyebrow{ margin:0; font-family:var(--f-display); font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted) }
.hero h2{ margin:0; font-family:var(--f-display); font-weight:700; font-size:clamp(28px, 7.4vw, 40px); line-height:1.08; text-wrap:balance; overflow-wrap:anywhere }
.hero-sub{ margin:0; color:var(--muted) }
.orb{ position:absolute; top:-8px; right:-8px; width:118px; max-width:40%; aspect-ratio:1; border-radius:50%; z-index:-1; pointer-events:none;
  background:radial-gradient(circle, #FFFFFF 0 7%, var(--star) 21%, color-mix(in srgb, var(--star) 38%, transparent) 40%, transparent 68%);
  animation:flare-in .9s cubic-bezier(.2,.7,.2,1) both }
.orb::after{ content:""; position:absolute; inset:-35%; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--star) 16%, transparent), transparent 62%) }
.orb.planet{ width:92px; top:4px; right:4px; background:radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--biome) 50%, #FFFFFF) 0, var(--biome) 46%, color-mix(in srgb, var(--biome) 42%, #000000) 100%); box-shadow:0 0 44px -10px var(--biome) }
.orb.planet.moon{ width:62px; top:16px; right:18px }
.orb.planet::after{ display:none }
.hero .kind-tile.xl{ position:absolute; top:6px; right:4px; width:74px; height:74px; border-radius:22px }
.kind-tile.xl .ic{ width:38px; height:38px; stroke-width:1.6 }
.hero-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:6px }
.crumbs{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px }
.crumb{ display:inline-flex; align-items:center; gap:8px; min-height:36px; max-width:100%; padding:0 10px 0 8px; border-radius:999px; border:1px solid var(--line); background:var(--hull); font-size:14px; font-weight:700; cursor:pointer }
.crumb > span:not([class]){ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0 }
.crumb .star-dot{ width:20px; height:20px }
.crumb .disc{ width:16px; height:16px; margin:2px }
.crumb .ic{ width:16px; height:16px; color:var(--faint) }

/* Crews */
.badge-crew{ color:var(--scan); border-color:color-mix(in srgb, var(--scan) 40%, transparent); text-transform:none; letter-spacing:0; max-width:96px }
.badge-crew > span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.hero .badge-crew{ max-width:100% }
.set .field{ justify-self:stretch }
.crew-code{ display:flex; align-items:center; gap:14px }
.crew-code .mono{ font-size:26px; letter-spacing:.12em }
.live-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--faint); vertical-align:1px }
.live-dot.live{ background:var(--scan) }
.live-pill{ font-family:var(--f-mono); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint) }
.live-pill.live{ color:var(--scan) }
.section-acts{ display:flex; align-items:center; gap:12px }

/* Resource finder */
.here{ display:flex; align-items:center; gap:12px; padding:12px 12px 12px 14px; border-radius:var(--r-l); background:var(--hull); border:1px solid var(--line-soft) }
.here > div{ flex:1; min-width:0; display:grid }
.here b{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.here small{ overflow-wrap:anywhere }
.here small{ color:var(--muted); font-size:14px }

/* Trade routes */
.steps{ display:grid; gap:16px }
.step{ display:grid; gap:8px; min-width:0 }
.step-head{ display:flex; align-items:flex-start; gap:10px }
.step-n{ flex:none; width:26px; height:26px; margin-top:1px; border-radius:50%; display:grid; place-items:center; background:var(--flare-soft); color:var(--flare); font-family:var(--f-display); font-weight:700; font-size:14px }
.step-head > div{ display:grid; min-width:0 }
.step-head b{ font-size:16px }
.step-head small{ color:var(--muted); font-size:14px }
.step > .muted-note{ margin-left:36px; font-size:14px; color:var(--faint) }
.chip-box .guide-sub{ margin:4px 2px 8px }
.chip-box .chips + .guide-sub{ margin-top:14px }
.tr{ display:grid; gap:22px }
.pct{ display:flex; align-items:center; gap:6px }
.pct > span{ flex:none; font-family:var(--f-mono); font-weight:600; color:var(--muted) }
.pct .input{ flex:1 }

/* Recipe book */
.tags .plus{ align-self:center; color:var(--faint); font-weight:700 }
.tag-link{ color:var(--flare); border-color:color-mix(in srgb, var(--flare) 40%, transparent); font:inherit; font-size:14px; cursor:pointer }

/* Biome guide in the planet form */
.guide{ border:1px solid var(--line-soft); border-radius:var(--r-m); background:var(--hull) }
.guide > summary{ display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; min-height:44px; padding:8px 12px; cursor:pointer; list-style:none; color:var(--flare); font-weight:700; font-size:15px }
.guide > summary::-webkit-details-marker{ display:none }
.guide > summary::before{ content:""; width:7px; height:7px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(-45deg); transition:transform .15s; margin-right:2px }
.guide[open] > summary::before{ transform:rotate(45deg) }
.guide-hint{ color:var(--scan); font-size:13px; font-weight:700 }
.guide-body{ display:grid; gap:10px; padding:0 10px 10px }
.guide-body p{ margin:0 2px; font-size:14px; color:var(--muted) }
.guide-list{ display:grid; gap:6px }
.guide-row{ display:flex; align-items:flex-start; gap:10px; width:100%; padding:8px 10px; border-radius:10px; border:1px solid transparent; background:var(--hull-2); color:var(--text); text-align:left; cursor:pointer }
.guide-row .sw{ flex:none; width:12px; height:12px; margin-top:5px; border-radius:50%; background:var(--sw) }
.guide-row b{ font-size:15px }
.guide-row small{ display:block; color:var(--muted); font-size:13px; line-height:1.45 }
.guide-row em{ margin-left:8px; font-style:normal; font-size:12px; font-weight:700; color:var(--scan) }
.guide-row.match{ border-color:var(--scan) }
.guide-row[aria-pressed="true"]{ border-color:var(--flare) }
.guide-sub{ margin:4px 2px 0; font-family:var(--f-display); font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted) }

.stats{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; margin:0; background:var(--line-soft); border:1px solid var(--line-soft); border-radius:var(--r-l); overflow:hidden }
.stats > div{ background:var(--hull); padding:10px 14px; min-width:0 }
.stats > div:last-child:nth-child(odd){ grid-column:1 / -1 }
.stats dt{ font-family:var(--f-display); font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted) }
.stats dd{ margin:2px 0 0; font-weight:700; overflow-wrap:anywhere }
.mono{ font-family:var(--f-mono); font-weight:600; letter-spacing:.03em }
.notes{ margin:0; white-space:pre-wrap; overflow-wrap:anywhere; padding:12px 14px; border-radius:var(--r-l); background:var(--hull); border:1px solid var(--line-soft); max-width:65ch }
.tags{ display:flex; flex-wrap:wrap; gap:6px }
.tag{ padding:4px 10px; border-radius:999px; background:var(--hull); border:1px solid var(--line-soft); font-size:14px }
.fauna{ display:grid; gap:8px; padding:12px 14px; border-radius:var(--r-l); background:var(--hull); border:1px solid var(--line-soft) }
.fauna-line{ display:flex; justify-content:space-between; gap:12px; font-size:15px }
.fauna-line b{ font-family:var(--f-mono); font-variant-numeric:tabular-nums }
.fauna-count{ display:flex; align-items:center; gap:12px }
.fauna-num{ flex:1; display:grid; justify-items:center; min-width:0 }
.fauna-num b{ font-family:var(--f-display); font-weight:600; font-size:32px; line-height:1.1; font-variant-numeric:tabular-nums }
.fauna-num span{ font-size:14px; color:var(--muted) }
.fauna-num.done span{ color:var(--scan); font-weight:700 }
.step-btn{ width:52px; height:52px; flex:none; display:grid; place-items:center; border-radius:16px; border:1px solid var(--line); background:var(--hull-2); color:var(--text); cursor:pointer; touch-action:manipulation }
.step-btn .ic{ width:24px; height:24px; stroke-width:2.4 }
.step-btn.plus{ background:var(--flare); color:var(--flare-ink); border-color:transparent }
.step-btn:disabled{ opacity:.35 }
.step-btn:not(:disabled):active{ transform:scale(.94) }
.fauna .hint{ margin:0 }
.meter{ height:6px; border-radius:3px; background:var(--hull-2); overflow:hidden }
.meter > i{ display:block; height:100%; border-radius:3px; background:var(--scan) }
.coords{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; border-radius:var(--r-l); background:var(--hull); border:1px solid var(--line-soft) }
.coords .mono{ font-size:17px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; min-width:0 }

/* Portal glyphs */
/* Glyph tiles stay dark with glowing white glyphs in both themes, as in the game.
   On phones the 12 glyphs sit in two rows of six, so each one is big enough to read. */
.glyphs{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:4px }
@media (max-width:560px){ .glyphs{ grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px } }
.glyph{ aspect-ratio:1; max-width:100%; display:grid; place-items:center; border-radius:8px; background:#0E0C1E; border:1px solid #2C2850; color:#F6F4FF }
.glyph .ic, .gkey .ic{ stroke-width:1.6; filter:drop-shadow(0 0 1.6px rgba(255,255,255,.6)) }
.glyph .ic{ width:86%; height:86% }
.glyph.empty{ background:transparent; border-style:dashed; border-color:var(--line) }
.glyph-code{ display:flex; align-items:center; justify-content:space-between; gap:12px }
.glyph-code .mono{ font-size:14px; letter-spacing:.16em; color:var(--muted); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; min-width:0 }
.glyph-pad{ display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:6px }
.gkey{ display:grid; justify-items:center; gap:1px; padding:5px 0 3px; border-radius:10px; border:1px solid #2C2850; background:#0E0C1E; color:#F6F4FF; cursor:pointer; min-width:0 }
.gkey .ic{ width:30px; height:30px; max-width:100% }
.gkey span{ font-family:var(--f-mono); font-size:10px; color:#8F8AB0 }
.gkey:active{ background:var(--flare-soft); border-color:var(--flare) }

/* Photos */
.photos{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px }
.photos.n1{ grid-template-columns:1fr }
.photos.n2{ grid-template-columns:repeat(2,minmax(0,1fr)) }
.photo{ display:block; padding:0; border:0; border-radius:10px; overflow:hidden; aspect-ratio:1; max-width:100%; background:var(--hull-2); cursor:zoom-in }
.photos.n1 .photo{ aspect-ratio:16/9 }
.photo img, .pthumb img{ display:block; width:100%; height:100%; object-fit:cover }
.broken img{ visibility:hidden }
.photo-edit{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px }
.pthumb{ position:relative; aspect-ratio:1; max-width:100%; border-radius:10px; overflow:hidden; background:var(--hull-2) }
.pthumb-x{ position:absolute; top:4px; right:4px; width:28px; height:28px; display:grid; place-items:center; border:0; border-radius:50%; background:var(--scrim); color:var(--on-photo); cursor:pointer }
.pthumb-x .ic{ width:16px; height:16px; stroke-width:2.4 }
.pthumb.add{ display:grid; place-items:center; align-content:center; gap:2px; border:1px dashed var(--line); background:transparent; color:var(--muted); font-size:13px; cursor:pointer }
.pthumb.pending{ display:grid; place-items:center; padding:4px; text-align:center; font-size:12px; color:var(--muted) }

/* Buttons and chips */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:var(--r-m); border:1px solid var(--line); background:var(--hull); color:var(--text); font-weight:700; font-size:15px; cursor:pointer; text-decoration:none }
.btn .ic{ width:18px; height:18px; stroke-width:2.2 }
.btn-sm{ min-height:36px; padding:0 14px; font-size:14px }
.btn-primary{ background:var(--flare); color:var(--flare-ink); border-color:transparent }
.btn-ghost{ background:transparent; border-color:transparent; color:var(--flare); padding:0 10px }
.btn-danger{ background:transparent; color:var(--danger); border-color:color-mix(in srgb, var(--danger) 45%, transparent) }
.btn-danger-solid{ background:var(--danger); color:var(--void); border-color:transparent }
.btn:disabled{ opacity:.5 }
.chips{ display:flex; flex-wrap:wrap; gap:8px }
.chips.scroll{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:2px }
.chips.scroll::-webkit-scrollbar{ display:none }
.chips.scroll .chip{ flex:none }
.chip{ display:inline-flex; align-items:center; gap:7px; min-height:38px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--hull); color:var(--text); font-size:15px; cursor:pointer; white-space:nowrap }
.chip[aria-pressed="true"]{ background:var(--flare); border-color:var(--flare); color:var(--flare-ink); font-weight:700 }
.chip .n{ font-family:var(--f-mono); font-size:12px; opacity:.75 }
.chip .sw{ width:12px; height:12px; border-radius:50%; background:var(--sw); box-shadow:0 0 0 1px color-mix(in srgb, var(--text) 18%, transparent) }
.chip .ic{ width:16px; height:16px }
.chip[aria-pressed="true"] .ic{ fill:currentColor }
.chips.small .chip{ min-height:32px; padding:0 11px; font-size:14px }
.chip-box{ max-height:224px; overflow-y:auto; padding:10px; border-radius:var(--r-m); border:1px solid var(--line-soft); background:var(--hull) }
.chip-box .chip{ background:var(--hull-2); border-color:transparent }
.chip-box .chip[aria-pressed="true"]{ background:var(--flare); border-color:var(--flare) }

/* Bottom tabs and Add button */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--hull); border-top:1px solid var(--line-soft); padding-bottom:env(safe-area-inset-bottom,0px) }
.tabbar-inner{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); height:var(--tabbar-h) }
.tab{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:0; background:transparent; color:var(--muted); font-family:var(--f-display); font-size:12px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; cursor:pointer }
.tab[aria-current="page"]{ color:var(--flare) }
.tab[aria-current="page"]::before{ content:""; position:absolute; top:-1px; left:28%; right:28%; height:2px; border-radius:0 0 2px 2px; background:var(--flare) }
.tab-dot{ position:absolute; top:6px; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--flare); color:var(--flare-ink); font-family:var(--f-mono); font-size:11px; font-weight:600; line-height:18px; letter-spacing:0; text-align:center }
.fab{ position:fixed; z-index:21; right:max(max(16px, env(safe-area-inset-right,0px)), calc((100vw - 640px) / 2 + 16px)); bottom:calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom,0px));
  display:inline-flex; align-items:center; gap:8px; height:56px; padding:0 22px 0 16px; border:0; border-radius:18px; background:var(--flare); color:var(--flare-ink); font-weight:700; font-size:16px; cursor:pointer; box-shadow:var(--shadow) }
.fab .ic{ stroke-width:2.4 }

/* Sheets and forms */
.sheet{ position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center; background:var(--scrim); animation:fade .18s ease-out }
.sheet-panel{ width:100%; max-width:640px; max-height:calc(100% - 20px - env(safe-area-inset-top,0px)); display:flex; flex-direction:column; background:var(--void); border:1px solid var(--line-soft); border-bottom:0; border-radius:var(--r-l) var(--r-l) 0 0; box-shadow:var(--shadow); outline:none; animation:rise .24s cubic-bezier(.2,.8,.2,1) }
.sheet-panel.tall{ height:calc(100% - 20px - env(safe-area-inset-top,0px)) }
.sheet-head{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; padding-block:8px; padding-left:max(8px, env(safe-area-inset-left,0px)); padding-right:max(12px, env(safe-area-inset-right,0px)); border-bottom:1px solid var(--line-soft) }
.sheet-head > :first-child{ justify-self:start }
.sheet-head > :last-child{ justify-self:end }
.sheet-head h2{ margin:0; font-family:var(--f-display); font-size:17px; font-weight:600; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52vw }
.sheet-body{ flex:1; overflow-y:auto; overscroll-behavior:contain; display:grid; gap:20px; align-content:start; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:18px calc(28px + env(safe-area-inset-bottom,0px)) }
.field{ display:grid; gap:7px; min-width:0; margin:0; border:0; padding:0 }
.lbl{ font-family:var(--f-display); font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted) }
.req{ font-style:normal; font-family:var(--f-body); font-weight:400; letter-spacing:0; text-transform:none; color:var(--faint); margin-left:6px }
.hint{ font-size:13px; color:var(--faint) }
.input{ width:100%; min-width:0; padding:11px 12px; border-radius:var(--r-m); border:1px solid var(--line); background:var(--hull); color:var(--text); font-family:var(--f-body); font-size:16px }
.input::placeholder{ color:var(--faint) }
.input:focus{ outline:2px solid var(--flare); outline-offset:0; border-color:transparent }
.input.mono{ font-family:var(--f-mono); letter-spacing:.06em }
textarea.input{ min-height:96px; resize:vertical; line-height:1.45 }
.row2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; align-items:start }
@media (max-width:370px){ .row2{ grid-template-columns:1fr } }
.add-row{ display:flex; gap:8px }
.add-row .input{ flex:1 }
.pair{ display:flex; align-items:center; gap:10px }
.pair .input{ width:6.5em }
.pair span{ color:var(--muted) }
.form-error{ padding:10px 12px; border-radius:var(--r-m); background:color-mix(in srgb, var(--danger) 13%, transparent); color:var(--danger); font-weight:700 }
.form-ok{ padding:10px 12px; border-radius:var(--r-m); background:color-mix(in srgb, var(--scan) 13%, transparent); color:var(--scan); font-weight:700 }
.danger-zone{ padding-top:16px; border-top:1px solid var(--line-soft) }
.confirm{ display:grid; gap:12px; padding:18px; border-radius:var(--r-l); border:1px solid color-mix(in srgb, var(--danger) 40%, transparent); background:color-mix(in srgb, var(--danger) 7%, transparent) }
.confirm h3{ margin:0; font-family:var(--f-display); font-size:20px; font-weight:600; overflow-wrap:anywhere }
.confirm p{ margin:0; color:var(--muted) }
.confirm-actions{ display:flex; flex-wrap:wrap; gap:10px }
.choices{ display:grid; gap:10px }
.choice{ display:flex; align-items:center; gap:14px; width:100%; padding:14px; border-radius:var(--r-l); border:1px solid var(--line-soft); background:var(--hull); text-align:left; cursor:pointer }
.choice:hover{ border-color:var(--line) }
.choice:disabled{ opacity:.45 }
.choice > span:last-child{ display:grid; min-width:0 }
.choice b{ font-size:17px }
.choice small{ color:var(--muted); font-size:14px }
.set{ display:grid; gap:8px; justify-items:start; padding-bottom:18px; border-bottom:1px solid var(--line-soft) }
.set:last-child{ border-bottom:0 }
.set p{ margin:0; max-width:56ch }

/* Overlays */
.lightbox{ position:fixed; inset:0; z-index:60; display:grid; place-items:center; background:var(--lightbox); padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)) }
.lightbox img{ max-width:100%; max-height:100%; border-radius:8px; object-fit:contain }
.lb-close{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); right:calc(env(safe-area-inset-right,0px) + 12px); color:var(--on-photo); background:var(--scrim) }
.toast{ position:fixed; z-index:70; left:16px; right:16px; margin-inline:auto; width:fit-content; bottom:calc(var(--tabbar-h) + 88px + env(safe-area-inset-bottom,0px)); padding:10px 16px; border-radius:12px; background:var(--text); color:var(--void); font-weight:700; font-size:15px; text-align:center; box-shadow:var(--shadow); opacity:0; visibility:hidden; transform:translateY(8px); transition:opacity .18s, transform .18s, visibility .18s }
.toast.show{ opacity:1; visibility:visible; transform:none }
.update-bar{ position:fixed; z-index:69; left:16px; right:16px; margin-inline:auto; width:fit-content; max-width:calc(100% - 32px); bottom:calc(var(--tabbar-h) + 88px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; gap:12px; padding:6px 6px 6px 16px; border-radius:14px; background:var(--text); color:var(--void); font-weight:700; font-size:15px; box-shadow:var(--shadow) }
.update-bar .btn{ min-height:36px; background:var(--flare); color:var(--flare-ink); border-color:transparent }

@keyframes flare-in{ from{ transform:scale(.7); opacity:.45 } }
@keyframes pulse{ 50%{ opacity:.25; transform:scale(.7) } }
@keyframes rise{ from{ transform:translateY(24px); opacity:.6 } }
@keyframes fade{ from{ opacity:0 } }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation:none !important; transition:none !important } }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <button class="icon-btn" id="btn-back" data-act="back" aria-label="Back" data-icon="back" hidden></button>
    <h1 class="top-title" id="top-title">Traveller's Log</h1>
    <span class="ro-pill" id="ro-pill" hidden>View only</span>
    <span id="top-action"></span>
  </div>
</header>

<main class="wrap" id="view">

</main>

<nav class="tabbar" aria-label="Sections">

</nav>

<button class="fab" id="fab" data-act="add" data-icon="plus" hidden><span>Add</span></button>
<div class="sheet" id="sheet" hidden></div>
<div class="lightbox" id="lightbox" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="update-bar" id="update-bar" role="status" hidden><span>New version ready</span><button type="button" class="btn btn-sm" data-act="reload">Reload</button></div>

function indexes() {
  const pBySys = new Map(), fBySys = new Map(), fByPl = new Map();

  for (const p of S.planets.values()) push(pBySys, p.systemId, p);
  for (const f of S.finds.values()) { push(fBySys, f.systemId, f); push(fByPl, f.planetId, f); }
  return { ps: id => pBySys.get(id) || [], fs: id => fBySys.get(id) || [], fp: id => fByPl.get(id) || [] };
}

async function withRetry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === 'unavailable') { await sleep(300 + Math.random() * 700); return fn(); }

  }
}

function render() {
  const route = current(), X = indexes();

  const v = viewFor(route, X), same = v.key === lastKey;
  if (!same) { viewHead.innerHTML = v.head; lastKey = v.key; }

  const boxes = same ? [...viewBody.querySelectorAll('[data-scroll-key]')].map(el => [el.dataset.scrollKey, el.scrollTop]) : [];
  viewBody.innerHTML = v.body;
  for (const [k, t] of boxes) { const el = viewBody.querySelector(`[data-scroll-key="${k}"]`); if (el) el.scrollTop = t; }
  hydratePhotos(viewBody);

}

function renderTop(route) {
  const TITLES = { log: "Traveller's Log", systems: 'Star systems', planets: 'Planets & moons', finds: 'Finds', tools: 'Tools' };
  let title = TITLES[S.tab], action = '';
  if (route.type === 'system') title = 'Star system';
  if (route.type === 'planet') title = (S.planets.get(route.id) || {}).body === 'Moon' ? 'Moon' : 'Planet';
  if (route.type === 'find') title = KIND_LABEL[(S.finds.get(route.id) || {}).kind] || 'Find';
  if (route.type === 'resources') title = 'Resource finder';
  if (route.type === 'trade') title = 'Trade routes';
  if (route.type === 'translate') title = 'Address translator';
  if (route.type === 'recipes') title = 'Recipe book';
  if (route.type === 'recipe') title = 'Recipe';
  if (route.type === 'tab' && S.tab === 'log') {
    action = `<button class="icon-btn" data-act="settings" aria-label="Log settings">${icon('sliders')}</button>`;
  } else if (COLL[route.type] && S.canWrite && isMine(S[COLL[route.type]].get(route.id))) {
    action = `<button class="top-btn" data-act="edit" data-type="${route.type}" data-id="${esc(route.id)}">${icon('edit')}Edit</button>`;
  }
  $('#top-title').textContent = title;
  $('#btn-back').hidden = route.type === 'tab';
  const slot = $('#top-action');
  if (slot.innerHTML !== action) slot.innerHTML = action;
}

function viewFor(route, X) {
  if (route.type === 'system') return { key: 's:' + route.id, head: '', body: viewSystem(route.id, X) };
  if (route.type === 'planet') return { key: 'p:' + route.id, head: '', body: viewPlanet(route.id, X) };
  if (route.type === 'find') return { key: 'f:' + route.id, head: '', body: viewFind(route.id) };
  if (route.type === 'resources') return { key: 'resources', head: '', body: viewResources() };
  if (route.type === 'trade') return { key: 'trade', head: '', body: viewTrade() };
  // The translator's boxes sit in the head, which isn't redrawn while you type
  if (route.type === 'translate') return { key: 'translate', head: translatorHead(), body: `<div id="tr-result">${trResult()}</div>` };
  if (route.type === 'recipes') return { key: 'recipes', head: searchBox('recipes', 'Search dishes and ingredients'), body: viewRecipes() };
  if (route.type === 'recipe') return { key: 'r:' + route.id, head: '', body: viewRecipe(route.id) };
  if (S.tab === 'systems') return { key: 'tab:systems', head: searchBox('systems', 'Filter by name, galaxy, region, glyphs'), body: viewSystems(X) };
  if (S.tab === 'planets') return { key: 'tab:planets', head: searchBox('planets', 'Filter by name, biome, resource'), body: viewPlanets() };
  if (S.tab === 'finds') return { key: 'tab:finds', head: searchBox('finds', 'Filter by name, type, notes'), body: viewFinds() };
  if (S.tab === 'tools') return { key: 'tab:tools', head: '', body: viewTools() };
  return { key: 'tab:log', head: searchBox('log', 'Search your whole log'), body: viewLog(X) };
}

/* ---------- Building blocks ---------- */
function searchBox(k, ph) {
  return `<div class="search">${icon('search')}<input class="input" type="search" id="q-${k}" data-filter="${k}" value="${esc(S.filters[k])}" placeholder="${esc(ph)}" aria-label="${esc(ph)}" autocomplete="off" enterkeyhint="search"></div>`;
}
function gate() {
  if (S.status === 'unsupported') return `<div class="banner banner-warn" role="status"><div><b>This browser can't save your log.</b><p>Open the app in Safari or Chrome, and not in a private window.</p></div></div>`;
  if (S.status === 'connecting') return `<div class="loading" role="status"><span class="pulse"></span>Opening your log…</div>`;
  return '';
}
const section = (title, action, content) => `<section class="section"><div class="section-head"><h3>${title}</h3>${action || ''}</div>${content}</section>`;
const listOf = rows => `<div class="list">${rows.join('')}</div>`;
const newBtn = (kind, label, ctx = {}) => `<button class="btn btn-primary" data-act="new" data-kind="${kind}" data-system="${esc(ctx.system || '')}" data-planet="${esc(ctx.planet || '')}">${icon('plus')}${esc(label)}</button>`;
const newLink = (kind, label, ctx = {}) => `<button class="link-btn" data-act="new" data-kind="${kind}" data-system="${esc(ctx.system || '')}" data-planet="${esc(ctx.planet || '')}" data-find-kind="${esc(ctx.findKind || '')}">${icon('plus')}${esc(label)}</button>`;
const emptyState = (title, text, action) => `<div class="empty"><h3>${esc(title)}</h3><p>${esc(text)}</p>${action || ''}</div>`;
const noMatch = q => `<p class="muted-note">Nothing matches “${esc(q)}”.</p>`;
const starDot = (color, extra = '') => `<span class="star-dot${extra}" style="--star:${starVar(color)}" aria-hidden="true"></span>`;
const planetDisc = p => `<span class="disc${p.body === 'Moon' ? ' moon' : ''}" style="--biome:${biomeColor(p.biome)}" aria-hidden="true"></span>`;
const kindTile = (kind, extra = '') => `<span class="kind-tile${extra}" aria-hidden="true">${icon(KIND_LABEL[kind] ? kind : 'other')}</span>`;

function rowEnd(item, extra = '') {
  const who = item._crew ? `<span class="badge badge-crew"><span>${esc(ownerName(item._owner))}</span></span>` : '';
  return `<span class="row-end">${who}${extra}${item.favorite ? icon('star', 'ic-fav') : ''}${icon('chevron', 'ic-chev')}</span>`;
}
// `note` goes first in the grey line under the name, e.g. "Edited". `sub` replaces that line.
function systemRow(s, X, note = '', sub = '') {
  if (!sub) {
    const np = X.ps(s.id).length, nf = X.fs(s.id).length;
    sub = [note, s.galaxy, s.lifeform && s.lifeform !== 'None' ? s.lifeform : '', plural(np, 'planet'), nf ? plural(nf, 'find') : ''].filter(Boolean).join(' · ');
  }
  return `<button class="row" data-act="open" data-type="system" data-id="${esc(s.id)}">${starDot(s.starColor)}<span class="row-main"><span class="row-title">${esc(s.name || 'Unnamed system')}</span><span class="row-sub">${esc(sub)}</span></span>${rowEnd(s)}</button>`;
}
// Every creature on the world found (on a crewmate's planet, by you)
const faunaDone = p => { const t = Number(p.faunaTotal) || 0; return t > 0 && (Number(p.faunaFound) || 0) >= t; };
const doneBadge = () => `<span class="badge badge-done">${icon('check')}All creatures found</span>`;
// In lists, a finished world gets a tick on its dot, so the row keeps room for its name
const planetIcon = p => faunaDone(p) ? `<span class="disc-wrap">${planetDisc(p)}<span class="done-pip" aria-hidden="true">${icon('check')}</span></span>` : planetDisc(p);
function planetRow(p, showSystem = true, sub = '', note = '') {
  const sys = S.systems.get(p.systemId);
  sub = [note, sub || [p.body === 'Moon' ? 'Moon' : 'Planet', p.biome, showSystem ? (sys ? sys.name : 'Unknown system') : p.description].filter(Boolean).join(' · ')].filter(Boolean).join(' · ');
  const st = tierOf(SENTINEL_WORDS, p.sentinels);
  const hostile = st === 'Aggressive' || st === 'Corrupted' ? `<span class="badge badge-warn">${st}</span>` : '';
  const done = faunaDone(p) ? '<span class="vh"> (all creatures found)</span>' : '';
  return `<button class="row" data-act="open" data-type="planet" data-id="${esc(p.id)}">${planetIcon(p)}<span class="row-main"><span class="row-title">${esc(p.name || 'Unnamed')}${done}</span><span class="row-sub">${esc(sub)}</span></span>${rowEnd(p, hostile)}</button>`;
}
function findWhere(f) {
  const p = f.planetId && S.planets.get(f.planetId), s = S.systems.get(f.systemId);
  if (p) return p.name;
  if (s) return `${s.name}, in space`;
  return 'Unknown location';
}
function findRow(f, showWhere = true, note = '') {
  const kl = KIND_LABEL[f.kind] || 'Find';
  const sub = [note, kl, f.subtype && f.subtype !== kl ? f.subtype : '', showWhere && f.kind !== 'fleet' ? findWhere(f) : ''].filter(Boolean).join(' · ');
  const cls = f.cls ? `<span class="badge badge-cls${f.cls === 'S' ? ' s' : ''}">${esc(f.cls)}</span>` : '';
  return `<button class="row" data-act="open" data-type="find" data-id="${esc(f.id)}">${kindTile(f.kind)}<span class="row-main"><span class="row-title">${esc(f.name || 'Unnamed find')}</span><span class="row-sub">${esc(sub)}</span></span>${rowEnd(f, cls)}</button>`;
}
function recipeRow(r, note = '') {
  const ing = (Array.isArray(r.ingredients) ? r.ingredients : []).filter(Boolean);
  const sub = [note, ing.length ? ing.join(' + ') : 'No ingredients noted'].filter(Boolean).join(' · ');
  return `<button class="row" data-act="open" data-type="recipe" data-id="${esc(r.id)}"><span class="kind-tile" aria-hidden="true">${icon('recipe')}</span><span class="row-main"><span class="row-title">${esc(r.name || 'Unnamed recipe')}</span><span class="row-sub">${esc(sub)}</span></span>${rowEnd(r)}</button>`;
}
const rowFor = (t, v, X, note = '') => t === 'system' ? systemRow(v, X, note) : t === 'planet' ? planetRow(v, true, '', note) : t === 'recipe' ? recipeRow(v, note) : findRow(v, true, note);
const toolRow = (act, ic, title, sub) => `<button class="row" data-act="${act}"><span class="kind-tile" aria-hidden="true">${icon(ic)}</span><span class="row-main"><span class="row-title">${title}</span><span class="row-sub">${sub}</span></span><span class="row-end">${icon('chevron', 'ic-chev')}</span></button>`;
// The Tools tab: where you are (used by the finder and trade routes), then the tools
function viewTools() {
  const g = gate(); if (g) return g;
  const nr = S.recipes.size;
  return hereSection('tools') + section('Tools', '', listOf([
    toolRow('resources', 'mineral', 'Resource finder', 'Which planets have what you need'),
    toolRow('trade', 'trade', 'Trade routes', 'Where to sell for the most units'),
    toolRow('translate', 'portal', 'Address translator', 'Galactic address to portal glyphs, and back'),
    toolRow('recipes', 'recipe', 'Recipe book', nr ? `${plural(nr, 'recipe')}${crew.code ? ', shared with your crew' : ''}` : (crew.code ? 'Food recipes, shared with your crew' : 'Your food recipes')),
  ]));
}

function glyphStrip(code) {
  const chars = String(code || '').toUpperCase().split('');
  let cells = '';
  for (let i = 0; i < 12; i++) {
    const c = chars[i];
    cells += c && GLYPH_PATHS[c] ? `<span class="glyph" title="${GLYPH_NAME[c]}">${glyphSvg(c)}</span>` : '<span class="glyph empty"></span>';
  }
  const names = chars.map(c => GLYPH_NAME[c]).filter(Boolean).join(', ');
  return `<div class="glyphs" role="img" aria-label="${esc(names ? 'Portal glyphs: ' + names : 'No glyphs entered')}">${cells}</div>`;
}
// P SSS YY ZZZ XXX: planet, system, then the Y, Z and X coordinates
const groupGlyphs = c => c.length === 12 ? `${c[0]} ${c.slice(1, 4)} ${c.slice(4, 6)} ${c.slice(6, 9)} ${c.slice(9)}` : c;

function statsBlock(pairs) {
  const items = pairs.filter(p => p[1] !== '' && p[1] != null);
  if (!items.length) return '';
  return `<dl class="stats">${items.map(([k, v, cls]) => `<div><dt>${esc(k)}</dt><dd${cls ? ` class="${cls}"` : ''}>${esc(v)}</dd></div>`).join('')}</dl>`;
}
const notesBlock = n => n ? section('Notes', '', `<p class="notes">${esc(n)}</p>`) : '';
function photosBlock(ids) {
  ids = (ids || []).filter(validAssetId);
  if (!ids.length) return '';
  return section(`Screenshots<span class="count">${ids.length}</span>`, '', `<div class="photos n${Math.min(ids.length, 3)}">${ids.map(id => `<button class="photo" data-act="photo" data-pid="${esc(id)}" aria-label="View screenshot full size">${imgTag(id)}</button>`).join('')}</div>`);
}
function heroActions(type, item, extra = '') {
  const here = type === 'system' ? hereChip(item) : '';
  if (item._crew) return `<div class="hero-actions"><span class="badge badge-crew"><span>Shared by ${esc(ownerName(item._owner))}</span></span>${here}${extra}</div>`;
  const fav = S.canWrite ? `<button class="chip" data-act="fav" data-type="${type}" data-id="${esc(item.id)}" aria-pressed="${!!item.favorite}">${icon('star')}${item.favorite ? 'Starred' : 'Star'}</button>` : (item.favorite ? `<span class="badge">Starred</span>` : '');
  const ex = item.example ? '<span class="badge">Example</span>' : '';
  return fav || ex || here || extra ? `<div class="hero-actions">${fav}${here}${ex}${extra}</div>` : '';
}
// "I'm here" on a system page tells the resource finder where you are
function hereChip(s) {
  const on = !!(S.here && S.here.systemId === s.id);
  return `<button class="chip" data-act="here-sys" data-id="${esc(s.id)}" aria-pressed="${on}">${icon('poi')}${on ? 'You’re here' : 'I’m here'}</button>`;
}
function metaLine(item) {
  const c = fmtDate(item.createdAt), u = fmtDate(item.updatedAt);
  const by = item._crew ? ` by ${esc(ownerName(item._owner))} on` : '';
  return c ? `<p class="meta">Logged${by} ${esc(c)}${u && u !== c ? ` · edited ${esc(u)}` : ''}</p>` : '';
}
function missing() {
  return gate() || `<div class="empty"><h3>This entry is gone</h3><p>It was deleted, maybe in another window.</p><button class="btn" data-act="back">Go back</button></div>`;
}

/* ---------- Views ---------- */
function viewLog(X) {
  const g = gate(); if (g) return g;
  const out = [installBanner()];
  const ex = exampleCount();
  if (ex && S.canWrite) out.push(`<div class="banner"><div><b>These are example entries.</b><p>They show how a logged system looks. Remove them when you start your own log.</p></div><button class="btn btn-sm" data-act="remove-examples">Remove</button></div>`);
  const q = norm(S.filters.log);
  if (q) return out.join('') + searchResults(q, X);
  // Totals, Starred and Recently logged are your own; the crew gets its own section
  const ns = mineOf('systems').length, np = mineOf('planets').length, nf = mineOf('finds').length;
  if (!(ns + np + nf)) {
    out.push(emptyState('Your log is empty', 'Warp somewhere new, then log the system: its star, economy and portal glyphs. Planets and finds go inside it.', S.canWrite ? newBtn('system', 'Log a star system') : ''));
    if (crew.code) out.push(crewNewSection(X), crewFeed(X));
    return out.join('');
  }
  out.push(`<div class="totals">${[['systems', ns, 'Systems'], ['planets', np, 'Planets'], ['finds', nf, 'Finds']].map(([t, n, l]) => `<button class="total" data-act="tab" data-tab="${t}"><b>${n}</b><span>${l}</span></button>`).join('')}</div>`);
  if (crew.code) out.push(crewNewSection(X));
  const tagged = [...mineOf('systems').map(v => ['system', v]), ...mineOf('planets').map(v => ['planet', v]), ...mineOf('finds').map(v => ['find', v]), ...mineOf('recipes').map(v => ['recipe', v])];
  const favs = tagged.filter(([, v]) => v.favorite);
  if (favs.length) out.push(section(`Starred<span class="count">${favs.length}</span>`, '', listOf(favs.map(([t, v]) => rowFor(t, v, X)))));
  const recent = tagged.sort((a, b) => byRecent(a[1], b[1])).slice(0, 12);
  out.push(section('Recently logged', '', listOf(recent.map(([t, v]) => rowFor(t, v, X)))));
  if (crew.code) out.push(crewFeed(X));
  return out.join('');
}

function crewPill() {
  const st = crew.status === 'live' ? 'Live' : crew.status === 'connecting' ? 'Connecting' : 'Offline';
  return `<span class="live-pill ${crew.status}"><span class="live-dot ${crew.status}"></span>${st}</span>`;
}
// What crewmates added or changed since you last opened the app
function crewNewSection(X) {
  const items = crewNewList();
  if (!items.length) return '';
  const edited = ([t, v]) => crewBase.has(crewKeyOf(t, v));
  const nEd = items.filter(edited).length, nAdd = items.length - nEd;
  const what = [nAdd ? `${nAdd} added` : '', nEd ? `${nEd} edited` : ''].filter(Boolean).join(', ');
  const shown = items.slice(0, 30), older = crewEntries().length > items.length;
  return section(`New from crew<span class="count">${items.length}</span>`, `<span class="section-acts">${older ? '' : crewPill()}<button class="link-btn" data-act="crew-clear">Clear</button></span>`,
    `<p class="meta">${what} since you last checked</p>${listOf(shown.map(e => rowFor(e[0], e[1], X, edited(e) ? 'Edited' : '')))}${items.length > shown.length ? `<p class="meta">And ${items.length - shown.length} more in the Systems, Planets and Finds tabs.</p>` : ''}`);
}
function crewFeed(X) {
  const fresh = new Set(crewNewList().map(([t, v]) => crewKeyOf(t, v)));
  const items = crewEntries().filter(([t, v]) => !fresh.has(crewKeyOf(t, v))).sort((a, b) => byRecent(a[1], b[1])).slice(0, 12);
  if (fresh.size) return items.length ? section('Earlier from crew', crewPill(), listOf(items.map(([t, v]) => rowFor(t, v, X)))) : '';
  return section('Crew discoveries', crewPill(),
    items.length ? listOf(items.map(([t, v]) => rowFor(t, v, X))) : '<p class="muted-note">Nothing from your crew yet. What they log shows up here straight away.</p>');
}

function searchResults(q, X) {
  const ss = all('systems').filter(s => sysHay(s).includes(q)).sort(byName);
  const ps = all('planets').filter(p => plHay(p).includes(q)).sort(byName);
  const fs = all('finds').filter(f => fdHay(f).includes(q)).sort(byName);
  const rs = all('recipes').filter(r => rcHay(r).includes(q)).sort(byName);
  if (!ss.length && !ps.length && !fs.length && !rs.length) return noMatch(S.filters.log.trim());
  return [
    ss.length ? section(`Systems<span class="count">${ss.length}</span>`, '', listOf(ss.map(s => systemRow(s, X)))) : '',
    ps.length ? section(`Planets & moons<span class="count">${ps.length}</span>`, '', listOf(ps.map(p => planetRow(p)))) : '',
    fs.length ? section(`Finds<span class="count">${fs.length}</span>`, '', listOf(fs.map(f => findRow(f)))) : '',
    rs.length ? section(`Recipes<span class="count">${rs.length}</span>`, '', listOf(rs.map(r => recipeRow(r)))) : '',
  ].join('');
}

function sortBar(list, n, noun, nouns) {
  const cur = S.filters.sort[list];
  return `<div class="list-bar"><span class="count">${plural(n, noun, nouns)}</span><div class="seg" role="group" aria-label="Sort order">${[['recent', 'Recent'], ['az', 'A–Z']].map(([v, l]) => `<button class="seg-btn" data-act="sort" data-list="${list}" data-sort="${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div></div>`;
}

function viewSystems(X) {
  const g = gate(); if (g) return g;
  if (!S.systems.size) return emptyState('No star systems yet', 'Log the system you are in right now: its star colour, economy and portal glyphs.', S.canWrite ? newBtn('system', 'Log a star system') : '');
  const q = norm(S.filters.systems);
  const items = sortBy(all('systems').filter(s => !q || sysHay(s).includes(q)), S.filters.sort.systems);
  return `<div class="stack">${sortBar('systems', items.length, 'system')}${items.length ? listOf(items.map(s => systemRow(s, X))) : noMatch(S.filters.systems.trim())}</div>`;
}

function viewPlanets() {
  const g = gate(); if (g) return g;
  if (!S.planets.size) return emptyState('No planets yet', 'Land somewhere and log its biome, weather, sentinels and resources.', S.canWrite ? (S.systems.size ? newBtn('planet', 'Log a planet') : newBtn('system', 'Log a star system first')) : '');
  const q = norm(S.filters.planets);
  const items = sortBy(all('planets').filter(p => !q || plHay(p).includes(q)), S.filters.sort.planets);
  return `<div class="stack">${sortBar('planets', items.length, 'world')}${items.length ? listOf(items.map(p => planetRow(p))) : noMatch(S.filters.planets.trim())}</div>`;
}

function viewFinds() {
  const g = gate(); if (g) return g;
  const q = norm(S.filters.finds);
  // Your freighter's ships are only ever yours: they're never shared with a crew
  const fleet = sortBy(all('finds').filter(f => f.kind === 'fleet' && isMine(f) && (!q || fdHay(f).includes(q))), S.filters.sort.finds);
  const fleetSec = section(`My freighter<span class="count">${fleet.length}</span>`, S.canWrite ? newLink('find', 'Add', { findKind: 'fleet' }) : '',
    fleet.length ? listOf(fleet.map(f => findRow(f))) : `<p class="muted-note">${q ? 'No ships match.' : 'List the starships and corvettes in your freighter. Only you see these, even in a crew.'}</p>`);
  const finds = all('finds').filter(f => f.kind !== 'fleet');
  if (!finds.length) return fleetSec + emptyState('No finds yet', 'Log creatures, plants, starships, multi-tools, bases and anything else worth coming back for.', S.canWrite ? (mineOf('systems').length ? newBtn('find', 'Log a find') : newBtn('system', 'Log a star system first')) : '');
  const counts = {};
  for (const f of finds) counts[f.kind] = (counts[f.kind] || 0) + 1;
  if (S.filters.findKind !== 'all' && !counts[S.filters.findKind]) S.filters.findKind = 'all';
  const kind = S.filters.findKind;
  const chips = `<div class="chips scroll" role="group" aria-label="Show only one kind"><button class="chip" data-act="kind" data-kind="all" aria-pressed="${kind === 'all'}">All <span class="n">${finds.length}</span></button>${FIND_KINDS.filter(([k]) => counts[k]).map(([k, l]) => `<button class="chip" data-act="kind" data-kind="${k}" aria-pressed="${kind === k}">${l} <span class="n">${counts[k]}</span></button>`).join('')}</div>`;
  const items = sortBy(finds.filter(f => (kind === 'all' || f.kind === kind) && (!q || fdHay(f).includes(q))), S.filters.sort.finds);
  return fleetSec + section('Finds', '', chips + `<div class="stack">${sortBar('finds', items.length, 'find')}${items.length ? listOf(items.map(f => findRow(f))) : noMatch(S.filters.finds.trim() || KIND_LABEL[kind])}</div>`);
}

function viewSystem(id, X) {
  const s = S.systems.get(id); if (!s) return missing();
  const planets = X.ps(id).slice().sort(byBody);
  const finds = X.fs(id).slice().sort(byRecent);
  return [
    `<section class="hero" style="--star:${starVar(s.starColor)}"><div class="orb" aria-hidden="true"></div>
      <p class="eyebrow">${esc([s.starColor ? s.starColor + ' star' : 'Star system', s.galaxy].filter(Boolean).join(' · '))}</p>
      <h2>${esc(s.name || 'Unnamed system')}</h2>
      ${s.region ? `<p class="hero-sub">${esc(s.region)}</p>` : ''}
      ${heroActions('system', s)}</section>`,
    s.glyphs ? section('Portal address', '', `<div class="stack">${glyphStrip(s.glyphs)}<div class="glyph-code"><span class="mono">${esc(groupGlyphs(s.glyphs))}</span><button class="link-btn" data-act="copy" data-text="${esc(s.glyphs)}">Copy code</button></div></div>`) : '',
    statsBlock([['Spectral class', s.starClass, 'mono'], ['Lifeform', s.lifeform], ['Economy', withTier(ECON_GROUPS, s.economy)], ['Wealth', labelOf(WEALTH, s.wealth)], ['Trade prices', tradeMods(s)], ['Conflict', labelOf(CONFLICT, s.conflict)]]),
    notesBlock(s.notes),
    photosBlock(s.photos),

}

// Creatures found, with − and + buttons on your own planets so counting doesn't need Edit
function faunaBlock(p) {
  const ft = Number(p.faunaTotal) || 0, ff = Math.min(Number(p.faunaFound) || 0, ft || Infinity);
  // Everyone counts for themselves: on a crewmate's planet this is your own count
  const canCount = S.canWrite, by = isMine(p) ? '' : ' by you';
  const noLife = tierOf(FAUNA_WORDS, p.fauna) === 'None';
  if (!ft && !ff && (noLife || !canCount)) return '';
  const done = ft > 0 && ff >= ft;
  const btn = (delta, ic, label, off) => `<button type="button" class="step-btn${delta > 0 ? ' plus' : ''}" data-act="fauna" data-id="${esc(p.id)}" data-delta="${delta}" aria-label="${label}"${off ? ' disabled' : ''}>${icon(ic)}</button>`;
  const count = `<div class="fauna-num${done ? ' done' : ''}" role="status"><b>${ff}${ft ? ` / ${ft}` : ''}</b><span>${done ? `All creatures found${by}` : `creatures found${by}`}</span></div>`;
  const meter = ft ? `<div class="meter" role="progressbar" aria-label="Creatures found" aria-valuemin="0" aria-valuemax="${ft}" aria-valuenow="${ff}"><i style="width:${Math.round(ff / ft * 100)}%"></i></div>` : '';
  const hint = isMine(p) && canCount && !ft ? '<p class="hint">Add the total from the Discoveries menu in Edit to track your progress.</p>' : '';
  return `<div id="fauna-block">${section('Fauna discovered', '', `<div class="fauna"><div class="fauna-count">${canCount ? btn(-1, 'minus', 'One fewer creature found', ff <= 0) : ''}${count}${canCount ? btn(1, 'plus', 'One more creature found', done) : ''}</div>${meter}${hint}</div>`)}</div>`;
}
async function bumpFauna(id, delta) {
  const p = S.planets.get(id);
  if (!p || !S.canWrite) return;
  const total = Number(p.faunaTotal) || 0, was = Number(p.faunaFound) || 0;
  const n = Math.max(0, total ? Math.min(total, was + delta) : was + delta);
  if (n === was) return;
  // Counting creatures isn't an edit: the planet's date stays, and the crew isn't told it changed
  const next = Object.assign({}, p, { faunaFound: n });
  S.planets.set(id, next);
  // Redraw just the counter, so the rest of the page doesn't flicker on every tap.
  // Finishing (or un-finishing) the planet redraws the page, for the badge at the top.
  const el = $('#fauna-block');
  if (el && faunaDone(p) === faunaDone(next)) el.outerHTML = faunaBlock(next); else render();
  if (total && n === total) toast('All creatures found on this planet!');
  // A crewmate's planet: the count is yours alone and stays on this phone
  if (p._crew) { myFauna.set(id, n); saveMyFauna(); if (crew.items.planets.has(id)) crew.items.planets.set(id, next); return; }
  try { await S.db.collection('planets').doc(id).update({ faunaFound: n }); }
  catch (e) {
    const cur = S.planets.get(id);
    if (cur) S.planets.set(id, Object.assign({}, cur, { faunaFound: was }));
    render(); toast(explain(e));
  }
}

/* ---------- Resource finder ---------- */
// Portal address P SSS YY ZZZ XXX → the region it's in. Each region is about 400 light years across.
function regionOf(code) {
  const g = String(code || '').toUpperCase();
  if (!/^[0-9A-F]{12}$/.test(g)) return null;
  const n = (s, size) => { const v = parseInt(s, 16); return v >= size / 2 ? v - size : v; };
  return { sys: g.slice(1, 4), y: n(g.slice(4, 6), 0x100), z: n(g.slice(6, 9), 0x1000), x: n(g.slice(9), 0x1000) };
}
const fmtLy = ly => `About ${(ly < 1000 ? Math.round(ly / 10) * 10 : Math.round(ly / 100) * 100).toLocaleString()} ly`;
// Where you said you are: a system from the log (read fresh, in case it was edited) or a typed portal address
function hereInfo() {
  const h = S.here; if (!h) return null;
  const s = h.systemId && S.systems.get(h.systemId);
  if (s) return { systemId: s.id, name: s.name || 'Unnamed system', glyphs: s.glyphs || '', galaxy: s.galaxy || '', region: s.region || '', star: s.starColor || '', economy: econType(s), wealth: s.wealth || '', buyMod: s.buyMod };
  return { systemId: '', name: h.name || 'A system not in your log', glyphs: h.glyphs || '', galaxy: h.galaxy || '', region: '', star: h.star || '', economy: tierOf(ECON_GROUPS, h.economy), wealth: '', buyMod: null };
}
// rank: 0 this system, 1 same region, 2 measured, 3 no address, 4 another galaxy, 5 unknown system
function distanceFrom(here, sys) {
  if (!sys) return { rank: 5, label: '' };
  if (here.systemId && here.systemId === sys.id) return { rank: 0, label: 'This system' };
  const g1 = norm(here.galaxy), g2 = norm(sys.galaxy);
  if (g1 && g2 && g1 !== g2) return { rank: 4, label: `In ${sys.galaxy}` };
  const a = regionOf(here.glyphs), b = regionOf(sys.glyphs);
  if (!a || !b) return { rank: 3, label: 'Distance unknown' };
  const d = Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
  if (!d) return a.sys === b.sys ? { rank: 0, label: 'This system' } : { rank: 1, label: 'Same region' };
  return { rank: 2, dist: d, label: fmtLy(d * 400) };
}
// Every resource on your planets and your crew's, with the worlds that have it
function resourceIndex() {
  const m = new Map();
  for (const p of S.planets.values()) {
    for (const r of Array.isArray(p.resources) ? p.resources : []) {
      const k = norm(r); if (!k) continue;
      let e = m.get(k); if (!e) m.set(k, e = { key: k, label: String(r).trim(), planets: [] });
      if (!e.planets.includes(p)) e.planets.push(p);
    }
  }
  return [...m.values()].sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: 'base' }));
}

// The "Where you are" card at the top of the Tools tab, the resource finder and trade routes
function hereSection(mode) {
  const here = hereInfo(), forTrade = mode === 'trade';
  const measured = !!(here && regionOf(here.glyphs));
  const what = forTrade && here ? [here.economy || 'Economy not noted', wealthShort(here.wealth)] : [here && here.galaxy, here && (here.region || (here.glyphs ? groupGlyphs(here.glyphs) : ''))];
  const card = here
    ? `<div class="here">${starDot(here.star)}<div><b>${esc(here.name)}</b><small>${esc(what.filter(Boolean).join(' · ') || 'No galaxy or portal address')}</small></div><button class="btn btn-sm" data-act="here-set">Change</button></div>${measured ? '' : `<p class="hint">This system has no portal address in your log, so distances can’t be worked out. Add its glyphs to see how far away other ${forTrade ? 'systems' : 'planets'} are.</p>`}`
    : `<div class="here">${kindTile('poi')}<div><b>Not set</b><small>${forTrade ? 'Tell the app to plan a route from here' : mode === 'tools' ? 'The resource finder and trade routes use it' : 'Tell the app, and the closest planets show first'}</small></div><button class="btn btn-sm btn-primary" data-act="here-set">Set</button></div>`;
  return section('Where you are', here ? '<button class="link-btn" data-act="here-clear">Clear</button>' : '', card);
}

function viewResources() {
  const g = gate(); if (g) return g;
  const here = hereInfo(), idx = resourceIndex(), out = [];
  const measured = !!(here && regionOf(here.glyphs));
  out.push(hereSection('find'));
  if (!idx.length) {
    out.push(emptyState('No resources logged yet', 'Add the resources you find to your planets, and this page shows where to get each one.', ''));
    return out.join('');
  }
  const sel = idx.find(e => e.key === S.filters.resource);
  out.push(section(`Resources<span class="count">${idx.length}</span>`, '', `<div class="chip-box" data-scroll-key="res"><div class="chips small" role="group" aria-label="Pick a resource">${idx.map(e => `<button class="chip" data-act="res" data-res="${esc(e.key)}" aria-pressed="${sel === e}">${esc(e.label)} <span class="n">${e.planets.length}</span></button>`).join('')}</div></div>`));
  if (!sel) {
    out.push(`<p class="muted-note">Pick a resource to see which planets and moons have it${here ? ', closest first' : ''}.</p>`);
    return out.join('');
  }
  const rows = sel.planets.map(p => { const sys = S.systems.get(p.systemId); return { p, sys, d: here ? distanceFrom(here, sys) : null }; })
    .sort((a, b) => (a.d && b.d ? (a.d.rank - b.d.rank) || ((a.d.dist || 0) - (b.d.dist || 0)) : 0) || byName(a.p, b.p));
  out.push(section(`${esc(sel.label)}<span class="count">${rows.length}</span>`, '',
    listOf(rows.map(({ p, sys, d }) => planetRow(p, true, [d && d.label, sys ? sys.name : 'Unknown system'].filter(Boolean).join(' · ')))) +
    (measured ? '<p class="hint">Closest first. Distances are rough, worked out from portal addresses.</p>' : '')));
  return out.join('');
}

const hereFromSystem = s => ({ systemId: s.id, name: s.name || '', glyphs: s.glyphs || '', galaxy: s.galaxy || '', star: s.starColor || '' });
function cleanHere(h) {
  if (!h || typeof h !== 'object') return null;
  const str = (v, n) => typeof v === 'string' ? v.slice(0, n) : '';
  return { systemId: str(h.systemId, 200), name: str(h.name, 200), glyphs: str(h.glyphs, 12).toUpperCase().replace(/[^0-9A-F]/g, ''), galaxy: str(h.galaxy, 60), star: str(h.star, 20), economy: str(h.economy, 60) };
}
function setHere(h) {
  S.here = h;
  (h ? store.put('meta', 'here', h) : store.del('meta', 'here')).catch(() => {});
  render();
}
function toggleHere(id) {
  const s = S.systems.get(id); if (!s) return;
  if (S.here && S.here.systemId === id) { setHere(null); toast('Location cleared'); return; }
  setHere(hereFromSystem(s)); toast(`You’re in ${s.name || 'this system'}`);
}
function openHere() {
  if (S.status !== 'ready') return;
  const h = S.here, rs = recentSystem();
  const draft = { systemId: '', galaxy: (h && h.galaxy) || (rs && rs.galaxy) || 'Euclid', glyphs: '', economy: '' };
  if (h && h.systemId && S.systems.has(h.systemId)) draft.systemId = h.systemId;
  else if (h) { draft.glyphs = h.glyphs || ''; draft.economy = h.economy || ''; }
  else if (rs) draft.systemId = rs.id;   // probably where you are: the last system you logged
  const form = { kind: 'here', id: null, draft, uploads: [], removed: [], uploading: 0, confirmDelete: false, error: '', saving: false };
  openSheet({ title: 'Where are you?', tall: true, form, render: () => renderForm(form), onSave: () => saveHere(form) });
}
function saveHere(form) {
  const d = form.draft, s = d.systemId && S.systems.get(d.systemId);
  let h;
  if (s) h = hereFromSystem(s);
  else {
    const g = String(d.glyphs || '').toUpperCase().replace(/[^0-9A-F]/g, '');
    if (g.length !== 12) { form.error = 'Enter all 12 portal glyphs, or pick a system from your log.'; refreshSheet(); $('#sheet-body').scrollTop = 0; return; }
    h = { systemId: '', name: '', glyphs: g, galaxy: String(d.galaxy || '').trim().slice(0, 60), star: '', economy: String(d.economy || '').trim().slice(0, 60) };
  }
  closeSheet();
  setHere(h);
  toast('Location set');
}

/* ---------- Trade routes ---------- */
const econType = s => s ? tierOf(ECON_GROUPS, s.economy) : '';
const isTradeEcon = e => Object.prototype.hasOwnProperty.call(TRADE_DEMAND, e);
const wealthShort = w => ({ '1': '★', '2': '★★', '3': '★★★', pirate: 'Pirate', none: 'No economy' }[w] || '');
const fmtPct = n => `${n > 0 ? '+' : n < 0 ? '−' : ''}${Math.abs(n).toFixed(1)}%`;
const tradeMods = s => [Number.isFinite(s.buyMod) ? `${fmtPct(s.buyMod)} to buy` : '', Number.isFinite(s.sellMod) ? `${fmtPct(s.sellMod)} to sell` : ''].filter(Boolean).join(' · ');
const isPirate = s => s.wealth === 'pirate' || norm(s.economy) === 'black market';
// Logged systems (yours and your crew's) with this economy, best place to sell first:
// same galaxy, then the highest sell price you noted, then the closest
function marketsFor(econ, from) {
  const sell = s => Number.isFinite(s.sellMod) ? s.sellMod : -1;
  return all('systems').filter(s => econType(s) === econ).map(s => ({ s, d: from ? distanceFrom(from, s) : null }))
    .sort((a, b) => ((a.d && a.d.rank === 4) - (b.d && b.d.rank === 4)) || (sell(b.s) - sell(a.s))
      || ((a.d ? a.d.rank : 9) - (b.d ? b.d.rank : 9)) || (((a.d && a.d.dist) || 0) - ((b.d && b.d.dist) || 0)) || byName(a.s, b.s));
}
const marketRow = ({ s, d }) => systemRow(s, null, '', [Number.isFinite(s.sellMod) ? `${fmtPct(s.sellMod)} sell` : 'Sell price not noted', d && d.label, wealthShort(s.wealth)].filter(Boolean).join(' · '));
function noMarket(econ) {
  const ws = (ECONOMY_WORDS.find(x => x[0] === econ) || [, []])[1];
  return `<p class="muted-note">No ${esc(econ)} system in your log yet. On the Galaxy Map, look for ${esc(ws.join(', '))}. With the Economy Scanner, the map’s economy filter shows them ${esc(ECON_COLOUR[econ])}.</p>`;
}
// What a market sells, by the system's wealth (from the wiki's Marketed tradeables)
function onSale(econ, wealth) {
  const g = goodsOf(econ);
  if (wealth === 'pirate') return 'Pirate systems don’t sell trade goods, only smuggled goods.';
  if (wealth === '3') return `All five are on sale: ${g.join(', ')}.`;
  if (wealth === '2') return `Usually ${g.slice(2).join(', ')}, and sometimes ${g[1]}. Only ★★★ systems sell ${g[0]}, the one worth most.`;
  if (wealth === '1') return `Mostly ${g[4]}, sometimes ${g[3]}. Weak economies sell little, so a ★★★ system pays far better.`;
  return `Up to five, depending on wealth: ${g.join(', ')}. ★★★ systems sell them all.`;
}
function loopOf(econ) { const out = [econ]; let e = TRADE_DEMAND[econ]; while (e && e !== econ) { out.push(e); e = TRADE_DEMAND[e]; } return out; }
const step = (n, title, small, body) => `<div class="step"><div class="step-head"><span class="step-n">${n}</span><div><b>${esc(title)}</b><small>${small}</small></div></div>${body}</div>`;

// From the economy you're in, around its loop, picking the best logged system for each stop
function routeSection(here) {
  if (!here) return '';
  const e0 = here.economy;
  if (!isTradeEcon(e0)) {
    const s = here.systemId && S.systems.get(here.systemId);
    const how = s && isMine(s) ? 'Add this system’s economy in Edit, from the Galaxy Map,' : s ? 'This system’s economy isn’t noted. Pick another system' : 'Tap Change and add this system’s economy';
    return section('Trade route from here', '', `<p class="muted-note">${how} to plan a route from here.</p>`);
  }
  const loop = loopOf(e0), steps = [];
  const prices = Number.isFinite(here.buyMod) ? ` Prices here are ${fmtPct(here.buyMod)}; the best is −30%.` : '';
  steps.push(step(1, `Buy ${e0} goods here`, esc(onSale(e0, here.wealth) + prices), ''));
  let from = here;
  for (let i = 1; i <= loop.length; i++) {
    const econ = loop[i % loop.length], carrying = loop[i - 1], last = i === loop.length;
    const best = marketsFor(econ, from)[0];
    const small = last ? `Sell the ${carrying} goods, then the loop starts again.` : `${carrying} goods sell for the most there. Then buy its ${econ} goods.`;
    steps.push(step(i + 1, last ? `Back to ${econ}` : `Sell at ${econ}`, esc(small), best ? listOf([marketRow(best)]) : noMarket(econ)));
    if (best) from = Object.assign(hereFromSystem(best.s), { economy: econ });
  }
  return section('Trade route from here', '', `<div class="steps">${steps.join('')}</div><p class="hint">Each stop is the best system of that economy in your log. Distances are from the stop before.</p>`);
}

const goodChip = g => `<button class="chip" data-act="good" data-good="${esc(g)}" aria-pressed="${S.goods.has(g)}">${esc(g)}</button>`;
function goodsSection(here) {
  const sel = S.goods;
  const box = `<div class="chip-box" data-scroll-key="goods">${TRADE_GOODS.map(([econ, gs]) => `<h4 class="guide-sub">${esc(econ)}</h4><div class="chips small">${gs.map(goodChip).join('')}</div>`).join('')}<h4 class="guide-sub">Smuggled goods</h4><div class="chips small">${SMUGGLED.map(([g]) => goodChip(g)).join('')}</div></div>`;
  const out = [section(`What are you carrying?${sel.size ? `<span class="count">${sel.size}</span>` : ''}`, sel.size ? '<button class="link-btn" data-act="goods-clear">Clear</button>' : '', box)];
  if (!sel.size) { out.push('<p class="muted-note">Tap the trade goods in your cargo to see where they sell for the most.</p>'); return out.join(''); }
  // What you picked, grouped by the economy that pays most for it
  const groups = new Map();
  for (const g of sel) {
    const info = GOODS.get(g); if (!info) continue;
    const target = info.econ ? TRADE_DEMAND[info.econ] : '';
    if (!groups.has(target)) groups.set(target, []);
    groups.get(target).push(g);
  }
  for (const [target, gs] of groups) {
    gs.sort((a, b) => GOODS.get(b).value - GOODS.get(a).value);
    const names = gs.map(g => `${g} (about ${GOODS.get(g).value.toLocaleString()} each)`).join(', ');
    if (!target) {
      const spots = all('systems').filter(s => !isPirate(s)).map(s => ({ s, d: here ? distanceFrom(here, s) : null }))
        .sort((a, b) => ((a.d ? a.d.rank : 9) - (b.d ? b.d.rank : 9)) || (((a.d && a.d.dist) || 0) - ((b.d && b.d.dist) || 0)) || byName(a.s, b.s)).slice(0, 3);
      out.push(section('Sell smuggled goods', '', `<p class="meta">${esc(names)}. Any system that isn’t pirate-controlled buys them. Watch for cargo scans on the way in.</p>${spots.length ? listOf(spots.map(({ s, d }) => systemRow(s, null, '', [d && d.label, econType(s) || s.economy, wealthShort(s.wealth)].filter(Boolean).join(' · ') || s.galaxy || 'Any system'))) : ''}`));
      continue;
    }
    const m = marketsFor(target, here);
    out.push(section(`Sell at ${esc(target)}`, '', `<p class="meta">${esc(names)}</p>${m.length ? listOf(m.slice(0, 3).map(marketRow)) + (m.length > 3 ? `<p class="meta">And ${m.length - 3} more ${esc(target)} systems in your log.</p>` : '') : noMarket(target)}`));
  }
  return out.join('');
}

function viewTrade() {
  const g = gate(); if (g) return g;
  const here = hereInfo();
  return [
    hereSection('trade'),
    routeSection(here),
    goodsSection(here),
    '<p class="hint">Trade outposts on planets pay more than space stations. Prices go up to +80% to sell and down to −30% to buy. Note both from the Galaxy Map when you log a system, and this page picks the best places for you.</p>',
  ].join('');
}
let goodsT = 0;
function toggleGood(g) {
  if (!GOODS.has(g)) return;
  if (S.goods.has(g)) S.goods.delete(g); else S.goods.add(g);
  render();
  clearTimeout(goodsT);

}

/* ---------- Recipe book ---------- */
// Dish and ingredient names already in the book, as suggestions while typing
function recipeWords() {
  const m = new Map();
